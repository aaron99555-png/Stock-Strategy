                                },
                                results: row['結果快取(勿改)'] ? JSON.parse(row['結果快取(勿改)']) : null
                            }));
                            setCalcHistory(newCalcHistory);
                        }

                        if (wb.Sheets["EPS與股期快取"]) {
                            const epsDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["EPS與股期快取"]);
                            let newEpsData = {};
                            epsDataRaw.forEach(row => {
                                if (row['股號']) {
                                    newEpsData[row['股號'].toString()] = {
                                        eps25: row['25EPS'] || '-',
                                        eps26: row['26EPS'] || '-',
                                        epsGrowth: row['成長率'] || '-',
                                        hasFutures: row['有股期'] === 'Y'
                                    };
                                }
                            });
                            setEpsData(newEpsData);
                        }

                        if (wb.Sheets["自訂股票快取"]) {
                            const customDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["自訂股票快取"]);
                            let newCustomStocks = {};
                            customDataRaw.forEach(row => {
                                if (row['股號']) {
                                    newCustomStocks[row['股號'].toString()] = {
                                        name: row['名稱'] || '',
                                        industry: row['產業'] || '匯入備份'
                                    };
                                }
                            });
                            setCustomStocks(newCustomStocks);
                        }

                        if (wb.Sheets["佳佳持股黑名單"]) {
                            const forbiddenDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["佳佳持股黑名單"]);
                            let newForbiddenStocks = [];
                            forbiddenDataRaw.forEach(row => {
                                if (row['股號'] && row['名稱']) {
                                    newForbiddenStocks.push({ id: row['股號'].toString(), name: row['名稱'] });
                                }
                            });
                            setForbiddenStocks(newForbiddenStocks.length > 0 ? newForbiddenStocks : DEFAULT_FORBIDDEN);
                        }

                        setAppAlert({ show: true, msg: 'Excel 備份資料已成功匯入還原！' });
                    } catch (err) {
                        console.error(err);
                        setAppAlert({ show: true, msg: '匯入失敗：檔案格式錯誤或損毀。請確保使用系統匯出的 Excel 檔案。' });
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null; 
            };

            return (
                <div className="min-h-screen pb-20">
                    <header className="bg-[#111827] border-b border-slate-800 sticky top-0 z-40 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                                    <TrendingUp size={20} className="text-white" />
                                </div>
                                <h1 className="text-2xl font-title tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                                    萊恩交易手札
                                </h1>
                            </div>
                            
                            <div className="flex items-center gap-3">
                                <label className="cursor-pointer flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-slate-200 transition bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                    <Upload size={14} /> 匯入備份
                                    <input type="file" accept=".xlsx, .xls" onChange={handleImportData} className="hidden" />
                                </label>
                                <button onClick={handleExportData} className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-slate-200 transition bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                <Download size={14} /> 匯出備份
                            </button>
                            <button onClick={() => {
                                const currentKey = window.localStorage.getItem('ryan_gemini_api_key') || '';
                                const key = window.prompt('【獨立網頁版專用】\n請輸入您的 Google Gemini API Key：\n(金鑰將安全地儲存於您的瀏覽器本地端)', currentKey);
                                if (key !== null) {
                                    window.localStorage.setItem('ryan_gemini_api_key', key.trim());
                                    alert('API 金鑰已儲存！AI 功能已準備就緒。');
                                }
                            }} className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-slate-200 transition bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                <Key size={14} /> 設定金鑰
                            </button>
                        </div>
                    </div>
                    <div className="max-w-7xl mx-auto px-4 flex flex-wrap gap-x-6 gap-y-2 text-sm font-bold pb-2">
                            <button onClick={() => setActiveTab('journal')} className={`py-2 px-1 border-b-2 whitespace-nowrap transition flex items-center gap-1.5 ${activeTab === 'journal' ? 'border-blue-500 text-blue-400' : 'border-transparent text-blue-500/50 hover:text-blue-400'}`}>
                                <FileText size={16} /> 模組一：選股日誌
                            </button>
                            <button onClick={() => setActiveTab('calculator')} className={`py-2 px-1 border-b-2 whitespace-nowrap transition flex items-center gap-1.5 ${activeTab === 'calculator' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-indigo-500/50 hover:text-indigo-400'}`}>
                                <Calculator size={16} /> 模組二：支撐壓力
                            </button>
                            <button onClick={() => setActiveTab('plan')} className={`py-2 px-1 border-b-2 whitespace-nowrap transition flex items-center gap-1.5 ${activeTab === 'plan' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-emerald-500/50 hover:text-emerald-400'}`}>
                                <LayoutDashboard size={16} /> 模組三：交易規劃
                            </button>
                            <button onClick={() => setActiveTab('watchlist')} className={`py-2 px-1 border-b-2 whitespace-nowrap transition flex items-center gap-1.5 ${activeTab === 'watchlist' ? 'border-yellow-500 text-yellow-400' : 'border-transparent text-yellow-500/50 hover:text-yellow-400'}`}>
                                <Star size={16} /> 模組四：追蹤清單
                            </button>
                            <button onClick={() => setActiveTab('forbidden')} className={`py-2 px-1 border-b-2 whitespace-nowrap transition flex items-center gap-1.5 ${activeTab === 'forbidden' ? 'border-red-500 text-red-400' : 'border-transparent text-red-500/50 hover:text-red-400'}`}>
                                <Ban size={16} /> 模組五：佳佳持股
                            </button>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 mt-8">
                        {activeTab === 'journal' && (
                            <StockJournal logs={logs} setLogs={setLogs} epsData={epsData} setEpsData={setEpsData} customStocks={customStocks} setCustomStocks={setCustomStocks} stockMap={stockMap} forbiddenStocks={forbiddenStocks} onAiDiagnose={handleAiDiagnose} />
                        )}
                        {activeTab === 'calculator' && (
                            <CalculatorModule calcHistory={calcHistory} setCalcHistory={setCalcHistory} stockMap={stockMap} setCustomStocks={setCustomStocks} epsData={epsData} />
                        )}
                        {activeTab === 'plan' && (
                            <PlanDashboard logs={logs} setLogs={setLogs} stockMap={stockMap} setCustomStocks={setCustomStocks} epsData={epsData} forbiddenStocks={forbiddenStocks} onAiReview={handleAiReview} />
                        )}
                        {activeTab === 'watchlist' && (
                            <WatchlistModule logs={logs} setLogs={setLogs} epsData={epsData} stockMap={stockMap} forbiddenStocks={forbiddenStocks} onAiDiagnose={handleAiDiagnose} />
                        )}
                        {activeTab === 'forbidden' && (
                            <ForbiddenModule forbiddenStocks={forbiddenStocks} setForbiddenStocks={setForbiddenStocks} stockMap={stockMap} setCustomStocks={setCustomStocks} />
                        )}
                    </main>

                    <AiModal 
                        isOpen={aiModal.isOpen} 
                        onClose={() => setAiModal({ ...aiModal, isOpen: false })} 
                        content={aiModal.content} 
                        loading={aiModal.loading} 
                        title={aiModal.title} 
                    />
                    <AlertModal isOpen={appAlert.show} message={appAlert.msg} onClose={() => setAppAlert({ show: false, msg: '' })} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
