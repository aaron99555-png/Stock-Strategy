                    </div>
                </div>
            );
        };

        // ==========================================
        // 5. 模組三：交易規劃與績效統計 (Plan & Dashboard)
        // ==========================================
        const PlanDashboard = ({ logs, setLogs, stockMap, setCustomStocks, epsData, forbiddenStocks, onAiReview }) => {
            const [filterDate, setFilterDate] = useState('all');
            const [editingId, setEditingId] = useState(null);
            const [confirm, setConfirm] = useState({ show: false, action: null });
            
            const [planDate, setPlanDate] = useState(getTodayLocal());
            const [planStockId, setPlanStockId] = useState('');
            const [planStockName, setPlanStockName] = useState('');
            const [alert, setAlert] = useState({ show: false, msg: '' });
            
            // 這裡也加入防呆 Alert State
            const [forbiddenAlert, setForbiddenAlert] = useState({ show: false, stockName: '', action: null });
            
            const [planFilters, setPlanFilters] = useState({ stock: '', status: 'all', futures: 'all' });
            const [planSort, setPlanSort] = useState({ key: 'id', direction: 'desc' });

            const handlePlanSort = (key) => {
                if (planSort.key === key) {
                    setPlanSort({ key, direction: planSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setPlanSort({ key, direction: 'desc' });
                }
            };

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setPlanStockId(val);
                
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setPlanStockName('');
                    return;
                }
                if (stockMap[trimmedVal]) {
                    setPlanStockName(stockMap[trimmedVal].name);
                }
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setPlanStockName(val);
                
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setPlanStockId('');
                    return;
                }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) {
                    setPlanStockId(foundId);
                }
            };

            const isUnknownStock = planStockId.trim() && planStockName.trim() && !stockMap[planStockId.trim()];
            const isForbiddenStock = (planStockId.trim() !== '' && forbiddenStocks.some(f => f.id === planStockId.trim())) || 
                                     (planStockName.trim() !== '' && forbiddenStocks.some(f => planStockName.includes(f.name) || f.name === planStockName.trim()));

            const stockIdsDatalist = useMemo(() => (
                <datalist id="plan-stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="plan-stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const handleAddIndependentPlan = () => {
                const sId = planStockId.trim();
                const sName = planStockName.trim();

                if (!sId || !sName) {
                    setAlert({ show: true, msg: '請填寫股號與名稱！' });
                    return;
                }

                const executeAdd = () => {
                    if (!stockMap[sId]) {
                        setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                    }
                    const newLog = {
                        id: Date.now().toString(),
                        date: planDate,
                        stockId: sId,
                        name: sName,
                        strategy: ['獨立規劃'],
                        subTags: [],
                        starred: false,
                        inPlan: true,
                        plan: { entry: '', stopLoss: '', trailing: '', exit: '', shares: '', warrantCode: '', warrantEntry: '', warrantShares: '', currentPrice: '' }
                    };
                    setLogs([...logs, newLog]);
                    setPlanStockId('');
                    setPlanStockName('');
                };

                // 動態比對，若為黑名單則暫停寫入，並喚叫大視窗
                if (forbiddenStocks.some(f => f.id === sId || sName.includes(f.name) || f.name === sName)) {
                    setForbiddenAlert({ show: true, stockName: sName, action: executeAdd });
                    return;
                }

                executeAdd();
            };

            const togglePlan = (id) => {
                const log = logs.find(l => l.id === id);
                if (!log) return;

                const executeToggle = () => {
                    setLogs(logs.map(l => l.id === id ? { ...l, inPlan: !l.inPlan } : l));
                };

                if (!log.inPlan) {
                    const isForbidden = forbiddenStocks.some(f => f.id === log.stockId || log.name.includes(f.name) || f.name === log.name);
                    if (isForbidden) {
                        setForbiddenAlert({ show: true, stockName: log.name, action: executeToggle });
                        return;
                    }
                }
                
                executeToggle();
            };

            const plannedLogs = useMemo(() => {
                return logs.filter(log => log.inPlan || (log.plan && log.plan.entry));
            }, [logs]);

            const filteredPlanLogs = useMemo(() => {
                let result = plannedLogs.slice(); 
                
                if (planFilters.stock) {
                    const kw = planFilters.stock.toLowerCase();
                    result = result.filter(l => l.stockId.toLowerCase().includes(kw) || l.name.toLowerCase().includes(kw));
                }
                if (planFilters.futures !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        if (planFilters.futures === 'yes') return eps.hasFutures;
                        return true;
                    });
                }
                if (planFilters.status !== 'all') {
                    result = result.filter(l => {
                        const p = l.plan || {};
                        const isOpen = p.entry && !p.exit;
                        const isClosed = p.entry && p.exit;
                        const isPlanning = !p.entry;
                        
                        if (planFilters.status === 'open') return isOpen;
                        if (planFilters.status === 'closed') return isClosed;
                        if (planFilters.status === 'planning') return isPlanning;
                        return true;
                    });
                }

                result.sort((a, b) => {
                    let valA, valB;
                    const pA = a.plan || {};
                    const pB = b.plan || {};

                    switch (planSort.key) {
                        case 'stock':
                            valA = a.stockId; valB = b.stockId; break;
                        case 'entry':
                            valA = parseFloat(pA.entry) || -999999; valB = parseFloat(pB.entry) || -999999; break;
                        case 'sl':
                            valA = parseFloat(pA.stopLoss) || (parseFloat(pA.entry)*0.95 || -999999);
                            valB = parseFloat(pB.stopLoss) || (parseFloat(pB.entry)*0.95 || -999999); break;
                        case 'exit':
                            valA = parseFloat(pA.currentPrice || pA.exit) || -999999;
                            valB = parseFloat(pB.currentPrice || pB.exit) || -999999; break;
                        case 'shares':
                            valA = parseFloat(pA.shares) || 0; valB = parseFloat(pB.shares) || 0; break;
                        case 'rr':
                            const getRR = (p) => {
                                if (!p.entry || !p.stopLoss || !p.exit) return -999999;
                                const risk = parseFloat(p.entry) - parseFloat(p.stopLoss);
                                const reward = parseFloat(p.exit) - parseFloat(p.entry);
                                if (risk <= 0) return -999999;
                                return reward / risk;
                            };
                            valA = getRR(pA); valB = getRR(pB); break;
                        case 'pnl':
                            const getPnl = (p) => {
                                const isOpen = p.entry && !p.exit;
                                if (p.entry && p.shares) {
                                    if (isOpen && p.currentPrice) return (parseFloat(p.currentPrice) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                    else if (!isOpen && p.exit) return (parseFloat(p.exit) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                }
                                return -9999999; 
                            };
                            valA = getPnl(pA); valB = getPnl(pB); break;
                        default: // 'id'
                            valA = parseInt(a.id); valB = parseInt(b.id); break;
                    }

                    if (valA < valB) return planSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return planSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                return result;
            }, [plannedLogs, planFilters, planSort]);

            const stats = useMemo(() => {
                let filtered = plannedLogs;
                if (filterDate === 'month') {
                    const monthAgo = new Date();
                    monthAgo.setMonth(monthAgo.getMonth() - 1);
                    filtered = plannedLogs.filter(l => new Date(l.date) >= monthAgo);
                }

                let totalTrades = 0;
                let closedTrades = 0;
                let winCount = 0;
                let totalProfit = 0;

                filtered.forEach(log => {
                    const p = log.plan || {};
                    const hasPlan = p.entry && p.shares;
                    if (hasPlan) totalTrades++;
                    
                    if (hasPlan && p.exit) {
                        closedTrades++;
                        const entry = parseFloat(p.entry);
                        const exit = parseFloat(p.exit);
                        const shares = parseFloat(p.shares) * 1000;
                        const pnl = (exit - entry) * shares;
                        totalProfit += pnl;
                        if (pnl > 0) winCount++;
                    }

                    if (p.warrantEntry && p.warrantExit && p.warrantShares) {
                        const wEntry = parseFloat(p.warrantEntry);
                        const wExit = parseFloat(p.warrantExit);
                        const wShares = parseFloat(p.warrantShares) * 1000;
                        const wPnl = (wExit - wEntry) * wShares;
                        totalProfit += wPnl;
                    }
                });

                return {
                    totalTrades,
                    closedTrades,
                    winRate: closedTrades > 0 ? ((winCount / closedTrades) * 100).toFixed(1) : 0,
                    totalProfit: Math.round(totalProfit)
                };
            }, [plannedLogs, filterDate]);

            const updatePlan = (id, field, value) => {
                setLogs(logs.map(log => {
                    if (log.id === id) {
                        let newPlan = { ...log.plan, [field]: value };
                        if (field === 'entry' && value) {
                            newPlan.stopLoss = (parseFloat(value) * 0.95).toFixed(2);
                        }
                        return { ...log, plan: newPlan };
                    }
                    return log;
                }));
            };

            const calculateRR = (p) => {
                if (!p.entry || !p.stopLoss || !p.exit) return '-';
                const risk = parseFloat(p.entry) - parseFloat(p.stopLoss);
                const reward = parseFloat(p.exit) - parseFloat(p.entry);
                if (risk <= 0) return '-';
                return (reward / risk).toFixed(2);
            };

            const StatCard = ({ title, value, unit, color }) => (
                <div className="bg-slate-900 border border-slate-700 p-5 rounded-2xl flex flex-col justify-center shadow-lg relative overflow-hidden">
                    <div className={`absolute -right-4 -bottom-4 w-20 h-20 bg-${color}-500/10 rounded-full blur-xl`}></div>
                    <div className="text-slate-400 text-sm mb-1">{title}</div>
                    <div className={`text-3xl font-bold font-mono-num text-${color}-400`}>
                        {value} <span className="text-base text-slate-500 ml-1">{unit}</span>
                    </div>
                </div>
            );

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="flex justify-between items-end mb-4">
                        <h2 className="text-2xl font-title text-emerald-400 flex items-center gap-2"><LayoutDashboard /> 績效儀表板</h2>
                        <select value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm outline-none text-slate-300">
                            <option value="all">全部紀錄</option>
                            <option value="month">近一個月</option>
                        </select>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <StatCard title="總交易次數" value={stats.totalTrades} unit="筆" color="blue" />
                        <StatCard title="已平倉次數" value={stats.closedTrades} unit="筆" color="indigo" />
                        <StatCard title="勝率" value={stats.winRate} unit="%" color="emerald" />
                        <StatCard title="總累積獲利" value={stats.totalProfit.toLocaleString()} unit="TWD" color="yellow" />
                    </div>

                    <div className="bg-[#111827] p-5 rounded-2xl border border-slate-800 shadow-lg mb-6">
                        <h3 className="text-lg font-bold text-slate-300 mb-4 flex items-center gap-2"><Target size={18} className="text-blue-400" /> 新增交易標的</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <input type="date" value={planDate} onChange={e => setPlanDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm font-mono-num focus:border-blue-500 outline-none" />
                            </div>
                            <div className="relative">
                                <input type="text" list="plan-stock-ids-list" value={planStockId} onChange={handleStockIdChange} onKeyDown={e => { if (e.key === 'Enter') handleAddIndependentPlan(); }} placeholder="股號 (可搜尋)" className={`w-full bg-slate-900 border ${isForbiddenStock ? 'border-red-500' : 'border-slate-700'} rounded-lg p-2 text-sm font-mono-num focus:border-blue-500 outline-none ${isForbiddenStock ? 'text-red-500 font-bold bg-red-900/20' : 'text-white'}`} />
                            </div>
                            <div className="relative">
                                <input type="text" list="plan-stock-names-list" value={planStockName} onChange={handleStockNameChange} onKeyDown={e => { if (e.key === 'Enter') handleAddIndependentPlan(); }} placeholder="名稱 (可反查)" className={`w-full bg-slate-900 border ${isForbiddenStock ? 'border-red-500' : (isUnknownStock ? 'border-yellow-500/50' : 'border-slate-700')} rounded-lg p-2 text-sm focus:border-blue-500 outline-none ${isForbiddenStock ? 'text-red-500 font-bold bg-red-900/20' : (stockMap[planStockId] ? 'text-green-400' : 'text-white')}`} />
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                                {isForbiddenStock && (
                                    <span className="absolute right-3 top-2 text-xs text-red-500 bg-red-500/20 px-2 py-0.5 rounded font-bold">嚴禁買入</span>
                                )}
                            </div>
                            <button onClick={handleAddIndependentPlan} className="bg-blue-600 hover:bg-blue-500 text-white rounded-lg p-2 text-sm font-bold flex items-center justify-center gap-2 transition">
                                <PlusCircle size={16} /> 加入規劃清單
                            </button>
                        </div>
                    </div>

                    <div className="bg-[#111827] rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[1000px]">
                                <thead>
                                    <tr className="bg-slate-800/50 text-slate-400 text-sm tracking-wider">
                                        <th className="p-3 align-top min-w-[180px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('stock')}>標的 / 狀態 <SortIcon sortKey="stock" currentSort={planSort} /></div>
                                            <div className="flex flex-col gap-1.5">
                                                <input type="text" placeholder="搜尋代號/名稱" value={planFilters.stock} onChange={e => setPlanFilters({...planFilters, stock: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs outline-none focus:border-blue-500" />
                                                <div className="flex gap-1.5">
                                                    <select value={planFilters.status} onChange={e => setPlanFilters({...planFilters, status: e.target.value})} className="w-1/2 bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                        <option value="all">全部狀態</option>
                                                        <option value="open">持倉中</option>
                                                        <option value="closed">已平倉</option>
                                                        <option value="planning">規劃中</option>
                                                    </select>
                                                    <select value={planFilters.futures} onChange={e => setPlanFilters({...planFilters, futures: e.target.value})} className="w-1/2 bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                        <option value="all">全部標的</option>
                                                        <option value="yes">僅有股期</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('entry')}>進場價 <SortIcon sortKey="entry" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('sl')}>停損價 <SortIcon sortKey="sl" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('exit')}>現價 / 出場 <SortIcon sortKey="exit" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('shares')}>張數 <SortIcon sortKey="shares" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('rr')}>風報比 <SortIcon sortKey="rr" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('pnl')}>預估/實現損益 <SortIcon sortKey="pnl" currentSort={planSort} /></div></th>
                                        <th className="p-3 text-center align-top">
                                            <div className="mb-2">操作</div>
                                            <button onClick={() => { setPlanFilters({stock: '', status: 'all', futures: 'all'}); setPlanSort({key: 'id', direction: 'desc'}); }} className="text-xs text-slate-500 hover:text-slate-300 underline transition">還原預設</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {filteredPlanLogs.map(log => {
                                        const p = log.plan || {};
                                        const isEditing = editingId === log.id;
                                        const isOpen = p.entry && !p.exit;
                                        
                                        let pnlValue = null;
                                        if (p.entry && p.shares) {
                                            if (isOpen && p.currentPrice) {
                                                pnlValue = (parseFloat(p.currentPrice) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                            } else if (!isOpen && p.exit) {
                                                pnlValue = (parseFloat(p.exit) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                            }
                                        }

                                        const hasFutures = epsData && epsData[log.stockId]?.hasFutures;

                                        return (
                                            <React.Fragment key={log.id}>
                                                <tr className={`hover:bg-slate-800/20 transition ${hasFutures ? 'bg-fuchsia-900/20 hover:bg-fuchsia-900/40 border-l-2 border-fuchsia-500' : 'border-l-2 border-transparent'} ${isOpen ? 'bg-blue-900/5' : ''}`}>
                                                    <td className="p-3">
                                                        <div className="font-bold text-white flex items-center">
                                                            <FuturesBadge hasFutures={hasFutures} />
                                                            {log.stockId} {log.name}
                                                        </div>
                                                        <div className="text-xs mt-1">
                                                            {isOpen ? (
                                                                <span className="bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded flex w-max items-center gap-1">
                                                                    <span className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-pulse"></span> 持倉中
                                                                </span>
                                                            ) : p.entry ? (
                                                                <span className="bg-slate-700 text-slate-400 px-2 py-0.5 rounded">已平倉</span>
                                                            ) : (
                                                                <span className="bg-slate-800 text-slate-500 px-2 py-0.5 rounded">規劃中</span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="p-3 font-mono-num text-white">{p.entry || '-'}</td>
                                                    <td className="p-3 font-mono-num text-red-400/80">{p.stopLoss || (p.entry ? (parseFloat(p.entry) * 0.95).toFixed(2) : '-')}</td>
                                                    <td className="p-3 font-mono-num text-white">
                                                        {isOpen ? (
                                                            <div className="relative w-24">
                                                                <input type="number" step="any" placeholder="輸入現價" value={p.currentPrice || ''} onChange={(e) => updatePlan(log.id, 'currentPrice', e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-yellow-400 italic outline-none focus:border-yellow-500" />
                                                            </div>
                                                        ) : (
                                                            <span className="text-white">{p.exit || '-'}</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3 font-mono-num text-white">{p.shares || '-'}</td>
                                                    <td className="p-3 font-mono-num text-purple-400">{calculateRR(p)}</td>
                                                    <td className="p-3 font-mono-num font-bold">
                                                        {pnlValue !== null ? (
                                                            <span className={pnlValue > 0 ? 'text-red-400' : pnlValue < 0 ? 'text-emerald-400' : 'text-white'}>
                                                                {pnlValue > 0 ? '+' : ''}{Math.round(pnlValue).toLocaleString()}
                                                            </span>
                                                        ) : <span className="text-white">-</span>}
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <div className="flex justify-center items-center gap-3">
                                                            <button onClick={() => onAiReview(log, pnlValue, calculateRR(p))} className="text-purple-400 hover:text-purple-300 transition" title={isOpen ? "✨ AI 持倉健診" : "✨ AI 盤後檢討"}>
                                                                <Sparkles size={20} className="hover:drop-shadow-[0_0_8px_rgba(168,85,247,0.6)]" />
                                                            </button>
                                                            <button onClick={() => setEditingId(isEditing ? null : log.id)} className={`px-3 py-1 rounded text-sm transition ${isEditing ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                                                                {isEditing ? '完成' : '規劃'}
                                                            </button>
                                                            <button onClick={() => setConfirm({ 
                                                                show: true, 
                                                                action: () => {
                                                                    setLogs(logs.map(l => l.id === log.id ? { ...l, inPlan: false, plan: { ...l.plan, entry: '', stopLoss: '', exit: '' } } : l));
                                                                }
                                                            })} className="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-500/20 rounded transition" title="移出規劃清單">
                                                                <X size={18} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                                
                                                {isEditing && (
                                                    <tr className="bg-slate-900/80 border-l-4 border-blue-500 animate-fade-in-down shadow-inner">
                                                        <td colSpan="8" className="p-6">
                                                            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">進場價 (Entry)</label>
                                                                    <input type="number" step="any" value={p.entry || ''} onChange={e => updatePlan(log.id, 'entry', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num outline-none focus:border-blue-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">停損價 (SL) <span className="text-[10px] text-slate-600">自動95折</span></label>
                                                                    <input type="number" step="any" value={p.stopLoss || ''} onChange={e => updatePlan(log.id, 'stopLoss', e.target.value)} placeholder={p.entry ? (parseFloat(p.entry) * 0.95).toFixed(2) : ''} className="w-full bg-slate-950 border border-red-900/50 rounded p-2 text-sm font-mono-num text-red-400 outline-none focus:border-red-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">移動停利 (Trailing)</label>
                                                                    <input type="number" step="any" value={p.trailing || ''} onChange={e => updatePlan(log.id, 'trailing', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num text-yellow-400 outline-none focus:border-yellow-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">出場價 (Exit)</label>
                                                                    <input type="number" step="any" value={p.exit || ''} onChange={e => updatePlan(log.id, 'exit', e.target.value)} className="w-full bg-slate-950 border border-emerald-900/50 rounded p-2 text-sm font-mono-num text-emerald-400 outline-none focus:border-emerald-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">張數</label>
                                                                    <input type="number" value={p.shares || ''} onChange={e => updatePlan(log.id, 'shares', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num outline-none focus:border-blue-500" />
                                                                </div>
                                                                
                                                                <div className="col-span-2 md:col-span-5 pt-3 mt-1 border-t border-slate-800/50">
                                                                    <span className="text-xs font-bold text-slate-500 mb-2 block">權證擴充設定</span>
                                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                                        <input type="text" placeholder="權證代號" value={p.warrantCode || ''} onChange={e => updatePlan(log.id, 'warrantCode', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                        <input type="number" step="any" placeholder="買進價" value={p.warrantEntry || ''} onChange={e => updatePlan(log.id, 'warrantEntry', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                        <input type="number" step="any" placeholder="賣出價" value={p.warrantExit || ''} onChange={e => updatePlan(log.id, 'warrantExit', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                        <input type="number" placeholder="張數" value={p.warrantShares || ''} onChange={e => updatePlan(log.id, 'warrantShares', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        )
                                    })}
                                    {plannedLogs.length === 0 && <tr><td colSpan="8" className="p-8 text-center text-slate-500">尚無規劃紀錄（請從上方新增，或至選股日誌中點擊「🎯加入規劃」）</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <AlertModal isOpen={alert.show} message={alert.msg} onClose={() => setAlert({ show: false, msg: '' })} />
                    <ConfirmModal isOpen={confirm.show} title="確認移出" message="確定要將此標的移出規劃清單嗎？（選股日誌中的原紀錄不會被刪除）" 
                        onConfirm={() => { confirm.action(); setConfirm({ show: false, action: null }); }} 
                        onCancel={() => setConfirm({ show: false, action: null })} />
                    
                    {/* 防呆大視窗 */}
                    <ForbiddenModal 
                        isOpen={forbiddenAlert.show} 
                        stockName={forbiddenAlert.stockName}
                        onConfirm={() => {
                            if (forbiddenAlert.action) forbiddenAlert.action();
                            setForbiddenAlert({ show: false, stockName: '', action: null });
                        }}
                        onCancel={() => setForbiddenAlert({ show: false, stockName: '', action: null })}
                    />
                </div>
            );
        };

        // ==========================================
        // 6. 模組四：追蹤清單 (Watchlist)
        // ==========================================
        const WatchlistModule = ({ logs, setLogs, epsData, forbiddenStocks, onAiDiagnose }) => {
            const [confirm, setConfirm] = useState({ show: false, action: null });
            const [watchlistFilters, setWatchlistFilters] = useState({ date: '', stock: '', futures: 'all', growth: 'all', tag: '', tagCount: 'all' });
            const [watchlistSort, setWatchlistSort] = useState({ key: 'id', direction: 'desc' });
            const [showForbidden, setShowForbidden] = useState(false);
            const [forbiddenAlert, setForbiddenAlert] = useState({ show: false, stockName: '', action: null });

            const handleWatchlistSort = (key) => {
                if (watchlistSort.key === key) {
                    setWatchlistSort({ key, direction: watchlistSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setWatchlistSort({ key, direction: 'desc' }); 
                }
            };

            const toggleStar = (id) => {
                setLogs(logs.map(log => log.id === id ? { ...log, starred: !log.starred } : log));
            };

            const togglePlan = (id) => {
                const log = logs.find(l => l.id === id);
                if (log && !log.inPlan) {
                    const isForbidden = forbiddenStocks.some(f => f.id === log.stockId || log.name.includes(f.name) || f.name === log.name);
                    if (isForbidden) {
                        setForbiddenAlert({ show: true, stockName: log.name, action: () => setLogs(logs.map(l => l.id === id ? { ...l, inPlan: !l.inPlan } : l)) });
                        return;
                    }
                }
                setLogs(logs.map(log => log.id === id ? { ...log, inPlan: !log.inPlan } : log));
            };

            const deleteLog = (id) => {
                setLogs(logs.filter(log => log.id !== id));
            };

            const removeTag = (logId, isSubTag, tagToRemove) => {
                setLogs(logs.map(log => {
                    if (log.id !== logId) return log;
                    const newLog = { ...log };
                    if (isSubTag) {
                        newLog.subTags = (newLog.subTags || []).filter(t => t !== tagToRemove);
                    } else {
                        const strategiesArray = Array.isArray(newLog.strategy) ? newLog.strategy : (newLog.strategy ? [newLog.strategy] : []);
                        newLog.strategy = strategiesArray.filter(s => s !== tagToRemove);
                    }
                    return newLog;
                }));
            };

            const filteredWatchlistLogs = useMemo(() => {
                let result = logs.filter(l => l.starred);
                if (watchlistFilters.date) result = result.filter(l => l.date === watchlistFilters.date);
                if (watchlistFilters.stock) {
                    const kw = watchlistFilters.stock.toLowerCase();
                    result = result.filter(l => l.stockId.toLowerCase().includes(kw) || l.name.toLowerCase().includes(kw));
                }
                if (watchlistFilters.futures !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        if (watchlistFilters.futures === 'yes') return eps.hasFutures;
                        return true;
                    });
                }
                if (watchlistFilters.growth !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        const g = parseFloat(eps.epsGrowth);
                        if (watchlistFilters.growth === 'positive') return !isNaN(g) && g > 0;
                        if (watchlistFilters.growth === 'negative') return !isNaN(g) && g < 0;
                        return true;
                    });
                }
                if (watchlistFilters.tag) {
                    result = result.filter(l => {
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        const matchMain = strats.some(sId => {
                            const s = STRATEGIES.find(x => x.id === sId);
                            return s && s.label === watchlistFilters.tag;
                        });
                        const matchSub = l.subTags && l.subTags.includes(watchlistFilters.tag);
                        return matchMain || matchSub;
                    });
                }
                if (watchlistFilters.tagCount !== 'all') {
                    result = result.filter(l => {
                        let tCount = [];
                        if (l.subTags && l.subTags.length > 0) tCount.push(...l.subTags);
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        strats.forEach(sId => {
                            const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                            if (!hasSub) tCount.push(sId);
                        });
                        const c = tCount.length;
                        if (watchlistFilters.tagCount === '1') return c === 1;
                        if (watchlistFilters.tagCount === '2') return c === 2;
                        if (watchlistFilters.tagCount === '3') return c === 3;
                        if (watchlistFilters.tagCount === '4+') return c >= 4;
                        return true;
                    });
                }

                result.sort((a, b) => {
                    let valA, valB;
                    const epsA = epsData[a.stockId] || {};
                    const epsB = epsData[b.stockId] || {};

                    switch (watchlistSort.key) {
                        case 'date': valA = a.date; valB = b.date; if (valA === valB) { valA = parseInt(a.id); valB = parseInt(b.id); } break;
                        case 'stock': valA = a.stockId; valB = b.stockId; break;
                        case 'eps25': valA = parseFloat(epsA.eps25) || -999999; valB = parseFloat(epsB.eps25) || -999999; break;
                        case 'eps26': valA = parseFloat(epsA.eps26) || -999999; valB = parseFloat(epsB.eps26) || -999999; break;
                        case 'growth': valA = parseFloat(epsA.epsGrowth) || -999999; valB = parseFloat(epsB.epsGrowth) || -999999; break;
                        case 'tags': {
                            const getScore = (l) => {
                                let t = [];
                                if (l.subTags && l.subTags.length > 0) t.push(...l.subTags);
                                const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                                strats.forEach(sId => {
                                    const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                                    if (!hasSub) t.push(sId);
                                });
                                let finalScore = t.length;
                                const eps = epsData[l.stockId] || {};
                                const g = parseFloat(eps.epsGrowth);
                                if (!isNaN(g) && g > 0) finalScore += 1;
                                return finalScore;
                            };
                            valA = getScore(a); valB = getScore(b); break;
                        }
                        default: valA = parseInt(a.id); valB = parseInt(b.id); break;
                    }
                    if (valA < valB) return watchlistSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return watchlistSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return result;
            }, [logs, watchlistFilters, epsData, watchlistSort]);

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="flex justify-between items-end mb-4">
                        <h2 className="text-2xl font-title text-yellow-400 flex items-center gap-2"><Star fill="currentColor" /> 專屬追蹤清單</h2>
                        <span className="text-sm text-slate-400">目前共追蹤 {filteredWatchlistLogs.length} 檔標的</span>
                    </div>

                    <div className="bg-[#111827] rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-800/50 text-slate-400 text-sm uppercase tracking-wider">
                                        <th className="p-3 font-medium align-top min-w-[120px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleWatchlistSort('date')}>日期 <SortIcon sortKey="date" currentSort={watchlistSort} /></div>
                                            <input type="date" value={watchlistFilters.date} onChange={e => setWatchlistFilters({...watchlistFilters, date: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs font-mono-num outline-none focus:border-blue-500" />
                                        </th>
                                        <th className="p-3 font-medium align-top min-w-[140px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleWatchlistSort('stock')}>代號 / 名稱 <SortIcon sortKey="stock" currentSort={watchlistSort} /></div>
                                            <div className="flex flex-col gap-1.5">
                                                <input type="text" placeholder="搜尋..." value={watchlistFilters.stock} onChange={e => setWatchlistFilters({...watchlistFilters, stock: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs outline-none focus:border-blue-500" />
                                                <select value={watchlistFilters.futures} onChange={e => setWatchlistFilters({...watchlistFilters, futures: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                    <option value="all">全部</option>
                                                    <option value="yes">仅顯示有股期</option>
                                                </select>
                                            </div>
                                        </th>
                                        <th className="p-3 font-medium font-mono-num align-top">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleWatchlistSort('eps25')}>25' EPS <SortIcon sortKey="eps25" currentSort={watchlistSort} /></div>
                                        </th>
                                        <th className="p-3 font-medium font-mono-num align-top">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleWatchlistSort('eps26')}>26' EPS(預) <SortIcon sortKey="eps26" currentSort={watchlistSort} /></div>
                                        </th>
                                        <th className="p-3 font-medium font-mono-num align-top whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleWatchlistSort('growth')}>EPS 成長率 <SortIcon sortKey="growth" currentSort={watchlistSort} /></div>
                                            <select value={watchlistFilters.growth} onChange={e => setWatchlistFilters({...watchlistFilters, growth: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                <option value="all">全部</option>
                                                <option value="positive">&gt; 0% (正成長)</option>
                                                <option value="negative">&lt; 0% (衰退)</option>
                                            </select>
                                        </th>
                                        <th className="p-3 font-medium align-top min-w-[160px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleWatchlistSort('tags')}>策略標籤 <SortIcon sortKey="tags" currentSort={watchlistSort} /></div>
                                            <div className="flex flex-col gap-1.5">
                                                <select value={watchlistFilters.tag} onChange={e => setWatchlistFilters({...watchlistFilters, tag: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                    <option value="">全部標籤</option>
                                                    {STRATEGIES.map(s => (
                                                        <optgroup key={s.id} label={s.label}>
                                                            <option value={s.label}>{s.label} (主策略)</option>
                                                            {(SUB_TAGS[s.id] || []).map(t => (
                                                                <option key={t} value={t}>{t}</option>
                                                            ))}
                                                        </optgroup>
                                                    ))}
                                                </select>
                                                <select value={watchlistFilters.tagCount} onChange={e => setWatchlistFilters({...watchlistFilters, tagCount: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                    <option value="all">不限條件數</option>
                                                    <option value="1">1 項條件</option>
                                                    <option value="2">2 項條件</option>
                                                    <option value="3">3 項條件</option>
                                                    <option value="4+">4 項(含)以上</option>
                                                </select>
                                            </div>
                                        </th>
                                        <th className="p-3 font-medium text-center align-top">
                                            <div className="mb-2">操作</div>
                                            <button onClick={() => { setWatchlistFilters({date: '', stock: '', futures: 'all', growth: 'all', tag: '', tagCount: 'all'}); setWatchlistSort({key: 'id', direction: 'desc'}); }} className="text-xs text-slate-500 hover:text-slate-300 underline transition">還原預設</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {filteredWatchlistLogs.map(log => {
                                        const eps = epsData[log.stockId] || { eps25: '-', eps26: '-', epsGrowth: '-', hasFutures: false };
                                        const hasFutures = eps.hasFutures;

                                        return (
                                            <tr key={log.id} className={`transition group ${hasFutures ? 'bg-fuchsia-900/20 hover:bg-fuchsia-900/40 border-l-2 border-fuchsia-500' : 'hover:bg-slate-800/20 border-l-2 border-transparent'}`}>
                                                <td className="p-4 font-mono-num text-white">{log.date}</td>
                                                <td className="p-4">
                                                    <div className="flex items-center">
                                                        <FuturesBadge hasFutures={hasFutures} />
                                                        <span className="font-mono-num font-bold mr-2 text-white">{log.stockId}</span>
                                                        <span className="text-white font-bold">{log.name}</span>
                                                    </div>
                                                </td>
                                                <td className={`p-4 font-mono-num font-bold ${getTwStockColor(eps.eps25)}`}>{eps.eps25}</td>
                                                <td className={`p-4 font-mono-num font-bold ${getTwStockColor(eps.eps26)}`}>{eps.eps26}</td>
                                                <td className={`p-4 font-mono-num font-bold ${getTwStockColor(eps.epsGrowth)}`}>{eps.epsGrowth || '-'}</td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap gap-1.5 items-center">
                                                        {log.subTags && log.subTags.length > 0 && (
                                                            log.subTags.map(t => {
                                                                const stratForTag = STRATEGIES.find(s => SUB_TAGS[s.id]?.includes(t));
                                                                return (
                                                                    <span 
                                                                        key={t} 
                                                                        onClick={() => removeTag(log.id, true, t)}
                                                                        className={`group cursor-pointer inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gradient-to-r ${SUB_TAG_COLORS[t] || stratForTag?.color || 'from-blue-600 to-indigo-600'} text-white shadow-sm hover:opacity-80 transition-all`}
                                                                        title="點擊移除標籤"
                                                                    >
                                                                        {t}
                                                                        <X size={12} className="ml-1 opacity-0 group-hover:opacity-100 transition-opacity w-3 h-3" />
                                                                    </span>
                                                                );
                                                            })
                                                        )}
                                                        {(() => {
                                                            const strategiesArray = Array.isArray(log.strategy) ? log.strategy : (log.strategy ? [log.strategy] : []);
                                                            return strategiesArray.map(stratId => {
                                                                const s = STRATEGIES.find(str => str.id === stratId);
                                                                if (!s) return null;
                                                                const hasSubTag = log.subTags?.some(tag => SUB_TAGS[stratId]?.includes(tag));
                                                                if (log.subTags && log.subTags.length > 0 && hasSubTag) return null;
                                                                return (
                                                                    <span 
                                                                        key={s.id} 
                                                                        onClick={() => removeTag(log.id, false, s.id)}
                                                                        className={`group cursor-pointer inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-gradient-to-r ${s.color} bg-opacity-10 text-white hover:opacity-80 transition-all`}
                                                                        title="點擊移除策略"
                                                                    >
                                                                        {s.emoji} {s.label}
                                                                        <X size={12} className="opacity-0 group-hover:opacity-100 transition-opacity w-3 h-3" />
                                                                    </span>
                                                                );
                                                            });
                                                        })()}
                                                    </div>
                                                </td>
                                                <td className="p-4 text-center">
                                                    <div className="flex justify-center items-center gap-3">
                                                        <button onClick={() => onAiDiagnose(log)} className="text-purple-400 hover:text-purple-300 transition" title="✨ AI 個股診斷">
                                                            <Sparkles size={20} className="hover:drop-shadow-[0_0_8px_rgba(168,85,247,0.6)]" />
                                                        </button>
                                                        <button onClick={() => togglePlan(log.id)} className={`transition ${log.inPlan ? 'text-blue-400 drop-shadow-[0_0_8px_rgba(96,165,250,0.6)]' : 'text-slate-600 hover:text-blue-400'}`} title={log.inPlan ? '移出規劃' : '加入規劃'}>
                                                            <Target size={20} />
                                                        </button>
                                                        <button onClick={() => toggleStar(log.id)} className={`transition ${log.starred ? 'text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]' : 'text-slate-600 hover:text-yellow-400'}`} title="取消追蹤">
                                                            <Star fill={log.starred ? "currentColor" : "none"} size={20} />
                                                        </button>
                                                        <button onClick={() => setConfirm({ show: true, action: () => deleteLog(log.id) })} className="text-slate-600 hover:text-red-400 transition" title="刪除">
                                                            <Trash2 size={20} />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {filteredWatchlistLogs.length === 0 && (
                                        <tr><td colSpan="7" className="p-12 text-center text-slate-500">
                                            <Star size={48} className="mx-auto text-slate-700 mb-4" />
                                            尚無追蹤標的<br/><span className="text-sm mt-2 block">在「選股日誌」點擊星星圖示即可將股票加入追蹤清單</span>
                                        </td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <ConfirmModal isOpen={confirm.show} title="確認刪除" message="您確定要刪除這筆紀錄嗎？此動作無法復原。" 
                        onConfirm={() => { confirm.action(); setConfirm({ show: false, action: null }); }} 
                        onCancel={() => setConfirm({ show: false, action: null })} />
                    
                    {/* 防呆大視窗 */}
                    <ForbiddenModal 
                        isOpen={forbiddenAlert.show} 
                        stockName={forbiddenAlert.stockName}
                        onConfirm={() => {
                            if (forbiddenAlert.action) forbiddenAlert.action();
                            setForbiddenAlert({ show: false, stockName: '', action: null });
                        }}
                        onCancel={() => setForbiddenAlert({ show: false, stockName: '', action: null })}
                    />
                </div>
            );
        };

        // ==========================================
        // 7. 模組五：佳佳持股專區 (Forbidden Module)
        // ==========================================
        const ForbiddenModule = ({ forbiddenStocks, setForbiddenStocks, stockMap, setCustomStocks }) => {
            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState('');
            const [alert, setAlert] = useState({ show: false, msg: '' });

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') { setStockName(''); return; }
                if (stockMap[trimmedVal]) setStockName(stockMap[trimmedVal].name);
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setStockName(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') { setStockId(''); return; }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) setStockId(foundId);
            };

            const handleAdd = () => {
                const sId = stockId.trim();
                const sName = stockName.trim();
                if (!sId || !sName) {
                    setAlert({ show: true, msg: '請輸入完整的股號與股名！' });
                    return;
                }
                if (forbiddenStocks.some(f => f.id === sId)) {
                    setAlert({ show: true, msg: `股號 ${sId} 已經在黑名單中囉！` });
                    return;
                }
                if (!stockMap[sId]) {
                    setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "黑名單自訂" } }));
                }
                setForbiddenStocks([{ id: sId, name: sName }, ...forbiddenStocks]);
                setStockId('');
                setStockName('');
                setAlert({ show: true, msg: `成功將「${sName}」加入嚴禁買入名單！` });
            };

            const handleDelete = (id) => {
                setForbiddenStocks(forbiddenStocks.filter(f => f.id !== id));
            };

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="bg-[#111827] p-6 rounded-2xl border border-red-900 shadow-[0_0_20px_rgba(220,38,38,0.15)] relative overflow-hidden">
                        <div className="absolute -right-10 -top-10 text-red-500/10">
                            <Ban size={200} />
                        </div>
                        <h2 className="text-2xl font-title text-red-500 mb-2 flex items-center gap-2 relative z-10"><Ban /> 佳佳持股 ‧ 嚴禁買入專區</h2>
                        <p className="text-slate-400 text-sm mb-6 relative z-10">將高風險或特定股票加入此清單後，系統將在您建立日誌或規劃時進行全域攔截，保護您的資金安全。</p>
                        
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-2 relative z-10">
                            <div className="relative">
                                <label className="block text-sm text-slate-400 mb-1">輸入股號</label>
                                <input 
                                    type="text" 
                                    value={stockId} 
                                    onChange={handleStockIdChange} 
                                    onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
                                    placeholder="e.g. 2317" 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num focus:border-red-500 outline-none transition text-white" 
                                />
                            </div>
                            <div className="col-span-2 relative">
                                <label className="block text-sm text-slate-400 mb-1">對應股票名稱 (可輸入名稱反查)</label>
                                <input 
                                    type="text" 
                                    value={stockName} 
                                    onChange={handleStockNameChange}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
                                    placeholder="輸入股名自動帶出股號..." 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 focus:border-red-500 outline-none transition text-white" 
                                />
                            </div>
                            <div className="flex items-end">
                                <button onClick={handleAdd} className="w-full bg-red-600 hover:bg-red-500 text-white p-2.5 rounded-lg font-bold flex items-center justify-center gap-2 transition shadow-lg shadow-red-900/50">
                                    <PlusCircle size={18} /> 加入黑名單
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="bg-[#111827] rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
                        <div className="p-4 border-b border-slate-800 bg-red-950/20 flex justify-between items-center">
                            <h3 className="font-bold text-red-400">目前防護名單 (共 {forbiddenStocks.length} 檔)</h3>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-0">
                            {forbiddenStocks.map(f => (
                                <div key={f.id} className="p-4 border-r border-b border-slate-800/50 hover:bg-slate-800/30 flex justify-between items-center group transition">
                                    <div>
                                        <div className="font-bold text-slate-300 font-mono-num text-sm">{f.id}</div>
                                        <div className="font-bold text-red-400 text-lg">{f.name}</div>
                                    </div>
                                    <button onClick={() => handleDelete(f.id)} className="text-slate-600 hover:text-red-500 opacity-0 group-hover:opacity-100 transition p-1 bg-red-500/10 rounded" title="解除封鎖">
                                        <Trash2 size={16} />
                                    </button>
                                </div>
                            ))}
                            {forbiddenStocks.length === 0 && (
                                <div className="col-span-full p-12 text-center text-slate-500">
                                    <Ban size={48} className="mx-auto text-slate-700 mb-4" />
                                    目前黑名單為空，您的交易沒有任何限制。
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <AlertModal isOpen={alert.show} message={alert.msg} onClose={() => setAlert({ show: false, msg: '' })} />
                </div>
            );
        };

        // ==========================================
        // 0. 主應用程式 (App)
        // ==========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('journal');
            const [appAlert, setAppAlert] = useState({ show: false, msg: '' });
            
            const [logs, setLogs] = useLocalStorage('ryan_stock_logs', []);
            const [calcHistory, setCalcHistory] = useLocalStorage('ryan_calc_history', []);
            const [epsData, setEpsData] = useLocalStorage('ryan_eps_data', {});
            const [customStocks, setCustomStocks] = useLocalStorage('ryan_custom_stocks', {});
            const [forbiddenStocks, setForbiddenStocks] = useLocalStorage('ryan_forbidden_stocks', DEFAULT_FORBIDDEN);

            // AI 相關狀態
            const { generateText } = useGeminiAPI();
            const [aiModal, setAiModal] = useState({ isOpen: false, loading: false, content: '', title: '' });

            const stockMap = useMemo(() => {
                return { ...STATIC_STOCK_DB, ...customStocks };
            }, [customStocks]);

            const handleAiDiagnose = async (log) => {
                setAiModal({ isOpen: true, loading: true, content: '', title: `✨ AI 個股診斷：${log.name}` });
                const epsInfo = epsData[log.stockId] || {};
                const strategyLabels = Array.isArray(log.strategy) ? log.strategy.map(sId => STRATEGIES.find(s => s.id === sId)?.label).filter(Boolean) : [];
                const allTags = [...strategyLabels, ...(log.subTags || [])].join('、');
                
                const prompt = `請針對台股「${log.name} (${log.stockId})」進行簡要的技術面或籌碼面診斷。
                【使用者提供的數據】
                - 策略與觀察特徵：${allTags || '無'}
                - EPS 成長率：${epsInfo.epsGrowth || '未知'}
                
                請用大約 150 字的繁體中文，給出客觀的分析與後續觀察重點，並提醒潛在風險。語氣請專業且具建設性，直接回覆重點即可，不需寒暄。`;
                
                const result = await generateText(prompt, "你是一位專業的台股分析師。");
                setAiModal(prev => ({ ...prev, loading: false, content: result }));
            };

            const handleAiReview = async (log, pnl, rr) => {
                const p = log.plan || {};
                const isOpen = p.entry && !p.exit;
                setAiModal({ isOpen: true, loading: true, content: '', title: isOpen ? `✨ AI 持倉健診：${log.name}` : `✨ AI 盤後檢討：${log.name}` });
                
                const strategyLabels = Array.isArray(log.strategy) ? log.strategy.map(sId => STRATEGIES.find(s => s.id === sId)?.label).filter(Boolean) : [];
                const allTags = [...strategyLabels, ...(log.subTags || [])].join('、');

                let prompt = "";
                if (isOpen) {
                    prompt = `我目前持倉台股「${log.name} (${log.stockId})」。
                    進場價：${p.entry}，停損價：${p.stopLoss}，目前現價：${p.currentPrice || '未知'}。
                    我的進場理由標籤：${allTags || '無'}。
                    目前未實現損益：${pnl ? Math.round(pnl) + '元' : '未知'}。
                    請以專業交易心理教練的身份，用大約 150 字給我持倉中的心理建議與停利停損的紀律提醒。請使用繁體中文。`;
                } else {
                    prompt = `我剛完成了一筆台股「${log.name} (${log.stockId})」的交易。
                    進場價：${p.entry}，出場價：${p.exit}，當初設定的停損價：${p.stopLoss}。
                    我的進場理由標籤：${allTags || '無'}。
                    這筆交易的最終損益為：${pnl > 0 ? '獲利' : '虧損'} ${pnl ? Math.abs(Math.round(pnl)) + '元' : '未知'}，風報比為：${rr}。
                    請以專業交易心理教練的身份，用大約 150 字幫我做盤後檢討，針對我的執行紀律給予回饋或鼓勵。請使用繁體中文。`;
                }

                const result = await generateText(prompt, "你是一位專業的金融交易心理教練。");
                setAiModal(prev => ({ ...prev, loading: false, content: result }));
            };

            const handleExportData = () => {
                const wb = XLSX.utils.book_new();

                const logsSheetData = logs.map(l => ({
                    '系統ID(勿改)': l.id,
                    '日期': l.date,
                    '股號': l.stockId,
                    '名稱': l.name,
                    '主策略': Array.isArray(l.strategy) ? l.strategy.join(',') : (l.strategy || ''),
                    '進階標籤': Array.isArray(l.subTags) ? l.subTags.join(',') : '',
                    '追蹤標記': l.starred ? 'Y' : 'N',
                    '加入規劃': l.inPlan ? 'Y' : 'N',
                    '進場價': l.plan?.entry || '',
                    '停損價': l.plan?.stopLoss || '',
                    '移動停利': l.plan?.trailing || '',
                    '出場價': l.plan?.exit || '',
                    '張數': l.plan?.shares || '',
                    '現價': l.plan?.currentPrice || '',
                    '權證代號': l.plan?.warrantCode || '',
                    '權證買進': l.plan?.warrantEntry || '',
                    '權證賣出': l.plan?.warrantExit || '',
                    '權證張數': l.plan?.warrantShares || ''
                }));
                const wsLogs = XLSX.utils.json_to_sheet(logsSheetData);
                XLSX.utils.book_append_sheet(wb, wsLogs, "選股與規劃");

                const calcSheetData = calcHistory.map(c => ({
                    '系統ID(勿改)': c.id,
                    '日期': c.date,
                    '盤別': c.session,
                    '股號': c.stockId,
                    '名稱': c.name,
                    'H': c.inputs.h,
                    'L': c.inputs.l,
                    'C': c.inputs.c,
                    '結果快取(勿改)': JSON.stringify(c.results)
                }));
                const wsCalc = XLSX.utils.json_to_sheet(calcSheetData);
                XLSX.utils.book_append_sheet(wb, wsCalc, "支撐壓力紀錄");

                const epsSheetData = Object.keys(epsData).map(id => ({
                    '股號': id,
                    '25EPS': epsData[id].eps25,
                    '26EPS': epsData[id].eps26,
                    '成長率': epsData[id].epsGrowth,
                    '有股期': epsData[id].hasFutures ? 'Y' : 'N'
                }));
                const wsEps = XLSX.utils.json_to_sheet(epsSheetData);
                XLSX.utils.book_append_sheet(wb, wsEps, "EPS與股期快取");

                const customStocksData = Object.keys(customStocks).map(id => ({
                    '股號': id,
                    '名稱': customStocks[id].name,
                    '產業': customStocks[id].industry
                }));
                const wsCustom = XLSX.utils.json_to_sheet(customStocksData);
                XLSX.utils.book_append_sheet(wb, wsCustom, "自訂股票快取");

                const forbiddenSheetData = forbiddenStocks.map(f => ({
                    '股號': f.id,
                    '名稱': f.name
                }));
                const wsForbidden = XLSX.utils.json_to_sheet(forbiddenSheetData);
                XLSX.utils.book_append_sheet(wb, wsForbidden, "佳佳持股黑名單");

                XLSX.writeFile(wb, `萊恩手札備份_${getTodayLocal()}.xlsx`);
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });

                        if (wb.Sheets["選股與規劃"]) {
                            const logsData = XLSX.utils.sheet_to_json(wb.Sheets["選股與規劃"]);
                            const newLogs = logsData.map(row => ({
                                id: row['系統ID(勿改)']?.toString() || Date.now().toString() + Math.random(),
                                date: row['日期'] || '',
                                stockId: row['股號']?.toString() || '',
                                name: row['名稱'] || '',
                                strategy: row['主策略'] ? row['主策略'].toString().split(',') : [],
                                subTags: row['進階標籤'] ? row['進階標籤'].toString().split(',') : [],
                                starred: row['追蹤標記'] === 'Y',
                                inPlan: row['加入規劃'] === 'Y',
                                plan: {
                                    entry: row['進場價']?.toString() || '',
                                    stopLoss: row['停損價']?.toString() || '',
                                    trailing: row['移動停利']?.toString() || '',
                                    exit: row['出場價']?.toString() || '',
                                    shares: row['張數']?.toString() || '',
                                    currentPrice: row['現價']?.toString() || '',
                                    warrantCode: row['權證代號']?.toString() || '',
                                    warrantEntry: row['權證買進']?.toString() || '',
                                    warrantExit: row['權證賣出']?.toString() || '',
                                    warrantShares: row['權證張數']?.toString() || ''
                                }
                            }));
                            setLogs(newLogs);
                        }

                        if (wb.Sheets["支撐壓力紀錄"]) {
                            const calcData = XLSX.utils.sheet_to_json(wb.Sheets["支撐壓力紀錄"]);
                            const newCalcHistory = calcData.map(row => ({
                                id: row['系統ID(勿改)']?.toString() || Date.now().toString() + Math.random(),
                                date: row['日期'] || '',
                                session: row['盤別'] || '日盤',
                                stockId: row['股號']?.toString() || '',
                                name: row['名稱'] || '',
                                inputs: {
                                    h: row['H']?.toString() || '',
                                    l: row['L']?.toString() || '',
                                    c: row['C']?.toString() || ''
