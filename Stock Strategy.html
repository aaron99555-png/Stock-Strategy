<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萊恩交易手札</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
        }
    }
    </script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-main: #0B1121;
            --bg-card: #111827;
            --bg-card-alt: #0f172a;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-main);
            color: #f8fafc;
            overflow-x: hidden;
        }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        .font-title { font-family: 'Ma Shan Zheng', cursive; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.8); }
            60% { opacity: 1; transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-fade-in-down { animation: fadeInDown 0.4s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .animate-bounce-in { animation: bounceIn 0.5s ease-out forwards; }
        
        /* Tailwind config overrides */
        script[type="text/tailwindcss"] {
            theme: {
                extend: {
                    colors: {
                        slate: { 900: '#0f172a' }
                    }
                }
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            TrendingUp, BarChart2, Zap, AlertCircle, Save, Trash2, 
            Download, Upload, Eye, FileText, CheckCircle, Calculator,
            ClipboardCopy, Search, PlusCircle, LayoutDashboard, Star, X, Target,
            ArrowUp, ArrowDown, ArrowUpDown
        } from 'lucide-react';

        // ==========================================
        // 1. 靜態資料庫 (STATIC_STOCK_DB) Mock Data
        // ==========================================
        const STATIC_STOCK_DB = {};

        // ==========================================
        // 2. 共用元件 (Hooks & Modals)
        // ==========================================
        const fallbackCopyTextToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
            } catch (err) {
                console.error('Fallback: Oops, unable to copy', err);
            }
            document.body.removeChild(textArea);
        };

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        }

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            const btnRef = useRef(null);

            useEffect(() => {
                if (isOpen && btnRef.current) {
                    setTimeout(() => btnRef.current.focus(), 10);
                }

                if (!isOpen) return;
                
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        e.stopPropagation();
                        onConfirm();
                    } else if (e.key === 'Escape') {
                        e.preventDefault();
                        e.stopPropagation();
                        onCancel();
                    }
                };
                
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onConfirm, onCancel]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in-down">
                    <div className="bg-slate-900 border border-slate-700 p-6 rounded-xl w-96 shadow-2xl">
                        <div className="flex items-center gap-3 mb-4 text-red-400">
                            <AlertCircle size={24} />
                            <h3 className="text-xl font-bold">{title}</h3>
                        </div>
                        <p className="text-slate-300 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition outline-none focus:ring-2 focus:ring-slate-500">取消 (ESC)</button>
                            <button ref={btnRef} onClick={onConfirm} className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 transition text-white outline-none focus:ring-2 focus:ring-red-400">確認執行 (Enter)</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AlertModal = ({ isOpen, message, onClose }) => {
            const btnRef = useRef(null);

            useEffect(() => {
                if (isOpen && btnRef.current) {
                    setTimeout(() => btnRef.current.focus(), 10);
                }

                if (!isOpen) return;
                
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter' || e.key === 'Escape') {
                        e.preventDefault();
                        e.stopPropagation();
                        onClose();
                    }
                };
                
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onClose]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 animate-bounce-in">
                    <div className="bg-slate-900 border border-slate-700 p-6 rounded-xl w-80 shadow-2xl text-center">
                        <CheckCircle size={48} className="mx-auto text-green-500 mb-4" />
                        <p className="text-slate-200 mb-6 text-lg">{message}</p>
                        <button ref={btnRef} onClick={onClose} className="px-6 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 transition w-full text-white outline-none focus:ring-2 focus:ring-blue-400">了解 (Enter)</button>
                    </div>
                </div>
            );
        };

        // 共用排序圖示元件
        const SortIcon = ({ sortKey, currentSort }) => {
            if (currentSort.key !== sortKey) return <ArrowUpDown size={14} className="text-slate-600 opacity-50" />;
            return currentSort.direction === 'asc' ? <ArrowUp size={14} className="text-blue-400" /> : <ArrowDown size={14} className="text-blue-400" />;
        };

        // 共用：股期標示元件
        const FuturesBadge = ({ hasFutures }) => {
            if (!hasFutures) return null;
            return (
                <span className="bg-fuchsia-600/90 text-white text-[10px] px-1.5 py-0.5 rounded shadow-sm mr-1.5 flex-shrink-0" title="具備個股期貨">期</span>
            );
        };

        // ==========================================
        // 3. 模組一：選股日誌與 EPS (Stock Journal)
        // ==========================================
        const STRATEGIES = [
            { id: 'trend', label: '趨勢與型態', icon: TrendingUp, color: 'from-blue-600 to-indigo-600', emoji: '📈' },
            { id: 'chips', label: '籌碼與法人', icon: BarChart2, color: 'from-emerald-600 to-teal-600', emoji: '💧' },
            { id: 'daytrade', label: '當沖專區', icon: Zap, color: 'from-orange-500 to-red-600', emoji: '⚡' },
            { id: 'emerging', label: '興櫃專區', icon: AlertCircle, color: 'from-purple-600 to-pink-600', emoji: '🚀' },
        ];

        const SUB_TAGS = {
            'trend': ['量價齊揚', '芝麻開花', '月來越好', '季不可失', '守株待兔', 'OBV突破', '回後買上漲', '高成交值多頭突破上關', '高成交值', 'KD金叉', 'MACD翻紅', '收盤期貨續拉', '跌破月季線'],
            'chips': ['法人加持', '外資買進', '投信買進', '權證大單追蹤', '四線上揚籌碼集中', '多頭月營收創高', '1日籌碼集中度>10%', '1日籌碼集中度>20%', '5日籌碼集中度>10%', '5日籌碼集中度>20%'],
            'daytrade': ['當沖多方標的', '當沖空方標的', '當沖十字變盤'],
            'emerging': ['興櫃-多頭突破上關價']
        };

        const SUB_TAG_COLORS = {
            '量價齊揚': 'from-red-500 to-rose-600',
            '芝麻開花': 'from-orange-400 to-amber-500',
            '月來越好': 'from-amber-500 to-yellow-500',
            '季不可失': 'from-lime-500 to-green-600',
            '守株待兔': 'from-emerald-500 to-teal-600',
            'OBV突破': 'from-teal-500 to-cyan-600',
            '回後買上漲': 'from-cyan-500 to-sky-600',
            '高成交值多頭突破上關': 'from-sky-500 to-blue-600',
            '高成交值': 'from-rose-500 to-red-600',
            'KD金叉': 'from-blue-500 to-indigo-600',
            'MACD翻紅': 'from-indigo-500 to-violet-600',
            '收盤期貨續拉': 'from-violet-500 to-purple-600',
            '跌破月季線': 'from-fuchsia-500 to-pink-600',
            
            '法人加持': 'from-rose-500 to-pink-600',
            '外資買進': 'from-pink-500 to-fuchsia-600',
            '投信買進': 'from-fuchsia-500 to-purple-600',
            '權證大單追蹤': 'from-purple-500 to-violet-600',
            '四線上揚籌碼集中': 'from-violet-500 to-indigo-600',
            '多頭月營收創高': 'from-indigo-500 to-blue-600',
            '1日籌碼集中度>10%': 'from-blue-500 to-sky-600',
            '1日籌碼集中度>20%': 'from-sky-500 to-cyan-600',
            '5日籌碼集中度>10%': 'from-cyan-500 to-teal-600',
            '5日籌碼集中度>20%': 'from-teal-500 to-emerald-600',

            '當沖多方標的': 'from-red-600 to-orange-600',
            '當沖空方標的': 'from-green-600 to-emerald-600',
            '當沖十字變盤': 'from-slate-500 to-slate-700',

            '興櫃-多頭突破上關價': 'from-amber-600 to-orange-700'
        };

        const StockJournal = ({ logs, setLogs, customStocks, setCustomStocks, epsData, setEpsData, stockMap }) => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [copyStartDate, setCopyStartDate] = useState(new Date().toISOString().split('T')[0]);
            const [copyEndDate, setCopyEndDate] = useState(new Date().toISOString().split('T')[0]);
            const [copySubTags, setCopySubTags] = useState([]); 
            const [isCopyDropdownOpen, setIsCopyDropdownOpen] = useState(false);
            const copyDropdownRef = useRef(null);
            
            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState('');
            const [selectedStrategy, setSelectedStrategy] = useState('');
            const [selectedSubTags, setSelectedSubTags] = useState([]);
            const [alert, setAlert] = useState({ show: false, msg: '' });
            const [confirm, setConfirm] = useState({ show: false, action: null });
            const [copySuccess, setCopySuccess] = useState(null); 

            // 表格直覺篩選狀態
            const [journalFilters, setJournalFilters] = useState({ date: '', stock: '', futures: 'all', growth: 'all', tag: '' });
            // 新增排序狀態
            const [journalSort, setJournalSort] = useState({ key: 'id', direction: 'desc' });

            const handleJournalSort = (key) => {
                if (journalSort.key === key) {
                    setJournalSort({ key, direction: journalSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setJournalSort({ key, direction: 'desc' }); 
                }
            };

            // 根據篩選條件過濾與排序日誌
            const filteredJournalLogs = useMemo(() => {
                let result = logs.slice();
                
                // 1. 篩選邏輯
                if (journalFilters.date) result = result.filter(l => l.date === journalFilters.date);
                if (journalFilters.stock) {
                    const kw = journalFilters.stock.toLowerCase();
                    result = result.filter(l => l.stockId.toLowerCase().includes(kw) || l.name.toLowerCase().includes(kw));
                }
                if (journalFilters.futures !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        if (journalFilters.futures === 'yes') return eps.hasFutures;
                        return true; // (目前不提供 'no' 的選項，只提供 'all' 和 'yes')
                    });
                }
                if (journalFilters.growth !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        const g = parseFloat(eps.epsGrowth);
                        if (journalFilters.growth === 'positive') return !isNaN(g) && g > 0;
                        if (journalFilters.growth === 'negative') return !isNaN(g) && g < 0;
                        return true;
                    });
                }
                if (journalFilters.tag) {
                    result = result.filter(l => {
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        const matchMain = strats.some(sId => {
                            const s = STRATEGIES.find(x => x.id === sId);
                            return s && s.label === journalFilters.tag;
                        });
                        const matchSub = l.subTags && l.subTags.includes(journalFilters.tag);
                        return matchMain || matchSub;
                    });
                }

                // 2. 排序邏輯
                result.sort((a, b) => {
                    let valA, valB;
                    const epsA = epsData[a.stockId] || {};
                    const epsB = epsData[b.stockId] || {};

                    switch (journalSort.key) {
                        case 'date':
                            valA = a.date; valB = b.date;
                            if (valA === valB) { valA = parseInt(a.id); valB = parseInt(b.id); } 
                            break;
                        case 'stock':
                            valA = a.stockId; valB = b.stockId; break;
                        case 'eps25':
                            valA = parseFloat(epsA.eps25) || -999999; valB = parseFloat(epsB.eps25) || -999999; break;
                        case 'eps26':
                            valA = parseFloat(epsA.eps26) || -999999; valB = parseFloat(epsB.eps26) || -999999; break;
                        case 'growth':
                            valA = parseFloat(epsA.epsGrowth) || -999999; valB = parseFloat(epsB.epsGrowth) || -999999; break;
                        case 'tags':
                            valA = (a.subTags?.length || 0) + (Array.isArray(a.strategy) ? a.strategy.length : (a.strategy ? 1 : 0));
                            valB = (b.subTags?.length || 0) + (Array.isArray(b.strategy) ? b.strategy.length : (b.strategy ? 1 : 0));
                            break;
                        default: // 'id'
                            valA = parseInt(a.id); valB = parseInt(b.id); break;
                    }

                    if (valA < valB) return journalSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return journalSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                return result;
            }, [logs, journalFilters, epsData, journalSort]);

            // 處理點擊外部關閉多選下拉選單
            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (copyDropdownRef.current && !copyDropdownRef.current.contains(event.target)) {
                        setIsCopyDropdownOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockName('');
                    return;
                }
                if (stockMap[trimmedVal]) {
                    setStockName(stockMap[trimmedVal].name);
                }
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setStockName(val);
                
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockId('');
                    return;
                }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) {
                    setStockId(foundId);
                }
            };

            const isUnknownStock = stockId.trim() && stockName.trim() && !stockMap[stockId.trim()];

            const stockIdsDatalist = useMemo(() => (
                <datalist id="stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const handleAddLog = () => {
                const sId = stockId.trim();
                const sName = stockName.trim();
                
                if (!sId || !sName || !selectedStrategy) {
                    setAlert({ show: true, msg: '請填寫完整資訊 (股號、名稱、策略)！' });
                    return;
                }

                if (!stockMap[sId]) {
                    setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                }

                const existingLogIndex = logs.findIndex(l => l.date === date && l.stockId === sId);

                if (existingLogIndex !== -1) {
                    const updatedLogs = [...logs];
                    const existingLog = { ...updatedLogs[existingLogIndex] };
                    
                    let currentStrategies = Array.isArray(existingLog.strategy) ? [...existingLog.strategy] : (existingLog.strategy ? [existingLog.strategy] : []);
                    if (!currentStrategies.includes(selectedStrategy)) {
                        currentStrategies.push(selectedStrategy);
                    }
                    existingLog.strategy = currentStrategies;

                    let currentSubTags = existingLog.subTags ? [...existingLog.subTags] : [];
                    selectedSubTags.forEach(tag => {
                        if (!currentSubTags.includes(tag)) {
                            currentSubTags.push(tag);
                        }
                    });
                    existingLog.subTags = currentSubTags;

                    updatedLogs[existingLogIndex] = existingLog;
                    setLogs(updatedLogs);
                } else {
                    const newLog = {
                        id: Date.now().toString(),
                        date,
                        stockId: sId,
                        name: sName,
                        strategy: [selectedStrategy], 
                        subTags: selectedSubTags,
                        starred: false,
                        plan: { entry: '', stopLoss: '', trailing: '', exit: '', shares: '', warrantCode: '', warrantEntry: '', warrantShares: '', currentPrice: '' }
                    };
                    setLogs([...logs, newLog]);
                }
                
                setStockId('');
                setStockName('');
            };

            const toggleSubTag = (tag) => {
                if (selectedSubTags.includes(tag)) {
                    setSelectedSubTags([]);
                } else {
                    setSelectedSubTags([tag]);
                }
            };
            
            const handleStrategySelect = (id) => {
                setSelectedStrategy(id);
                setSelectedSubTags([]); 
            };

            const toggleStar = (id) => {
                setLogs(logs.map(log => log.id === id ? { ...log, starred: !log.starred } : log));
            };

            const togglePlan = (id) => {
                setLogs(logs.map(log => log.id === id ? { ...log, inPlan: !log.inPlan } : log));
            };

            const deleteLog = (id) => {
                setLogs(logs.filter(log => log.id !== id));
            };

            const removeTag = (logId, isSubTag, tagToRemove) => {
                setLogs(logs.map(log => {
                    if (log.id !== logId) return log;
                    
                    const newLog = { ...log };
                    if (isSubTag) {
                        newLog.subTags = (newLog.subTags || []).filter(t => t !== tagToRemove);
                    } else {
                        const strategiesArray = Array.isArray(newLog.strategy) ? newLog.strategy : (newLog.strategy ? [newLog.strategy] : []);
                        newLog.strategy = strategiesArray.filter(s => s !== tagToRemove);
                    }
                    return newLog;
                }));
            };

            const handleEpsImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const bstr = evt.target.result;
                    const wb = XLSX.read(bstr, { type: 'binary' });
                    const wsname = wb.SheetNames[0];
                    const ws = wb.Sheets[wsname];
                    const data = XLSX.utils.sheet_to_json(ws);
                    
                    let newEps = { ...epsData };
                    let newCustom = { ...customStocks };
                    let addedCustomCount = 0;

                    data.forEach(row => {
                        const code = row['代號'] || row['code'] || row['Code'];
                        const name = row['股名'] || row['名稱'] || row['name'] || row['Name'];
                        const eps25 = row['2025EPS'] || row['2025'] || row['25'] || row['EPS25'];
                        const eps26 = row['預估2026EPS'] || row['2026'] || row['26'] || row['EPS26'];
                        const epsGrowth = row['EPS成長率'] || row['成長率']; 
                        const futures = row['股期'] || row['期貨']; // 讀取股期判斷

                        if (code) {
                            const strCode = String(code).trim();
                            
                            let formattedGrowth = '-';
                            if (epsGrowth !== undefined && epsGrowth !== null && String(epsGrowth).trim().toUpperCase() !== 'NAN') {
                                const numGrowth = parseFloat(epsGrowth);
                                if (!isNaN(numGrowth)) {
                                    // 將原始數值乘上 100，轉換為百分比格式 (例: 1.10 -> 110%)
                                    formattedGrowth = Number((numGrowth * 100).toFixed(2)) + '%';
                                } else {
                                    formattedGrowth = epsGrowth; 
                                }
                            }

                            // 判斷是否具備股期 (只要欄位內有值就判定為 true)
                            const hasFutures = !!futures && String(futures).trim() !== '';

                            newEps[strCode] = { 
                                eps25: eps25 !== undefined && eps25 !== null ? eps25 : '-', 
                                eps26: eps26 !== undefined && eps26 !== null ? eps26 : '-',
                                epsGrowth: formattedGrowth,
                                hasFutures: hasFutures
                            };

                            if (!stockMap[strCode] && name) {
                                newCustom[strCode] = { name: String(name).trim(), industry: "匯入補齊" };
                                addedCustomCount++;
                            }
                        }
                    });
                    setEpsData(newEps);
                    setCustomStocks(newCustom);
                    setAlert({ show: true, msg: `EPS 與股期資料匯入成功！自動補齊了 ${addedCustomCount} 檔未知股票。` });
                };
                reader.readAsBinaryString(file);
                // 清空 input 讓同檔名可以再次觸發 onChange
                e.target.value = null;
            };

            const copyLogs = (formatType) => {
                // 動態判斷複製輸出時的標題
                let titleName = "多層篩選漏斗";
                if (formatType === 'score-futures') {
                    titleName = "個股期篩選漏斗";
                }

                // 處理日期區間
                const sDate = copyStartDate <= copyEndDate ? copyStartDate : copyEndDate;
                const eDate = copyStartDate <= copyEndDate ? copyEndDate : copyStartDate;
                const dateRangeStr = sDate === eDate ? sDate : `${sDate} ~ ${eDate}`;

                let resultText = `| ${dateRangeStr} ${titleName} |\n`;
                const now = new Date();
                const timeString = now.toLocaleTimeString('zh-TW', { hour12: false });
                resultText += `產出時間：${dateRangeStr} ${timeString}\n`;
                
                if (copySubTags.length > 0) {
                    resultText += `🎯 指定篩選：${copySubTags.join(', ')}\n`;
                }
                resultText += `\n`;
                
                // 1. 根據日期區間初步過濾
                let targetLogs = logs.filter(l => l.date >= sDate && l.date <= eDate);
                
                // 2. 根據指定標籤過濾符合的標的
                if (copySubTags.length > 0) {
                    targetLogs = targetLogs.filter(l => {
                        const hasSub = l.subTags && l.subTags.some(t => copySubTags.includes(t));
                        return hasSub;
                    });
                }

                if (targetLogs.length === 0) {
                    setAlert({ show: true, msg: `找不到 ${dateRangeStr} ${copySubTags.length > 0 ? '符合所選標籤' : ''}的選股紀錄！` });
                    return;
                }

                // 3. 預先計算並整理每檔股票的標籤與總分
                const processedLogs = targetLogs.map(l => {
                    let allTags = [];
                    if (l.subTags && l.subTags.length > 0) {
                        allTags.push(...l.subTags);
                    }
                    const strategiesArray = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                    strategiesArray.forEach(sId => {
                        const s = STRATEGIES.find(str => str.id === sId);
                        if (s) {
                            const hasSubTag = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                            if (!hasSubTag) allTags.push(s.label);
                        }
                    });

                    const score = allTags.length;
                    
                    // 根據選擇決定要顯示的標籤 (未選則全顯示)
                    let displayTags = allTags;
                    if (copySubTags.length > 0) {
                        displayTags = allTags.filter(t => copySubTags.includes(t));
                    }

                    return { ...l, allTags, displayTags, score };
                });

                let detailText = ``;

                if (formatType === 'time') {
                    processedLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));

                    processedLogs.forEach(l => {
                        const countStr = l.score > 0 ? ` (${l.score}分)` : '';
                        const tagStr = l.displayTags.length > 0 ? ` (${l.displayTags.join('、')})` : '';
                        detailText += `- ${l.stockId} ${l.name}${countStr}${tagStr}\n`;
                    });
                } else if (formatType === 'strategy') {
                    const groupMap = {};
                    processedLogs.forEach(l => {
                        let tagsToGroup = l.displayTags;
                        if (tagsToGroup.length === 0) tagsToGroup = ['未分類'];

                        tagsToGroup.forEach(tag => {
                            if (!groupMap[tag]) groupMap[tag] = [];
                            if (!groupMap[tag].includes(l)) {
                                groupMap[tag].push(l);
                            }
                        });
                    });

                    STRATEGIES.forEach(strat => {
                        if (groupMap[strat.label] && groupMap[strat.label].length > 0) {
                            let tagLogs = groupMap[strat.label];
                            tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            detailText += `🎯 [${strat.label}] (共 ${tagLogs.length} 檔)\n`;
                            tagLogs.forEach(l => detailText += `  - ${l.stockId} ${l.name}\n`);
                            detailText += `\n`;
                        }
                        
                        const subTags = SUB_TAGS[strat.id] || [];
                        subTags.forEach(tag => {
                            if (groupMap[tag] && groupMap[tag].length > 0) {
                                let tagLogs = groupMap[tag];
                                tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                                detailText += `🎯 [${tag}] (共 ${tagLogs.length} 檔)\n`;
                                tagLogs.forEach(l => detailText += `  - ${l.stockId} ${l.name}\n`);
                                detailText += `\n`;
                            }
                        });
                    });

                    if (groupMap['未分類'] && groupMap['未分類'].length > 0) {
                        let tagLogs = groupMap['未分類'];
                        tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                        detailText += `🎯 [未分類] (共 ${tagLogs.length} 檔)\n`;
                        tagLogs.forEach(l => detailText += `  - ${l.stockId} ${l.name}\n`);
                        detailText += `\n`;
                    }
                } else if (formatType === 'score') {
                    processedLogs.sort((a, b) => b.score - a.score || parseInt(a.id) - parseInt(b.id));

                    processedLogs.forEach(l => {
                        const countStr = l.score > 0 ? ` (${l.score}分)` : '';
                        const tagStr = l.displayTags.length > 0 ? ` (${l.displayTags.join('、')})` : '';
                        detailText += `- ${l.stockId} ${l.name}${countStr}${tagStr}\n`;
                    });
                } else if (formatType === 'score-futures') {
                    // 格式四：僅篩選有股期標的，並依照策略標籤數量做為分數，由高到低排序
                    const futuresLogs = processedLogs.filter(l => epsData[l.stockId]?.hasFutures);
                    
                    if (futuresLogs.length === 0) {
                        setAlert({ show: true, msg: `找不到 ${dateRangeStr} 符合條件且具備「股期」的選股紀錄！` });
                        return;
                    }

                    futuresLogs.sort((a, b) => b.score - a.score || parseInt(a.id) - parseInt(b.id));

                    futuresLogs.forEach(l => {
                        const countStr = l.score > 0 ? ` (${l.score}分)` : '';
                        const tagStr = l.displayTags.length > 0 ? ` (${l.displayTags.join('、')})` : '';
                        detailText += `- ${l.stockId} ${l.name}${countStr}${tagStr}\n`;
                    });
                }

                resultText += detailText;
                resultText += `-------------------\n⚠️ 免責聲明：本資訊僅供個人交易紀錄參考，非任何買賣建議，投資有賺有賠，請盈虧自負。`;
                
                fallbackCopyTextToClipboard(resultText);
                setCopySuccess(formatType);
                setTimeout(() => setCopySuccess(null), 2000); 
            };

            return (
                <div className="animate-fade-in-up space-y-6">
                    {/* 控制區塊 */}
                    <div className="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-lg">
                        <h2 className="text-2xl font-title text-blue-400 mb-6 flex items-center gap-2"><FileText /> 新增選股日誌</h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">日期</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" />
                            </div>
                            <div className="relative">
                                <label className="block text-sm text-slate-400 mb-1">股號</label>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        list="stock-ids-list"
                                        value={stockId} 
                                        onChange={handleStockIdChange} 
                                        onKeyDown={e => { if (e.key === 'Enter') handleAddLog(); }}
                                        placeholder="e.g. 2330" 
                                        className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num focus:border-blue-500 outline-none transition" 
                                    />
                                </div>
                            </div>
                            <div className="col-span-2">
                                <label className="block text-sm text-slate-400 mb-1">對應股票名稱 (可輸入名稱反查)</label>
                                <div className="relative h-[46px]">
                                    <input 
                                        type="text" 
                                        list="stock-names-list"
                                        value={stockName} 
                                        onChange={handleStockNameChange}
                                        onKeyDown={e => { if (e.key === 'Enter') handleAddLog(); }}
                                        placeholder="輸入股名自動帶出股號..." 
                                        className={`w-full h-full bg-slate-800/50 border ${isUnknownStock ? 'border-yellow-500/50' : 'border-slate-700/50'} rounded-lg p-2.5 focus:border-blue-500 outline-none transition ${stockMap[stockId] ? 'text-green-400 font-bold' : 'text-slate-200'}`} 
                                    />
                                    {isUnknownStock && (
                                        <span className="absolute right-3 top-2.5 text-xs text-yellow-500 bg-yellow-500/10 px-2 py-1 rounded">送出自動記憶</span>
                                    )}
                                </div>
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                            </div>
                        </div>

                        <div className="mb-6">
                            <label className="block text-sm text-slate-400 mb-2">符合策略條件</label>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                {STRATEGIES.map(s => (
                                    <button 
                                        key={s.id}
                                        onClick={() => handleStrategySelect(s.id)}
                                        className={`flex flex-col items-center justify-center p-3 rounded-xl border transition-all ${selectedStrategy === s.id ? `bg-gradient-to-br ${s.color} border-transparent text-white shadow-lg scale-105` : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                    >
                                        <s.icon size={24} className="mb-2" />
                                        <span className="font-medium">{s.label}</span>
                                    </button>
                                ))}
                            </div>
                            
                            {selectedStrategy && SUB_TAGS[selectedStrategy] && (
                                <div className="mt-4 p-4 bg-slate-800/30 rounded-xl border border-slate-700/50 animate-fade-in-down">
                                    <div className="flex justify-between items-center mb-3">
                                        <label className="block text-sm text-slate-400">進階子標籤 (單選)</label>
                                        {selectedSubTags.length > 0 && (
                                            <button onClick={() => setSelectedSubTags([])} className="text-xs text-slate-500 hover:text-slate-300 transition px-2 py-1 rounded hover:bg-slate-700">🧹 清空已選標籤</button>
                                        )}
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {SUB_TAGS[selectedStrategy].map(tag => (
                                            <button
                                                key={tag}
                                                onClick={() => toggleSubTag(tag)}
                                                className={`px-3 py-1.5 rounded-full text-xs font-medium transition-all ${
                                                    selectedSubTags.includes(tag) 
                                                        ? `bg-gradient-to-r ${SUB_TAG_COLORS[tag] || 'from-blue-600 to-indigo-600'} text-white shadow-md shadow-slate-900/50` 
                                                        : 'bg-slate-900 border border-slate-600 text-slate-400 hover:border-slate-400 hover:text-slate-200'
                                                }`}
                                            >
                                                {tag}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>

                        <div className="flex justify-between items-center border-t border-slate-800 pt-6">
                            <div className="flex gap-3">
                                <label className="cursor-pointer bg-slate-800 hover:bg-slate-700 text-sm text-slate-200 px-4 py-2 rounded-lg flex items-center gap-2 transition">
                                    <Upload size={16} />
                                    匯入 EPS / 股期 (Excel)
                                    <input type="file" accept=".csv, .xlsx, .xls" onChange={handleEpsImport} className="hidden" />
                                </label>
                                <div className="flex items-center gap-2 bg-slate-800 rounded-lg p-1 pr-2 relative" ref={copyDropdownRef}>
                                    <div className="flex items-center bg-slate-900 border border-slate-700 rounded-md">
                                        <input 
                                            type="date" 
                                            value={copyStartDate} 
                                            onChange={e => setCopyStartDate(e.target.value)} 
                                            className="bg-transparent px-2 py-1 text-sm font-mono-num text-slate-300 outline-none max-w-[130px]"
                                            title="起始日期"
                                        />
                                        <span className="text-slate-500">-</span>
                                        <input 
                                            type="date" 
                                            value={copyEndDate} 
                                            onChange={e => setCopyEndDate(e.target.value)} 
                                            className="bg-transparent px-2 py-1 text-sm font-mono-num text-slate-300 outline-none max-w-[130px]"
                                            title="結束日期"
                                        />
                                    </div>
                                    
                                    <button 
                                        onClick={() => setIsCopyDropdownOpen(!isCopyDropdownOpen)}
                                        className={`bg-slate-900 border border-slate-700 rounded-md px-3 py-1 text-sm outline-none flex items-center gap-1 transition-colors ${copySubTags.length > 0 ? 'text-blue-400 border-blue-500/50' : 'text-slate-300'}`}
                                    >
                                        {copySubTags.length === 0 ? '全部標籤' : `已選 ${copySubTags.length} 項`}
                                        <span className="text-[10px] ml-1">▼</span>
                                    </button>

                                    {isCopyDropdownOpen && (
                                        <div className="absolute bottom-full mb-2 left-0 w-80 bg-slate-800 border border-slate-600 rounded-lg shadow-2xl p-4 z-50 flex flex-col gap-3 max-h-[400px] overflow-y-auto animate-fade-in-up">
                                            <div className="flex justify-between items-center border-b border-slate-700 pb-2">
                                                <span className="text-sm font-bold text-slate-200">選擇匯出標籤 (可多選)</span>
                                                <button onClick={() => setCopySubTags([])} className="text-xs text-blue-400 hover:text-blue-300 bg-blue-500/10 px-2 py-1 rounded">清空選取 (匯出全部)</button>
                                            </div>
                                            {STRATEGIES.map(strat => {
                                                const tags = SUB_TAGS[strat.id] || [];
                                                if(tags.length === 0) return null;
                                                return (
                                                    <div key={strat.id} className="mb-1">
                                                        <div className="text-xs font-bold text-slate-400 mb-2 flex items-center gap-1">
                                                            <strat.icon size={12} /> {strat.label}
                                                        </div>
                                                        <div className="flex flex-wrap gap-1.5">
                                                            {tags.map(tag => (
                                                                <button
                                                                    key={tag}
                                                                    onClick={() => {
                                                                        if (copySubTags.includes(tag)) {
                                                                            setCopySubTags(copySubTags.filter(t => t !== tag));
                                                                        } else {
                                                                            setCopySubTags([...copySubTags, tag]);
                                                                        }
                                                                    }}
                                                                    className={`px-2 py-1 rounded text-xs transition-all border ${
                                                                        copySubTags.includes(tag) 
                                                                            ? `bg-gradient-to-r ${SUB_TAG_COLORS[tag] || 'from-blue-600 to-indigo-600'} text-white border-transparent` 
                                                                            : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500 hover:text-slate-200'
                                                                    }`}
                                                                >
                                                                    {tag}
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}

                                    <div className="flex gap-2 ml-2">
                                        <button onClick={() => copyLogs('time')} className={`text-sm text-white flex items-center gap-1 transition px-3 py-1.5 rounded-md shadow-lg ${copySuccess === 'time' ? 'bg-green-600' : 'bg-blue-600 hover:bg-blue-500'}`} title="依輸入時間順序">
                                            {copySuccess === 'time' ? <CheckCircle size={16} /> : <ClipboardCopy size={16} />} {copySuccess === 'time' ? '已複製' : '依時間'}
                                        </button>
                                        <button onClick={() => copyLogs('strategy')} className={`text-sm text-white flex items-center gap-1 transition px-3 py-1.5 rounded-md shadow-lg ${copySuccess === 'strategy' ? 'bg-green-600' : 'bg-indigo-600 hover:bg-indigo-500'}`} title="依策略標籤群組">
                                            {copySuccess === 'strategy' ? <CheckCircle size={16} /> : <ClipboardCopy size={16} />} {copySuccess === 'strategy' ? '已複製' : '依策略'}
                                        </button>
                                        <button onClick={() => copyLogs('score')} className={`text-sm text-white flex items-center gap-1 transition px-3 py-1.5 rounded-md shadow-lg ${copySuccess === 'score' ? 'bg-green-600' : 'bg-rose-600 hover:bg-rose-500'}`} title="依標籤數量高低排序">
                                            {copySuccess === 'score' ? <CheckCircle size={16} /> : <Star size={16} />} {copySuccess === 'score' ? '已複製' : '依分數'}
                                        </button>
                                        <button onClick={() => copyLogs('score-futures')} className={`text-sm text-white flex items-center gap-1 transition px-3 py-1.5 rounded-md shadow-lg ${copySuccess === 'score-futures' ? 'bg-green-600' : 'bg-fuchsia-600 hover:bg-fuchsia-500'}`} title="僅篩選有股期標的，依標籤數量高低排序">
                                            {copySuccess === 'score-futures' ? <CheckCircle size={16} /> : <Star size={16} />} {copySuccess === 'score-futures' ? '已複製' : '股期依分數'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <button onClick={handleAddLog} className="bg-blue-600 hover:bg-blue-500 text-white px-8 py-2 rounded-lg font-bold flex items-center gap-2 shadow-lg shadow-blue-900/50 transition transform hover:-translate-y-0.5">
                                <PlusCircle size={18} /> 加入日誌
                            </button>
                        </div>
                    </div>

                    {/* 資料表格 */}
                    <div className="bg-[#111827] rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse">
                                <thead>
                                    <tr className="bg-slate-800/50 text-slate-400 text-sm uppercase tracking-wider">
                                        <th className="p-3 font-medium align-top min-w-[120px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleJournalSort('date')}>日期 <SortIcon sortKey="date" currentSort={journalSort} /></div>
                                            <input type="date" value={journalFilters.date} onChange={e => setJournalFilters({...journalFilters, date: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs font-mono-num outline-none focus:border-blue-500" />
                                        </th>
                                        <th className="p-3 font-medium align-top min-w-[140px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleJournalSort('stock')}>代號 / 名稱 <SortIcon sortKey="stock" currentSort={journalSort} /></div>
                                            <div className="flex flex-col gap-1.5">
                                                <input type="text" placeholder="搜尋..." value={journalFilters.stock} onChange={e => setJournalFilters({...journalFilters, stock: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs outline-none focus:border-blue-500" />
                                                <select value={journalFilters.futures} onChange={e => setJournalFilters({...journalFilters, futures: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                    <option value="all">全部</option>
                                                    <option value="yes">僅顯示有股期</option>
                                                </select>
                                            </div>
                                        </th>
                                        <th className="p-3 font-medium font-mono-num align-top">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleJournalSort('eps25')}>25' EPS <SortIcon sortKey="eps25" currentSort={journalSort} /></div>
                                        </th>
                                        <th className="p-3 font-medium font-mono-num align-top">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleJournalSort('eps26')}>26' EPS(預) <SortIcon sortKey="eps26" currentSort={journalSort} /></div>
                                        </th>
                                        <th className="p-3 font-medium font-mono-num align-top whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleJournalSort('growth')}>EPS 成長率 <SortIcon sortKey="growth" currentSort={journalSort} /></div>
                                            <select value={journalFilters.growth} onChange={e => setJournalFilters({...journalFilters, growth: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                <option value="all">全部</option>
                                                <option value="positive">&gt; 0% (正成長)</option>
                                                <option value="negative">&lt; 0% (衰退)</option>
                                            </select>
                                        </th>
                                        <th className="p-3 font-medium align-top min-w-[160px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handleJournalSort('tags')}>策略標籤 <SortIcon sortKey="tags" currentSort={journalSort} /></div>
                                            <select value={journalFilters.tag} onChange={e => setJournalFilters({...journalFilters, tag: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                <option value="">全部標籤</option>
                                                {STRATEGIES.map(s => (
                                                    <optgroup key={s.id} label={s.label}>
                                                        <option value={s.label}>{s.label} (主策略)</option>
                                                        {(SUB_TAGS[s.id] || []).map(t => (
                                                            <option key={t} value={t}>{t}</option>
                                                        ))}
                                                    </optgroup>
                                                ))}
                                            </select>
                                        </th>
                                        <th className="p-3 font-medium text-center align-top">
                                            <div className="mb-2">操作</div>
                                            <button onClick={() => { setJournalFilters({date: '', stock: '', futures: 'all', growth: 'all', tag: ''}); setJournalSort({key: 'id', direction: 'desc'}); }} className="text-xs text-slate-500 hover:text-slate-300 underline transition">還原預設</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {filteredJournalLogs.map(log => {
                                        const eps = epsData[log.stockId] || { eps25: '-', eps26: '-', epsGrowth: '-', hasFutures: false };
                                        const strat = STRATEGIES.find(s => s.id === log.strategy);
                                        
                                        const eps26Num = parseFloat(eps.eps26);
                                        const isEps26Positive = !isNaN(eps26Num) && eps26Num > 0;
                                        const isEps26Negative = !isNaN(eps26Num) && eps26Num < 0;

                                        let growthColorClass = 'text-slate-400';
                                        if (isEps26Negative) {
                                            growthColorClass = 'text-emerald-400';
                                        } else if (eps.epsGrowth && eps.epsGrowth !== '-') {
                                            const val = parseFloat(eps.epsGrowth);
                                            if (!isNaN(val)) {
                                                growthColorClass = val > 0 ? 'text-red-400' : val < 0 ? 'text-emerald-400' : 'text-slate-300';
                                            } else {
                                                growthColorClass = 'text-amber-400';
                                            }
                                        }

                                        return (
                                            <tr key={log.id} className={`transition group ${isEps26Positive ? 'bg-yellow-500/10 hover:bg-yellow-500/20 border-l-2 border-yellow-500' : 'hover:bg-slate-800/20'}`}>
                                                <td className="p-4 font-mono-num text-slate-300">{log.date}</td>
                                                <td className="p-4">
                                                    <div className="flex items-center">
                                                        <FuturesBadge hasFutures={eps.hasFutures} />
                                                        <span className={`font-mono-num font-bold mr-2 ${isEps26Positive ? 'text-yellow-400' : 'text-blue-400'}`}>{log.stockId}</span>
                                                        <span className={isEps26Positive ? 'text-yellow-100 font-bold' : 'text-slate-200'}>{log.name}</span>
                                                    </div>
                                                </td>
                                                <td className="p-4 font-mono-num text-emerald-400">{eps.eps25}</td>
                                                <td className={`p-4 font-mono-num ${isEps26Positive ? 'text-yellow-400 font-bold drop-shadow-[0_0_5px_rgba(250,204,21,0.4)]' : 'text-emerald-500/70'}`}>{eps.eps26}</td>
                                                <td className={`p-4 font-mono-num font-bold ${growthColorClass}`}>{eps.epsGrowth || '-'}</td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap gap-1.5 items-center">
                                                        {log.subTags && log.subTags.length > 0 && (
                                                            log.subTags.map(t => {
                                                                const stratForTag = STRATEGIES.find(s => SUB_TAGS[s.id]?.includes(t));
                                                                return (
                                                                    <span 
                                                                        key={t} 
                                                                        onClick={() => removeTag(log.id, true, t)}
                                                                        className={`group cursor-pointer inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-gradient-to-r ${SUB_TAG_COLORS[t] || stratForTag?.color || 'from-blue-600 to-indigo-600'} text-white shadow-sm hover:opacity-80 transition-all`}
                                                                        title="點擊移除標籤"
                                                                    >
                                                                        {t}
                                                                        <X size={12} className="ml-1 opacity-0 group-hover:opacity-100 transition-opacity w-3 h-3" />
                                                                    </span>
                                                                );
                                                            })
                                                        )}
                                                        {(() => {
                                                            const strategiesArray = Array.isArray(log.strategy) ? log.strategy : (log.strategy ? [log.strategy] : []);
                                                            return strategiesArray.map(stratId => {
                                                                const s = STRATEGIES.find(str => str.id === stratId);
                                                                if (!s) return null;
                                                                const hasSubTag = log.subTags?.some(tag => SUB_TAGS[stratId]?.includes(tag));
                                                                if (log.subTags && log.subTags.length > 0 && hasSubTag) return null;
                                                                return (
                                                                    <span 
                                                                        key={s.id} 
                                                                        onClick={() => removeTag(log.id, false, s.id)}
                                                                        className={`group cursor-pointer inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-gradient-to-r ${s.color} bg-opacity-10 text-white hover:opacity-80 transition-all`}
                                                                        title="點擊移除策略"
                                                                    >
                                                                        {s.emoji} {s.label}
                                                                        <X size={12} className="opacity-0 group-hover:opacity-100 transition-opacity w-3 h-3" />
                                                                    </span>
                                                                );
                                                            });
                                                        })()}
                                                    </div>
                                                </td>
                                                <td className="p-4 text-center">
                                                    <div className="flex justify-center gap-3">
                                                        <button onClick={() => togglePlan(log.id)} className={`transition ${log.inPlan ? 'text-blue-400 drop-shadow-[0_0_8px_rgba(96,165,250,0.6)]' : 'text-slate-600 hover:text-blue-400'}`} title={log.inPlan ? '移出規劃' : '加入規劃'}>
                                                            <Target size={20} />
                                                        </button>
                                                        <button onClick={() => toggleStar(log.id)} className={`transition ${log.starred ? 'text-yellow-400 drop-shadow-[0_0_8px_rgba(250,204,21,0.6)]' : 'text-slate-600 hover:text-yellow-400'}`} title="追蹤標記">
                                                            <Star fill={log.starred ? "currentColor" : "none"} size={20} />
                                                        </button>
                                                        <button onClick={() => setConfirm({ show: true, action: () => deleteLog(log.id) })} className="text-slate-600 hover:text-red-400 transition" title="刪除">
                                                            <Trash2 size={20} />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {logs.length === 0 && (
                                        <tr><td colSpan="7" className="p-8 text-center text-slate-500">尚無選股紀錄</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <AlertModal isOpen={alert.show} message={alert.msg} onClose={() => setAlert({ show: false, msg: '' })} />
                    <ConfirmModal isOpen={confirm.show} title="確認刪除" message="您確定要刪除這筆紀錄嗎？此動作無法復原。" 
                        onConfirm={() => { confirm.action(); setConfirm({ show: false, action: null }); }} 
                        onCancel={() => setConfirm({ show: false, action: null })} />
                </div>
            );
        };

        // ==========================================
        // 4. 模組二：大盤支撐壓力計算機 (Calculator)
        // ==========================================
        const CalculatorModule = ({ calcHistory, setCalcHistory, stockMap, setCustomStocks, epsData }) => {
            const [session, setSession] = useState('日盤');
            const [h, setH] = useState('');
            const [l, setL] = useState('');
            const [c, setC] = useState('');
            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState(''); 
            const [results, setResults] = useState(null);
            const [expandedRowId, setExpandedRowId] = useState(null);

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockName('');
                    return;
                }
                if (stockMap[trimmedVal]) {
                    setStockName(stockMap[trimmedVal].name);
                }
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setStockName(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockId('');
                    return;
                }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) {
                    setStockId(foundId);
                }
            };

            const stockIdsDatalist = useMemo(() => (
                <datalist id="calc-stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="calc-stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const calculate = () => {
                const H = parseFloat(h);
                const L = parseFloat(l);
                const C = parseFloat(c);
                if (isNaN(H) || isNaN(L) || isNaN(C)) return;

                const sId = stockId.trim();
                const sName = stockName.trim();
                if (sId && sName && !stockMap[sId] && setCustomStocks) {
                    setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                }

                const Range = H - L;
                
                const cdpVal = (H + L + 2 * C) / 4;
                const cdp = {
                    AH: (cdpVal + Range).toFixed(2),
                    NH: (2 * cdpVal - L).toFixed(2),
                    CDP: cdpVal.toFixed(2),
                    NL: (2 * cdpVal - H).toFixed(2),
                    AL: (cdpVal - Range).toFixed(2)
                };

                const pVal = (H + L + C) / 3;
                const pivot = {
                    R2: (pVal + Range).toFixed(2),
                    R1: (2 * pVal - L).toFixed(2),
                    P: pVal.toFixed(2),
                    S1: (2 * pVal - H).toFixed(2),
                    S2: (pVal - Range).toFixed(2)
                };

                const fibo = {
                    R3: (pVal + Range * 1.0).toFixed(2),
                    R2: (pVal + Range * 0.618).toFixed(2),
                    R1: (pVal + Range * 0.382).toFixed(2),
                    P: pVal.toFixed(2),
                    S1: (pVal - Range * 0.382).toFixed(2),
                    S2: (pVal - Range * 0.618).toFixed(2),
                    S3: (pVal - Range * 1.0).toFixed(2)
                };

                setResults({ cdp, pivot, fibo });
            };

            const saveHistory = () => {
                if (!results) return;
                const sId = stockId.trim();
                const sName = stockName.trim();
                const finalName = sName || stockMap[sId]?.name || '';
                
                const newRecord = {
                    id: Date.now().toString(),
                    date: new Date().toISOString().split('T')[0],
                    session,
                    stockId: sId,
                    name: finalName,
                    inputs: { h, l, c },
                    results
                };
                setCalcHistory([newRecord, ...calcHistory]);
            };

            const copySystem = (sysName, data, record = null) => {
                const sId = stockId.trim();
                const finalName = stockName.trim() || stockMap[sId]?.name || '';
                const rec = record || { date: new Date().toISOString().split('T')[0], session, stockId: sId, name: finalName };
                const titleStr = `【${rec.date} ${rec.session} ${rec.stockId} ${rec.name} 關鍵點位參考 - ${sysName}】\n\n`;
                let text = titleStr;
                
                Object.keys(data).forEach(k => {
                    text += `${k}:\t${data[k]}\n`;
                });
                
                fallbackCopyTextToClipboard(text);
            };

            const ColorRow = ({ label, value, type }) => {
                let colorClass = 'text-slate-300';
                if (type === 'R') colorClass = 'text-red-400 font-bold';
                if (type === 'S') colorClass = 'text-emerald-400 font-bold';
                if (type === 'P') colorClass = 'text-yellow-400 font-bold';

                return (
                    <div className="flex justify-between items-center py-1.5 border-b border-slate-800/50 last:border-0">
                        <span className="text-sm text-slate-500 w-8">{label}</span>
                        <span className={`font-mono-num text-lg ${colorClass}`}>{value}</span>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-lg">
                        <h2 className="text-2xl font-title text-indigo-400 mb-6 flex items-center gap-2"><Calculator /> 大盤支撐壓力計算機</h2>
                        
                        <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">預測盤別</label>
                                <select value={session} onChange={e=>setSession(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 focus:border-indigo-500 outline-none">
                                    <option>日盤</option>
                                    <option>夜盤</option>
                                    <option>全盤</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">最高價 (H)</label>
                                <input type="number" step="any" value={h} onChange={e=>setH(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num" />
                            </div>
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">最低價 (L)</label>
                                <input type="number" step="any" value={l} onChange={e=>setL(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num" />
                            </div>
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">收盤價 (C)</label>
                                <input type="number" step="any" value={c} onChange={e=>setC(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num" />
                            </div>
                            <div className="relative">
                                <label className="block text-sm text-slate-400 mb-1">股號/代號 (選填)</label>
                                <input type="text" list="calc-stock-ids-list" value={stockId} onChange={handleStockIdChange} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} placeholder="如: TX00" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num focus:border-indigo-500 outline-none transition" />
                            </div>
                            <div className="relative">
                                <label className="block text-sm text-slate-400 mb-1">股票名稱 (選填)</label>
                                <input type="text" list="calc-stock-names-list" value={stockName} onChange={handleStockNameChange} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} placeholder="如: 台指期" className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 focus:border-indigo-500 outline-none transition ${stockMap[stockId] ? 'text-green-400' : 'text-slate-200'}`} />
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                            </div>
                        </div>

                        <div className="flex gap-4">
                            <button onClick={calculate} className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-2.5 rounded-lg font-bold flex-1 shadow-lg shadow-indigo-900/50 transition">
                                開始計算
                            </button>
                            {results && (
                                <button onClick={saveHistory} className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-lg font-bold flex items-center gap-2 transition">
                                    <Save size={18} /> 儲存紀錄
                                </button>
                            )}
                        </div>
                    </div>

                    {results && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-bounce-in">
                            <div className="bg-slate-900 rounded-2xl border border-slate-700 p-5 shadow-xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-blue-500/10 rounded-bl-full -z-0"></div>
                                <h3 className="text-lg font-bold text-blue-400 mb-4 border-b border-slate-700 pb-2 relative z-10">CDP 系統</h3>
                                <div className="space-y-1 relative z-10">
                                    <ColorRow label="AH" value={results.cdp.AH} type="R" />
                                    <ColorRow label="NH" value={results.cdp.NH} type="R" />
                                    <ColorRow label="CDP" value={results.cdp.CDP} type="P" />
                                    <ColorRow label="NL" value={results.cdp.NL} type="S" />
                                    <ColorRow label="AL" value={results.cdp.AL} type="S" />
                                </div>
                                <button onClick={() => copySystem('CDP系統', results.cdp)} className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg flex justify-center items-center gap-2 transition text-slate-300">
                                    <ClipboardCopy size={16} /> 複製 (CDP)
                                </button>
                            </div>
                            
                            <div className="bg-slate-900 rounded-2xl border border-slate-700 p-5 shadow-xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-purple-500/10 rounded-bl-full -z-0"></div>
