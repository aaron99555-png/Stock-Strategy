<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萊恩交易手札</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0?deps=react@18.2.0"
        }
    }
    </script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        :root {
            --bg-main: #0B1121;
            --bg-card: #111827;
            --bg-card-alt: #0f172a;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-main);
            color: #f8fafc;
            overflow-x: hidden;
        }
        .font-mono-num { font-family: 'JetBrains Mono', monospace; }
        .font-title { font-family: 'Ma Shan Zheng', cursive; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Hide number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        
        /* Animations */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.8); }
            60% { opacity: 1; transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .animate-fade-in-down { animation: fadeInDown 0.4s ease-out forwards; }
        .animate-fade-in-up { animation: fadeInUp 0.4s ease-out forwards; }
        .animate-bounce-in { animation: bounceIn 0.5s ease-out forwards; }
        
        /* Tailwind config overrides */
        script[type="text/tailwindcss"] {
            theme: {
                extend: {
                    colors: {
                        slate: { 900: '#0f172a' }
                    }
                }
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            TrendingUp, BarChart2, Zap, AlertCircle, Save, Trash2, 
            Download, Upload, Eye, FileText, CheckCircle, Calculator,
            ClipboardCopy, Search, PlusCircle, LayoutDashboard, Star, X, Target,
            ArrowUp, ArrowDown, ArrowUpDown, Ban, Sparkles, Bot, Key
        } from 'lucide-react';

        // ==========================================
        // Gemini API Hook
        // ==========================================
        const useGeminiAPI = () => {
            const apiKey = "" || window.localStorage.getItem('ryan_gemini_api_key'); // API 金鑰由執行環境自動注入，或由本地端讀取

            const generateText = async (prompt, systemInstructionText) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemInstructionText }] }
                };

                const fetchWithRetry = async (retries = 5, delay = 1000) => {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text || "無法取得 AI 回應，請稍後再試。";
                    } catch (error) {
                        if (retries > 0) {
                            await new Promise(res => setTimeout(res, delay));
                            return fetchWithRetry(retries - 1, delay * 2);
                        }
                        throw error;
                    }
                };

                try {
                    return await fetchWithRetry();
                } catch (error) {
                    console.error("Gemini API Error:", error);
                    return "❌ AI 連線失敗，請稍後再試。";
                }
            };

            return { generateText };
        };

        // ==========================================
        // 1. 靜態資料庫與預設黑名單
        // ==========================================
        const STATIC_STOCK_DB = {};
        
        const DEFAULT_FORBIDDEN = [
            { id: '2313', name: '華通' }, { id: '2812', name: '台中銀' }, { id: '3149', name: '正達' },
            { id: '6126', name: '信音' }, { id: '2547', name: '日勝生' }, { id: '3325', name: '旭品' },
            { id: '2342', name: '茂矽' }, { id: '2392', name: '正崴' }, { id: '2352', name: '佳世達' },
            { id: '2317', name: '鴻海' }, { id: '1815', name: '富喬' }, { id: '3013', name: '晟銘電' },
            { id: '3376', name: '新日興' }, { id: '3312', name: '弘憶股' }, { id: '9999', name: '信甫' },
            { id: '9998', name: '佳士達' }, { id: '9997', name: '弘億股' }
        ];

        // ==========================================
        // 2. 共用元件 (Hooks & Modals)
        // ==========================================
        
        const getTodayLocal = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const fallbackCopyTextToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(textArea);
        };

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) { return initialValue; }
            });
            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {}
            };
            return [storedValue, setValue];
        }

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            const btnRef = useRef(null);
            useEffect(() => {
                if (isOpen && btnRef.current) setTimeout(() => { if (btnRef.current) btnRef.current.focus(); }, 10);
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); onConfirm(); } 
                    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); onCancel(); }
                };
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onConfirm, onCancel]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 animate-fade-in-down">
                    <div className="bg-slate-900 border border-slate-700 p-6 rounded-xl w-96 shadow-2xl">
                        <div className="flex items-center gap-3 mb-4 text-red-400">
                            <AlertCircle size={24} />
                            <h3 className="text-xl font-bold">{title}</h3>
                        </div>
                        <p className="text-slate-300 mb-6">{message}</p>
                        <div className="flex justify-end gap-3">
                            <button onClick={onCancel} className="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition outline-none focus:ring-2 focus:ring-slate-500">取消 (ESC)</button>
                            <button ref={btnRef} onClick={onConfirm} className="px-4 py-2 rounded-lg bg-red-600 hover:bg-red-500 transition text-white outline-none focus:ring-2 focus:ring-red-400">確認執行 (Enter)</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AlertModal = ({ isOpen, message, onClose }) => {
            const btnRef = useRef(null);
            useEffect(() => {
                if (isOpen && btnRef.current) setTimeout(() => { if (btnRef.current) btnRef.current.focus(); }, 10);
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); onClose(); }
                };
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onClose]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-50 animate-bounce-in">
                    <div className="bg-slate-900 border border-slate-700 p-6 rounded-xl w-80 shadow-2xl text-center">
                        <CheckCircle size={48} className="mx-auto text-green-500 mb-4" />
                        <p className="text-slate-200 mb-6 text-lg">{message}</p>
                        <button ref={btnRef} onClick={onClose} className="px-6 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 transition w-full text-white outline-none focus:ring-2 focus:ring-blue-400">了解 (Enter)</button>
                    </div>
                </div>
            );
        };

        const ForbiddenModal = ({ isOpen, stockName, onConfirm, onCancel }) => {
            const btnRef = useRef(null);
            useEffect(() => {
                if (isOpen && btnRef.current) setTimeout(() => { if (btnRef.current) btnRef.current.focus(); }, 10);
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); onConfirm(); }
                    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); onCancel(); }
                };
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onConfirm, onCancel]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-red-950/90 backdrop-blur-md flex items-center justify-center z-[9999] animate-bounce-in">
                    <div className="bg-red-900 border-4 border-red-500 p-10 rounded-3xl w-[90%] max-w-md shadow-[0_0_100px_rgba(239,68,68,0.8)] text-center relative">
                        <button onClick={onCancel} className="absolute top-5 right-5 text-red-400 hover:text-white transition"><X size={28} /></button>
                        <div className="text-8xl mb-6">🛑</div>
                        <h2 className="text-5xl font-black text-white mb-6 tracking-widest drop-shadow-lg">警告！</h2>
                        <h3 className="text-3xl font-black text-yellow-300 mb-10 drop-shadow-lg leading-snug">
                            【{stockName}】<br/>佳佳持股 嚴禁買入
                        </h3>
                        <div className="flex gap-4">
                            <button onClick={onCancel} className="px-4 py-4 rounded-xl bg-red-800 text-red-200 font-bold text-lg hover:bg-red-700 transition w-1/3 shadow-lg outline-none focus:ring-2 focus:ring-red-400">取消</button>
                            <button ref={btnRef} onClick={onConfirm} className="px-4 py-4 rounded-xl bg-white text-red-900 font-black text-lg hover:bg-gray-200 transition w-2/3 shadow-2xl focus:ring-4 focus:ring-red-300 outline-none">我明白了並加入 (Enter)</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AiModal = ({ isOpen, onClose, content, loading, title }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[100] animate-fade-in-down">
                    <div className="bg-slate-900 border border-purple-500/50 p-6 rounded-2xl w-[600px] shadow-[0_0_80px_rgba(168,85,247,0.3)]">
                        <div className="flex items-center gap-3 mb-4 text-purple-400 border-b border-slate-700 pb-3">
                            <Sparkles size={24} className="animate-pulse" />
                            <h3 className="text-xl font-bold">{title}</h3>
                            <button onClick={onClose} className="ml-auto text-slate-500 hover:text-white transition"><X size={24} /></button>
                        </div>
                        <div className="text-slate-300 mb-6 min-h-[150px] max-h-[60vh] overflow-y-auto whitespace-pre-wrap leading-relaxed text-sm p-2">
                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-32 space-y-4 text-purple-400 opacity-80">
                                    <Bot size={48} className="animate-bounce" />
                                    <span className="font-bold tracking-widest">AI 正在深度分析中，請稍候...</span>
                                </div>
                            ) : (
                                content
                            )}
                        </div>
                        <div className="flex justify-end pt-3 border-t border-slate-700/50">
                            <button onClick={onClose} className="px-6 py-2.5 rounded-lg bg-gradient-to-r from-purple-600 to-blue-600 hover:from-purple-500 hover:to-blue-500 transition text-white outline-none focus:ring-2 focus:ring-purple-400 font-bold w-full shadow-lg shadow-purple-900/50">完成閱讀</button>
                        </div>
                    </div>
                </div>
            );
        };

        const SortIcon = ({ sortKey, currentSort }) => {
            if (currentSort.key !== sortKey) return <ArrowUpDown size={14} className="text-slate-600 opacity-50" />;
            return currentSort.direction === 'asc' ? <ArrowUp size={14} className="text-blue-400" /> : <ArrowDown size={14} className="text-blue-400" />;
        };

        const FuturesBadge = ({ hasFutures }) => {
            if (!hasFutures) return null;
            return (
                <span className="bg-fuchsia-600/90 text-white text-[10px] px-1.5 py-0.5 rounded shadow-sm mr-1.5 flex-shrink-0" title="具備個股期貨">期</span>
            );
        };

        const getTwStockColor = (valStr) => {
            if (valStr === undefined || valStr === null || valStr === '-' || valStr === '') return 'text-white';
            const val = parseFloat(String(valStr).replace(/,/g, '').replace('%', ''));
            if (isNaN(val) || val === 0) return 'text-white';
            return val > 0 ? 'text-red-400' : 'text-emerald-400';
        };

        // ==========================================
        // 3. 模組一：選股日誌與 EPS (Stock Journal)
        // ==========================================
        const STRATEGIES = [
            { id: 'trend', label: '趨勢與型態', icon: TrendingUp, color: 'from-blue-600 to-indigo-600', emoji: '📈' },
            { id: 'chips', label: '籌碼與法人', icon: BarChart2, color: 'from-emerald-600 to-teal-600', emoji: '💧' },
            { id: 'daytrade', label: '當沖專區', icon: Zap, color: 'from-orange-500 to-red-600', emoji: '⚡' },
            { id: 'emerging', label: '興櫃專區', icon: AlertCircle, color: 'from-purple-600 to-pink-600', emoji: '🚀' },
        ];

        const SUB_TAGS = {
            'trend': ['量價齊揚', '破繭而出', '月來越好', '季不可失', '守株待兔', 'OBV突破', '回後買上漲', '高成交值多頭突破上關', '高成交值', 'KD金叉', 'MACD翻紅', '收盤期貨續拉', '跌破月季線'],
            'chips': ['法人加持', '外資買進', '投信買進', '權證大單追蹤', '四線上揚籌碼集中', '多頭月營收創高', '1日籌碼集中度>10%', '1日籌碼集中度>20%', '5日籌碼集中度>10%', '5日籌碼集中度>20%'],
            'daytrade': ['當沖多方標的', '當沖空方標的', '當沖十字變盤'],
            'emerging': ['興櫃-多頭突破上關價']
        };

        const SUB_TAG_COLORS = {
            '量價齊揚': 'from-red-500 to-rose-600',
            '破繭而出': 'from-orange-400 to-amber-500',
            '月來越好': 'from-amber-500 to-yellow-500',
            '季不可失': 'from-lime-500 to-green-600',
            '守株待兔': 'from-emerald-500 to-teal-600',
            'OBV突破': 'from-teal-500 to-cyan-600',
            '回後買上漲': 'from-cyan-500 to-sky-600',
            '高成交值多頭突破上關': 'from-sky-500 to-blue-600',
            '高成交值': 'from-rose-500 to-red-600',
            'KD金叉': 'from-blue-500 to-indigo-600',
            'MACD翻紅': 'from-indigo-500 to-violet-600',
            '收盤期貨續拉': 'from-violet-500 to-purple-600',
            '跌破月季線': 'from-fuchsia-500 to-pink-600',
            
            '法人加持': 'from-rose-500 to-pink-600',
            '外資買進': 'from-pink-500 to-fuchsia-600',
            '投信買進': 'from-fuchsia-500 to-purple-600',
            '權證大單追蹤': 'from-purple-500 to-violet-600',
            '四線上揚籌碼集中': 'from-violet-500 to-indigo-600',
            '多頭月營收創高': 'from-indigo-500 to-blue-600',
            '1日籌碼集中度>10%': 'from-blue-500 to-sky-600',
            '1日籌碼集中度>20%': 'from-sky-500 to-cyan-600',
            '5日籌碼集中度>10%': 'from-cyan-500 to-teal-600',
            '5日籌碼集中度>20%': 'from-teal-500 to-emerald-600',

            '當沖多方標的': 'from-red-600 to-orange-600',
            '當沖空方標的': 'from-green-600 to-emerald-600',
            '當沖十字變盤': 'from-slate-500 to-slate-700',

            '興櫃-多頭突破上關價': 'from-amber-600 to-orange-700'
        };

        const StockJournal = ({ logs, setLogs, customStocks, setCustomStocks, epsData, setEpsData, stockMap, forbiddenStocks, onAiDiagnose }) => {
            const [date, setDate] = useState(getTodayLocal());
            const [copySubTags, setCopySubTags] = useState([]); 
            const [isCopyDropdownOpen, setIsCopyDropdownOpen] = useState(false);
            const copyDropdownRef = useRef(null);

            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState('');
            const [selectedStrategy, setSelectedStrategy] = useState('');
            const [selectedSubTags, setSelectedSubTags] = useState([]);
            const [alert, setAlert] = useState({ show: false, msg: '' });
            const [confirm, setConfirm] = useState({ show: false, action: null });
            
            const [forbiddenAlert, setForbiddenAlert] = useState({ show: false, stockName: '', action: null });
            
            const [copySuccess, setCopySuccess] = useState(null); 

            const [journalFilters, setJournalFilters] = useState({ date: getTodayLocal(), stock: '', futures: 'all', growth: 'all', tag: '', tagCount: 'all' });
            const [journalSort, setJournalSort] = useState({ key: 'id', direction: 'desc' });

            const handleJournalSort = (key) => {
                if (journalSort.key === key) {
                    setJournalSort({ key, direction: journalSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setJournalSort({ key, direction: 'desc' }); 
                }
            };

            const filteredJournalLogs = useMemo(() => {
                let result = logs.slice();
                
                if (journalFilters.date) result = result.filter(l => l.date === journalFilters.date);
                if (journalFilters.stock) {
                    const kw = journalFilters.stock.toLowerCase();
                    result = result.filter(l => l.stockId.toLowerCase().includes(kw) || l.name.toLowerCase().includes(kw));
                }
                if (journalFilters.futures !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        if (journalFilters.futures === 'yes') return eps.hasFutures;
                        return true; 
                    });
                }
                if (journalFilters.growth !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        const g = parseFloat(eps.epsGrowth);
                        if (journalFilters.growth === 'positive') return !isNaN(g) && g > 0;
                        if (journalFilters.growth === 'negative') return !isNaN(g) && g < 0;
                        return true;
                    });
                }
                if (journalFilters.tag) {
                    result = result.filter(l => {
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        const matchMain = strats.some(sId => {
                            const s = STRATEGIES.find(x => x.id === sId);
                            return s && s.label === journalFilters.tag;
                        });
                        const matchSub = l.subTags && l.subTags.includes(journalFilters.tag);
                        return matchMain || matchSub;
                    });
                }
                if (journalFilters.tagCount !== 'all') {
                    result = result.filter(l => {
                        let tCount = [];
                        if (l.subTags && l.subTags.length > 0) tCount.push(...l.subTags);
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        strats.forEach(sId => {
                            const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                            if (!hasSub) tCount.push(sId);
                        });
                        const c = tCount.length;
                        if (journalFilters.tagCount === '1') return c === 1;
                        if (journalFilters.tagCount === '2') return c === 2;
                        if (journalFilters.tagCount === '3') return c === 3;
                        if (journalFilters.tagCount === '4+') return c >= 4;
                        return true;
                    });
                }

                result.sort((a, b) => {
                    let valA, valB;
                    const epsA = epsData[a.stockId] || {};
                    const epsB = epsData[b.stockId] || {};

                    switch (journalSort.key) {
                        case 'date': valA = a.date; valB = b.date; if (valA === valB) { valA = parseInt(a.id); valB = parseInt(b.id); } break;
                        case 'stock': valA = a.stockId; valB = b.stockId; break;
                        case 'eps25': valA = parseFloat(epsA.eps25) || -999999; valB = parseFloat(epsB.eps25) || -999999; break;
                        case 'eps26': valA = parseFloat(epsA.eps26) || -999999; valB = parseFloat(epsB.eps26) || -999999; break;
                        case 'growth': valA = parseFloat(epsA.epsGrowth) || -999999; valB = parseFloat(epsB.epsGrowth) || -999999; break;
                        case 'tags': {
                            const getScore = (l) => {
                                let t = [];
                                if (l.subTags && l.subTags.length > 0) t.push(...l.subTags);
                                const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                                strats.forEach(sId => {
                                    const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                                    if (!hasSub) t.push(sId);
                                });
                                let finalScore = t.length;
                                const eps = epsData[l.stockId] || {};
                                const g = parseFloat(eps.epsGrowth);
                                if (!isNaN(g) && g > 0) finalScore += 1; // 成長率為正，自動加1分
                                return finalScore;
                            };
                            valA = getScore(a); valB = getScore(b); break;
                        }
                        default: valA = parseInt(a.id); valB = parseInt(b.id); break;
                    }
                    if (valA < valB) return journalSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return journalSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return result;
            }, [logs, journalFilters, epsData, journalSort]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (copyDropdownRef.current && !copyDropdownRef.current.contains(event.target)) {
                        setIsCopyDropdownOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') { setStockName(''); return; }
                if (stockMap[trimmedVal]) setStockName(stockMap[trimmedVal].name);
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setStockName(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') { setStockId(''); return; }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) setStockId(foundId);
            };

            const isUnknownStock = stockId.trim() && stockName.trim() && !stockMap[stockId.trim()];
            const isForbiddenStock = (stockId.trim() !== '' && forbiddenStocks.some(f => f.id === stockId.trim())) || 
                                     (stockName.trim() !== '' && forbiddenStocks.some(f => stockName.includes(f.name) || f.name === stockName.trim()));

            const stockIdsDatalist = useMemo(() => (
                <datalist id="stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const handleAddLog = () => {
                const sId = stockId.trim();
                const sName = stockName.trim();
                
                if (!sId || !sName) {
                    setAlert({ show: true, msg: '請填寫完整資訊 (股號、名稱)！' });
                    return;
                }

                const executeAdd = () => {
                    if (!stockMap[sId]) {
                        setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                    }

                    const existingLogIndex = logs.findIndex(l => l.date === date && l.stockId === sId);

                    if (existingLogIndex !== -1) {
                        const updatedLogs = [...logs];
                        const existingLog = { ...updatedLogs[existingLogIndex] };
                        
                        let currentStrategies = Array.isArray(existingLog.strategy) ? [...existingLog.strategy] : (existingLog.strategy ? [existingLog.strategy] : []);
                        if (selectedStrategy && !currentStrategies.includes(selectedStrategy)) {
                            currentStrategies.push(selectedStrategy);
                        }
                        existingLog.strategy = currentStrategies;

                        let currentSubTags = existingLog.subTags ? [...existingLog.subTags] : [];
                        selectedSubTags.forEach(tag => {
                            if (!currentSubTags.includes(tag)) {
                                currentSubTags.push(tag);
                            }
                        });
                        existingLog.subTags = currentSubTags;

                        updatedLogs[existingLogIndex] = existingLog;
                        setLogs(updatedLogs);
                    } else {
                        const newLog = {
                            id: Date.now().toString(),
                            date,
                            stockId: sId,
                            name: sName,
                            strategy: selectedStrategy ? [selectedStrategy] : [], 
                            subTags: selectedSubTags,
                            starred: false,
                            plan: { entry: '', stopLoss: '', trailing: '', exit: '', shares: '', warrantCode: '', warrantEntry: '', warrantShares: '', currentPrice: '' }
                        };
                        setLogs([...logs, newLog]);
                    }
                    
                    setStockId('');
                    setStockName('');
                };

                const isForbidden = forbiddenStocks.some(f => f.id === sId || sName.includes(f.name) || f.name === sName);
                if (isForbidden) {
                    setForbiddenAlert({ show: true, stockName: sName, action: executeAdd });
                    return; 
                }

                executeAdd();
            };

            const toggleSubTag = (tag) => {
                if (selectedSubTags.includes(tag)) setSelectedSubTags([]);
                else setSelectedSubTags([tag]);
            };
            
            const handleStrategySelect = (id) => {
                setSelectedStrategy(id);
                setSelectedSubTags([]); 
            };

            const toggleStar = (id) => {
                setLogs(logs.map(log => log.id === id ? { ...log, starred: !log.starred } : log));
            };

            const togglePlan = (id) => {
                const log = logs.find(l => l.id === id);
                if (!log) return;

                const executeToggle = () => {
                    setLogs(logs.map(l => l.id === id ? { ...l, inPlan: !l.inPlan } : l));
                };

                if (!log.inPlan) {
                    const isForbidden = forbiddenStocks.some(f => f.id === log.stockId || log.name.includes(f.name) || f.name === log.name);
                    if (isForbidden) {
                        setForbiddenAlert({ show: true, stockName: log.name, action: executeToggle });
                        return;
                    }
                }
                executeToggle();
            };

            const deleteLog = (id) => {
                setLogs(logs.filter(log => log.id !== id));
            };

            const removeTag = (logId, isSubTag, tagToRemove) => {
                setLogs(logs.map(log => {
                    if (log.id !== logId) return log;
                    
                    const newLog = { ...log };
                    if (isSubTag) {
                        newLog.subTags = (newLog.subTags || []).filter(t => t !== tagToRemove);
                    } else {
                        const strategiesArray = Array.isArray(newLog.strategy) ? newLog.strategy : (newLog.strategy ? [newLog.strategy] : []);
                        newLog.strategy = strategiesArray.filter(s => s !== tagToRemove);
                    }
                    return newLog;
                }));
            };

            const handleEpsImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        
                        let newEps = { ...epsData };
                        let newCustom = { ...customStocks };
                        let addedCustomCount = 0;

                        let headerRowIndex = -1;
                        let colIdx = { code: -1, name: -1, eps25: -1, eps26: -1, growth: -1, futures: -1 };

                        for (let i = 0; i < Math.min(20, rawData.length); i++) {
                            const row = rawData[i];
                            if (!Array.isArray(row)) continue;
                            
                            const code = row.findIndex(c => typeof c === 'string' && (c.includes('代號') || c.includes('股號') || c.includes('代碼')));
                            if (code !== -1) {
                                headerRowIndex = i;
                                colIdx.code = code;
                                colIdx.name = row.findIndex(c => typeof c === 'string' && (c.includes('股名') || c.includes('名稱') || c.includes('公司')));
                                colIdx.eps25 = row.findIndex(c => typeof c === 'string' && (c.includes('2025EPS') || c === '2025' || c.includes('EPS25')));
                                colIdx.eps26 = row.findIndex(c => typeof c === 'string' && (c.includes('2026EPS') || c === '2026' || c.includes('EPS26')));
                                colIdx.growth = row.findIndex(c => typeof c === 'string' && c.includes('成長率'));
                                colIdx.futures = row.findIndex(c => typeof c === 'string' && (c.includes('股期') || c.includes('期貨')));
                                break;
                            }
                        }

                        if (headerRowIndex !== -1) {
                            for (let i = headerRowIndex + 1; i < rawData.length; i++) {
                                const row = rawData[i];
                                if (!row || row[colIdx.code] === undefined) continue;
                                
                                const code = row[colIdx.code];
                                const name = colIdx.name !== -1 ? row[colIdx.name] : '';
                                const eps25 = colIdx.eps25 !== -1 ? row[colIdx.eps25] : undefined;
                                const eps26 = colIdx.eps26 !== -1 ? row[colIdx.eps26] : undefined;
                                const epsGrowth = colIdx.growth !== -1 ? row[colIdx.growth] : undefined;
                                const futures = colIdx.futures !== -1 ? row[colIdx.futures] : undefined;

                                const strCode = String(code).trim();
                                if (strCode === '') continue;

                                let formattedGrowth = '-';
                                if (epsGrowth !== undefined && epsGrowth !== null && String(epsGrowth).trim().toUpperCase() !== 'NAN') {
                                    const numGrowth = parseFloat(epsGrowth);
                                    if (!isNaN(numGrowth)) {
                                        formattedGrowth = Number((numGrowth * 100).toFixed(2)) + '%';
                                    } else {
                                        formattedGrowth = epsGrowth; 
                                    }
                                }

                                const hasFutures = !!futures && String(futures).trim() !== '';

                                newEps[strCode] = { 
                                    eps25: eps25 !== undefined && eps25 !== null && String(eps25).trim() !== '' ? eps25 : '-', 
                                    eps26: eps26 !== undefined && eps26 !== null && String(eps26).trim() !== '' ? eps26 : '-',
                                    epsGrowth: formattedGrowth,
                                    hasFutures: hasFutures
                                };

                                if (!stockMap[strCode] && name) {
                                    newCustom[strCode] = { name: String(name).trim(), industry: "匯入補齊" };
                                    addedCustomCount++;
                                }
                            }
                            setEpsData(newEps);
                            setCustomStocks(newCustom);
                            setAlert({ show: true, msg: `EPS 與股期資料匯入成功！自動補齊了 ${addedCustomCount} 檔未知股票。` });
                        } else {
                            setAlert({ show: true, msg: `找不到「股票代號」欄位，請確認檔案格式！` });
                        }
                    } catch(e) {
                        console.error(e);
                        setAlert({ show: true, msg: `檔案解析失敗，請確認是否為有效的 Excel 檔案。` });
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null;
            };

            const getExportData = (formatType) => {
                let titleName = "多重篩選漏斗";
                if (formatType === 'score-futures') titleName = "個股期篩選漏斗";
                else if (formatType === 'growth') titleName = "EPS成長率排行";

                const sDate = getTodayLocal();
                const eDate = getTodayLocal();
                const dateRangeStr = sDate;

                let targetLogs = logs.filter(l => l.date >= sDate && l.date <= eDate);
                if (copySubTags.length > 0) {
                    targetLogs = targetLogs.filter(l => {
                        return l.subTags && l.subTags.some(t => copySubTags.includes(t));
                    });
                }

                if (targetLogs.length === 0) {
                    setAlert({ show: true, msg: `今日 ${dateRangeStr} ${copySubTags.length > 0 ? '符合所選標籤' : ''}無選股紀錄！` });
                    return null;
                }

                let processedLogs = targetLogs.map(l => {
                    let allTags = [];
                    if (l.subTags && l.subTags.length > 0) allTags.push(...l.subTags);
                    const strategiesArray = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                    strategiesArray.forEach(sId => {
                        const s = STRATEGIES.find(str => str.id === sId);
                        if (s) {
                            const hasSubTag = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                            if (!hasSubTag) allTags.push(s.label);
                        }
                    });

                    let baseScore = allTags.length;
                    let displayTags = allTags;
                    if (copySubTags.length > 0) {
                        displayTags = allTags.filter(t => copySubTags.includes(t));
                    }
                    
                    const eps = epsData[l.stockId] || {};
                    const rawGrowth = eps.epsGrowth;
                    const numGrowth = parseFloat(rawGrowth);
                    const validGrowth = !isNaN(numGrowth) ? numGrowth : -999999;
                    const displayGrowth = rawGrowth || '-';

                    if (validGrowth > 0) {
                        baseScore += 1;
                    }

                    return { ...l, allTags, displayTags, score: baseScore, validGrowth, displayGrowth };
                });

                let strategyGroups = [];
                let sortedLogs = [...processedLogs];

                if (formatType === 'time') {
                    sortedLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'score') {
                    sortedLogs.sort((a, b) => b.score - a.score || parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'score-futures') {
                    sortedLogs = sortedLogs.filter(l => epsData[l.stockId]?.hasFutures);
                    if (sortedLogs.length === 0) {
                        setAlert({ show: true, msg: `找不到今日 ${dateRangeStr} 符合條件且具備「股期」的選股紀錄！` });
                        return null;
                    }
                    sortedLogs.sort((a, b) => b.score - a.score || parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'growth') {
                    sortedLogs.sort((a, b) => b.validGrowth - a.validGrowth || parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'strategy') {
                    // 自訂義排序權重
                    const strategyOrder = ['破繭而出', '月來越好', '季不可失', '量價齊揚', 'OBV突破'];
                    
                    const groupMap = {};
                    processedLogs.forEach(l => {
                        let tagsToGroup = l.displayTags;
                        if (tagsToGroup.length === 0) tagsToGroup = ['未分類'];

                        tagsToGroup.forEach(tag => {
                            if (!groupMap[tag]) groupMap[tag] = [];
                            if (!groupMap[tag].includes(l)) groupMap[tag].push(l);
                        });
                    });

                    // 1. 先處理指定的排序名單
                    strategyOrder.forEach(label => {
                        if (groupMap[label] && groupMap[label].length > 0) {
                            let tagLogs = groupMap[label];
                            tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            strategyGroups.push({ label: label, logs: tagLogs });
                            // 處理完後標記或刪除，避免重複
                            delete groupMap[label];
                        }
                    });

                    // 2. 處理剩下的主策略標籤
                    STRATEGIES.forEach(strat => {
                        if (groupMap[strat.label] && groupMap[strat.label].length > 0) {
                            let tagLogs = groupMap[strat.label];
                            tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            strategyGroups.push({ label: strat.label, logs: tagLogs });
                            delete groupMap[strat.label];
                        }
                        const subTags = SUB_TAGS[strat.id] || [];
                        subTags.forEach(tag => {
                            if (groupMap[tag] && groupMap[tag].length > 0) {
                                let tagLogs = groupMap[tag];
                                tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                                strategyGroups.push({ label: tag, logs: tagLogs });
                                delete groupMap[tag];
                            }
                        });
                    });

                    // 3. 處理未分類或其他不在上述名單內的標籤
                    Object.keys(groupMap).forEach(label => {
                         if (groupMap[label] && groupMap[label].length > 0) {
                            let tagLogs = groupMap[label];
                            tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            strategyGroups.push({ label: label, logs: tagLogs });
                        }
                    });
                }

                return { titleName, dateRangeStr, sortedLogs, strategyGroups };
            };

            const copyLogs = (formatType) => {
                const data = getExportData(formatType);
                if (!data) return;

                let resultText = `| ${data.dateRangeStr} ${data.titleName} |\n`;
                const now = new Date();
                const timeString = now.toLocaleTimeString('zh-TW', { hour12: false });
                resultText += `產出時間：${data.dateRangeStr} ${timeString}\n`;
                
                if (copySubTags.length > 0) {
                    resultText += `🎯 指定篩選：${copySubTags.join(', ')}\n`;
                }
                resultText += `\n`;
                
                let detailText = ``;

                if (formatType === 'strategy') {
                    data.strategyGroups.forEach(grp => {
                        detailText += `🎯 [${grp.label}] (共 ${grp.logs.length} 檔)\n`;
                        grp.logs.forEach(l => {
                            detailText += `  - ${l.stockId} ${l.name}\n`;
                        });
                        detailText += `\n`;
                    });
                } else {
                    data.sortedLogs.forEach(l => {
                        const countStr = l.score > 0 ? ` (${l.score}分)` : '';
                        const tagStr = l.displayTags.length > 0 ? ` (${l.displayTags.join('、')})` : '';
                        if (formatType === 'growth') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}\n`;
                        } else if (formatType === 'score' || formatType === 'score-futures') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}${countStr}${tagStr}\n`;
                        } else {
                            detailText += `- ${l.stockId} ${l.name}${countStr}${tagStr}\n`;
                        }
                    });
                }

                resultText += detailText;
                resultText += `-------------------\n⚠️ 免責聲明：本資訊僅供個人交易紀錄參考，非任何買賣建議，投資有賺有賠，請盈虧自負。`;
                
                fallbackCopyTextToClipboard(resultText);
                setCopySuccess(formatType);
                setTimeout(() => setCopySuccess(null), 2000); 
            };

            return (
                <div className="animate-fade-in-up space-y-6">
                    {/* 控制區塊 */}
                    <div className="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-lg">
                        <h2 className="text-2xl font-title text-blue-400 mb-6 flex items-center gap-2"><FileText /> 新增選股日誌</h2>
                        
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">日期</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" />
                            </div>
                            <div className="relative">
                                <label className="block text-sm text-slate-400 mb-1">股號</label>
                                <div className="flex gap-2">
                                    <input 
                                        type="text" 
                                        list="stock-ids-list"
                                        value={stockId} 
                                        onChange={handleStockIdChange} 
                                        onKeyDown={e => { if (e.key === 'Enter') handleAddLog(); }}
                                        placeholder="e.g. 2330" 
                                        className={`w-full bg-slate-900 border ${isForbiddenStock ? 'border-red-500' : 'border-slate-700'} rounded-lg p-2.5 font-mono-num focus:border-blue-500 outline-none transition ${isForbiddenStock ? 'text-red-500 font-bold bg-red-900/20' : 'text-white'}`} 
                                    />
                                </div>
                            </div>
                            <div className="col-span-2">
                                <label className="block text-sm text-slate-400 mb-1">對應股票名稱 (可輸入名稱反查)</label>
                                <div className="relative h-[46px]">
                                    <input 
                                        type="text" 
                                        list="stock-names-list"
                                        value={stockName} 
                                        onChange={handleStockNameChange}
                                        onKeyDown={e => { if (e.key === 'Enter') handleAddLog(); }}
                                        placeholder="輸入股名自動帶出股號..." 
                                        className={`w-full h-full bg-slate-800/50 border ${isForbiddenStock ? 'border-red-500' : (isUnknownStock ? 'border-yellow-500/50' : 'border-slate-700/50')} rounded-lg p-2.5 focus:border-blue-500 outline-none transition ${isForbiddenStock ? 'text-red-500 font-bold bg-red-900/20' : (stockMap[stockId] ? 'text-green-400 font-bold' : 'text-white')}`} 
                                    />
                                    {isUnknownStock && !isForbiddenStock && (
                                        <span className="absolute right-3 top-2.5 text-xs text-yellow-500 bg-yellow-500/10 px-2 py-1 rounded">送出自動記憶</span>
                                    )}
                                    {isForbiddenStock && (
                                        <span className="absolute right-3 top-2.5 text-xs text-red-500 bg-red-500/20 px-2 py-1 rounded font-bold">嚴禁買入</span>
                                    )}
                                </div>
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                            </div>
                        </div>

                        {/* 策略按鈕區塊 */}
                        <div className="mb-4">
                            <label className="block text-sm text-slate-400 mb-1.5">符合策略條件 (選填)</label>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                {STRATEGIES.map(s => (
                                    <button 
                                        key={s.id}
                                        onClick={() => handleStrategySelect(s.id)}
                                        className={`flex items-center justify-center gap-1.5 p-2 rounded-lg border transition-all ${selectedStrategy === s.id ? `bg-gradient-to-r ${s.color} border-transparent text-white shadow-md` : 'bg-slate-900 border-slate-700 text-slate-400 hover:border-slate-500'}`}
                                    >
                                        <s.icon size={16} />
                                        <span className="text-sm font-medium">{s.label}</span>
                                    </button>
                                ))}
                            </div>
                            
                            {selectedStrategy && SUB_TAGS[selectedStrategy] && (
                                <div className="mt-2 p-3 bg-slate-800/30 rounded-lg border border-slate-700/50 animate-fade-in-down">
                                    <div className="flex justify-between items-center mb-2">
                                        <label className="block text-xs text-slate-400">進階子標籤 (單選)</label>
                                        {selectedSubTags.length > 0 && (
                                            <button onClick={() => setSelectedSubTags([])} className="text-[10px] text-slate-500 hover:text-slate-300 transition px-1.5 py-0.5 rounded hover:bg-slate-700">🧹 清空已選</button>
                                        )}
                                    </div>
                                    <div className="flex flex-wrap gap-1.5">
                                        {SUB_TAGS[selectedStrategy].map(tag => (
                                            <button
                                                key={tag}
                                                onClick={() => toggleSubTag(tag)}
                                                className={`px-2.5 py-1 rounded-full text-[11px] font-medium transition-all ${
                                                    selectedSubTags.includes(tag)

                                    {filteredJournalLogs.map(log => {

                                                            return strategiesArray.map(stratId => {

                                                                if (log.subTags && log.subTags.length > 0 && hasSubTag) return null;
                                                                return (
                                                                    <span

                                                                        className={`group cursor-pointer inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-gradient-to-r ${s.color} bg-opacity-10 text-white hover:opacity-80 transition-all`}
                                                                        title="點擊移除策略"
                                                                    >
                                                                        {s.emoji} {s.label}
                                                                        <X size={12} className="opacity-0 group-hover:opacity-100 transition-opacity w-3 h-3" />

                                                        })()}
                                                    </div>
                                                </td>
                                                <td className="p-4 text-center">
                                                    <div className="flex justify-center items-center gap-3">
                                                        <button onClick={() => onAiDiagnose(log)} className="text-purple-400 hover:text-purple-300 transition" title="✨ AI 個股診斷">

        // ==========================================
        // 4. 模組二：大盤支撐壓力計算機 (Calculator)
        // ==========================================
        const CalculatorModule = ({ calcHistory, setCalcHistory, stockMap, setCustomStocks, epsData }) => {
            const [session, setSession] = useState('日盤');
            const [h, setH] = useState('');
            const [l, setL] = useState('');
            const [c, setC] = useState('');
            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState(''); 
            const [results, setResults] = useState(null);
            const [expandedRowId, setExpandedRowId] = useState(null);

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockName('');
                    return;
                }
                if (stockMap[trimmedVal]) {
                    setStockName(stockMap[trimmedVal].name);
                }
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setStockName(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockId('');
                    return;
                }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) {
                    setStockId(foundId);
                }
            };

            const stockIdsDatalist = useMemo(() => (
                <datalist id="calc-stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="calc-stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const calculate = () => {
                const H = parseFloat(h);
                const L = parseFloat(l);
                const C = parseFloat(c);
                if (isNaN(H) || isNaN(L) || isNaN(C)) return;

                const sId = stockId.trim();
                const sName = stockName.trim();
                if (sId && sName && !stockMap[sId] && setCustomStocks) {
                    setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                }

                const Range = H - L;
                
                const cdpVal = (H + L + 2 * C) / 4;
                const cdp = {
                    AH: (cdpVal + Range).toFixed(2),
                    NH: (2 * cdpVal - L).toFixed(2),
                    CDP: cdpVal.toFixed(2),
                    NL: (2 * cdpVal - H).toFixed(2),
                    AL: (cdpVal - Range).toFixed(2)
                };

                const pVal = (H + L + C) / 3;
                const pivot = {
                    R2: (pVal + Range).toFixed(2),
                    R1: (2 * pVal - L).toFixed(2),
                    P: pVal.toFixed(2),
                    S1: (2 * pVal - H).toFixed(2),
                    S2: (pVal - Range).toFixed(2)
                };

                const fibo = {
                    R3: (pVal + Range * 1.0).toFixed(2),
                    R2: (pVal + Range * 0.618).toFixed(2),
                    R1: (pVal + Range * 0.382).toFixed(2),
                    P: pVal.toFixed(2),
                    S1: (pVal - Range * 0.382).toFixed(2),
                    S2: (pVal - Range * 0.618).toFixed(2),
                    S3: (pVal - Range * 1.0).toFixed(2)
                };

                setResults({ cdp, pivot, fibo });
            };

            const saveHistory = () => {
                if (!results) return;
                const sId = stockId.trim();
                const sName = stockName.trim();
                const finalName = sName || stockMap[sId]?.name || '';
                
                const newRecord = {
                    id: Date.now().toString(),
                    date: getTodayLocal(),
                    session,
                    stockId: sId,
                    name: finalName,
                    inputs: { h, l, c },
                    results
                };
                setCalcHistory([newRecord, ...calcHistory]);
            };

            const copySystem = (sysName, data, record = null) => {
                const sId = stockId.trim();
                const finalName = stockName.trim() || stockMap[sId]?.name || '';
                const rec = record || { date: getTodayLocal(), session, stockId: sId, name: finalName };
                const titleStr = `【${rec.date} ${rec.session} ${rec.stockId} ${rec.name} 關鍵點位參考 - ${sysName}】\n\n`;
                let text = titleStr;
                
                Object.keys(data).forEach(k => {
                    text += `${k}:\t${data[k]}\n`;
                });
                
                fallbackCopyTextToClipboard(text);
            };

            const ColorRow = ({ label, value, type }) => {
                let colorClass = 'text-slate-300';
                if (type === 'R') colorClass = 'text-red-400 font-bold';
                if (type === 'S') colorClass = 'text-emerald-400 font-bold';
                if (type === 'P') colorClass = 'text-yellow-400 font-bold';

                return (
                    <div className="flex justify-between items-center py-1.5 border-b border-slate-800/50 last:border-0">
                        <span className="text-sm text-slate-500 w-8">{label}</span>
                        <span className={`font-mono-num text-lg ${colorClass}`}>{value}</span>
                    </div>
                );
            };

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="bg-[#111827] p-6 rounded-2xl border border-slate-800 shadow-lg">
                        <h2 className="text-2xl font-title text-indigo-400 mb-6 flex items-center gap-2"><Calculator /> 大盤支撐壓力計算機</h2>
                        
                        <div className="grid grid-cols-2 md:grid-cols-6 gap-4 mb-6">
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">預測盤別</label>
                                <select value={session} onChange={e=>setSession(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 focus:border-indigo-500 outline-none">
                                    <option>日盤</option>
                                    <option>夜盤</option>
                                    <option>全盤</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">最高價 (H)</label>
                                <input type="number" step="any" value={h} onChange={e=>setH(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num" />
                            </div>
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">最低價 (L)</label>
                                <input type="number" step="any" value={l} onChange={e=>setL(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num" />
                            </div>
                            <div>
                                <label className="block text-sm text-slate-400 mb-1">收盤價 (C)</label>
                                <input type="number" step="any" value={c} onChange={e=>setC(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num" />
                            </div>
                            <div className="relative">
                                <label className="block text-sm text-slate-400 mb-1">股號/代號 (選填)</label>
                                <input type="text" list="calc-stock-ids-list" value={stockId} onChange={handleStockIdChange} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} placeholder="如: TX00" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 font-mono-num focus:border-indigo-500 outline-none transition" />
                            </div>
                            <div className="relative">
                                <label className="block text-sm text-slate-400 mb-1">股票名稱 (選填)</label>
                                <input type="text" list="calc-stock-names-list" value={stockName} onChange={handleStockNameChange} onKeyDown={e => { if (e.key === 'Enter') calculate(); }} placeholder="如: 台指期" className={`w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 focus:border-indigo-500 outline-none transition ${stockMap[stockId] ? 'text-green-400' : 'text-slate-200'}`} />
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                            </div>
                        </div>

                        <div className="flex gap-4">
                            <button onClick={calculate} className="bg-indigo-600 hover:bg-indigo-500 text-white px-8 py-2.5 rounded-lg font-bold flex-1 shadow-lg shadow-indigo-900/50 transition">
                                開始計算
                            </button>
                            {results && (
                                <button onClick={saveHistory} className="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-lg font-bold flex items-center gap-2 transition">
                                    <Save size={18} /> 儲存紀錄
                                </button>
                            )}
                        </div>
                    </div>

                    {results && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 animate-bounce-in">
                            <div className="bg-slate-900 rounded-2xl border border-slate-700 p-5 shadow-xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-blue-500/10 rounded-bl-full -z-0"></div>
                                <h3 className="text-lg font-bold text-blue-400 mb-4 border-b border-slate-700 pb-2 relative z-10">CDP 系統</h3>
                                <div className="space-y-1 relative z-10">
                                    <ColorRow label="AH" value={results.cdp.AH} type="R" />
                                    <ColorRow label="NH" value={results.cdp.NH} type="R" />
                                    <ColorRow label="CDP" value={results.cdp.CDP} type="P" />
                                    <ColorRow label="NL" value={results.cdp.NL} type="S" />
                                    <ColorRow label="AL" value={results.cdp.AL} type="S" />
                                </div>
                                <button onClick={() => copySystem('CDP系統', results.cdp)} className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg flex justify-center items-center gap-2 transition text-slate-300">
                                    <ClipboardCopy size={16} /> 複製 (CDP)
                                </button>
                            </div>
                            
                            <div className="bg-slate-900 rounded-2xl border border-slate-700 p-5 shadow-xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-purple-500/10 rounded-bl-full -z-0"></div>
                                <h3 className="text-lg font-bold text-purple-400 mb-4 border-b border-slate-700 pb-2 relative z-10">Pivot 系統</h3>
                                <div className="space-y-1 relative z-10">
                                    <ColorRow label="R2" value={results.pivot.R2} type="R" />
                                    <ColorRow label="R1" value={results.pivot.R1} type="R" />
                                    <ColorRow label="P" value={results.pivot.P} type="P" />
                                    <ColorRow label="S1" value={results.pivot.S1} type="S" />
                                    <ColorRow label="S2" value={results.pivot.S2} type="S" />
                                </div>
                                <button onClick={() => copySystem('Pivot系統', results.pivot)} className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg flex justify-center items-center gap-2 transition text-slate-300">
                                    <ClipboardCopy size={16} /> 複製 (Pivot)
                                </button>
                            </div>

                            <div className="bg-slate-900 rounded-2xl border border-slate-700 p-5 shadow-xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-amber-500/10 rounded-bl-full -z-0"></div>
                                <h3 className="text-lg font-bold text-amber-400 mb-4 border-b border-slate-700 pb-2 relative z-10">Fibonacci</h3>
                                <div className="space-y-1 relative z-10">
                                    <ColorRow label="R3" value={results.fibo.R3} type="R" />
                                    <ColorRow label="R2" value={results.fibo.R2} type="R" />
                                    <ColorRow label="R1" value={results.fibo.R1} type="R" />
                                    <ColorRow label="P" value={results.fibo.P} type="P" />
                                    <ColorRow label="S1" value={results.fibo.S1} type="S" />
                                    <ColorRow label="S2" value={results.fibo.S2} type="S" />
                                    <ColorRow label="S3" value={results.fibo.S3} type="S" />
                                </div>
                                <button onClick={() => copySystem('Fibonacci', results.fibo)} className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg flex justify-center items-center gap-2 transition text-slate-300">
                                    <ClipboardCopy size={16} /> 複製 (Fibo)
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="bg-[#111827] rounded-2xl border border-slate-800 overflow-hidden mt-8 shadow-lg">
                        <div className="p-4 border-b border-slate-800 bg-slate-800/30 flex justify-between items-center">
                            <h3 className="font-bold text-slate-300">歷史計算紀錄</h3>
                        </div>
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-800/50 text-slate-400 text-sm">
                                    <th className="p-3">日期</th>
                                    <th className="p-3">盤別</th>
                                    <th className="p-3">標的</th>
                                    <th className="p-3 font-mono-num">H / L / C</th>
                                    <th className="p-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/50">
                                {calcHistory.map(rec => {
                                    const hasFutures = epsData && epsData[rec.stockId]?.hasFutures;
                                    return (
                                    <React.Fragment key={rec.id}>
                                        <tr className="hover:bg-slate-800/20 transition">
                                            <td className="p-3 font-mono-num text-sm text-slate-400">{rec.date}</td>
                                            <td className="p-3 text-sm"><span className="bg-slate-800 px-2 py-1 rounded text-slate-300">{rec.session}</span></td>
                                            <td className="p-3 text-sm font-bold text-white">
                                                <div className="flex items-center">
                                                    <FuturesBadge hasFutures={hasFutures} />
                                                    {rec.stockId} <span className="font-normal ml-1">{rec.name}</span>
                                                </div>
                                            </td>
                                            <td className="p-3 text-sm font-mono-num text-slate-300">{rec.inputs.h} / {rec.inputs.l} / {rec.inputs.c}</td>
                                            <td className="p-3 text-center">
                                                <div className="flex justify-center gap-2">
                                                    <button onClick={() => setExpandedRowId(expandedRowId === rec.id ? null : rec.id)} className="p-1.5 bg-blue-600/20 text-blue-400 hover:bg-blue-600/40 rounded transition" title="查看數據"><Eye size={16} /></button>
                                                    <button onClick={() => { setH(rec.inputs.h); setL(rec.inputs.l); setC(rec.inputs.c); setSession(rec.session); setStockId(rec.stockId); setStockName(rec.name); }} className="p-1.5 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/40 rounded transition" title="載入參數"><Upload size={16} /></button>
                                                    <button onClick={() => setCalcHistory(calcHistory.filter(h => h.id !== rec.id))} className="p-1.5 bg-red-600/20 text-red-400 hover:bg-red-600/40 rounded transition" title="刪除"><Trash2 size={16} /></button>
                                                </div>
                                            </td>
                                        </tr>
                                        {expandedRowId === rec.id && (
                                            <tr className="bg-slate-900/50 border-l-4 border-blue-500 animate-fade-in-down">
                                                <td colSpan="5" className="p-4">
                                                    <div className="flex gap-4">
                                                        <div className="flex-1 bg-slate-900 p-3 rounded border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-2">
                                                                <span className="text-xs font-bold text-blue-400">CDP</span>
                                                                <button onClick={()=>copySystem('CDP', rec.results.cdp, rec)} className="text-slate-500 hover:text-white"><ClipboardCopy size={14}/></button>
                                                            </div>
                                                            <div className="grid grid-cols-5 text-xs text-center font-mono-num">
                                                                <div><div className="text-slate-500">AH</div><div className="text-red-400">{rec.results.cdp.AH}</div></div>
                                                                <div><div className="text-slate-500">NH</div><div className="text-red-400">{rec.results.cdp.NH}</div></div>
                                                                <div><div className="text-slate-500">CDP</div><div className="text-yellow-400">{rec.results.cdp.CDP}</div></div>
                                                                <div><div className="text-slate-500">NL</div><div className="text-emerald-400">{rec.results.cdp.NL}</div></div>
                                                                <div><div className="text-slate-500">AL</div><div className="text-emerald-400">{rec.results.cdp.AL}</div></div>
                                                            </div>
                                                        </div>
                                                        <div className="flex-1 bg-slate-900 p-3 rounded border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-2">
                                                                <span className="text-xs font-bold text-purple-400">Pivot</span>
                                                                <button onClick={()=>copySystem('Pivot', rec.results.pivot, rec)} className="text-slate-500 hover:text-white"><ClipboardCopy size={14}/></button>
                                                            </div>
                                                            <div className="grid grid-cols-5 text-xs text-center font-mono-num">
                                                                <div><div className="text-slate-500">R2</div><div className="text-red-400">{rec.results.pivot.R2}</div></div>
                                                                <div><div className="text-slate-500">R1</div><div className="text-red-400">{rec.results.pivot.R1}</div></div>
                                                                <div><div className="text-slate-500">P</div><div className="text-yellow-400">{rec.results.pivot.P}</div></div>
                                                                <div><div className="text-slate-500">S1</div><div className="text-emerald-400">{rec.results.pivot.S1}</div></div>
                                                                <div><div className="text-slate-500">S2</div><div className="text-emerald-400">{rec.results.pivot.S2}</div></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </React.Fragment>
                                )})}
                                {calcHistory.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-500">無歷史紀錄</td></tr>}
                            </tbody>
                        </table>
