<body>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useCallback, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            TrendingUp, BarChart2, Zap, AlertCircle, Save, Trash2, 
            Download, Upload, Eye, FileText, CheckCircle, Calculator,
            ClipboardCopy, Search, PlusCircle, LayoutDashboard, Star, X, Target,
            ArrowUp, ArrowDown, ArrowUpDown, Ban, Sparkles, Bot, Key, Filter, CloudCog, CloudLightning
        } from 'lucide-react';

        // 解決圖標找不到的問題
        const ShieldAlert = AlertCircle;
        const ShieldCheck = CheckCircle;

        // ==========================================
        // Gemini API Hook
        // ==========================================
        const useGeminiAPI = () => {
            const apiKey = "" || window.localStorage.getItem('ryan_gemini_api_key');

            const generateText = async (prompt, systemInstructionText) => {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: prompt }] }],
                    systemInstruction: { parts: [{ text: systemInstructionText }] }
                };

                const fetchWithRetry = async (retries = 5, delay = 1000) => {
                    try {
                        const response = await fetch(url, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const result = await response.json();
                        return result.candidates?.[0]?.content?.parts?.[0]?.text || "無法取得 AI 回應，請稍後再試。";
                    } catch (error) {
                        if (retries > 0) {
                            await new Promise(res => setTimeout(res, delay));
                            return fetchWithRetry(retries - 1, delay * 2);
                        }
                        throw error;
                    }
                };

                try {
                    return await fetchWithRetry();
                } catch (error) {
                    console.error("Gemini API Error:", error);
                    return "❌ AI 連線失敗，請檢查金鑰或網路連線。";
                }
            };

            return { generateText };
        };

        // ==========================================
        // 1. 靜態資料庫與預設黑名單
        // ==========================================
        const STATIC_STOCK_DB = {};
        
        const DEFAULT_FORBIDDEN = [];

        // ==========================================
        // 2. 共用元件 (Hooks & Modals)
        // ==========================================
        
        const getTodayLocal = () => {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const fallbackCopyTextToClipboard = (text) => {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.top = "0";
            textArea.style.left = "0";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try { document.execCommand('copy'); } catch (err) {}
            document.body.removeChild(textArea);
        };

        function useFirebaseState(key, initialValue) {
            const [storedValue, setStoredValue] = useState(initialValue);
            const [isInitialized, setIsInitialized] = useState(false);

            useEffect(() => {
                const initData = async () => {
                    try {
                        if(window.firebaseDB) {
                            const dbRef = window.firebaseRef(window.firebaseDB, key);
                            const snapshot = await window.firebaseGet(dbRef);
                            if (snapshot.exists()) {
                                setStoredValue(snapshot.val());
                            } else {
                                window.firebaseSet(dbRef, initialValue);
                                setStoredValue(initialValue);
                            }
                        }
                    } catch (error) {
                        console.error("Firebase load error for key", key, error);
                    } finally {
                        setIsInitialized(true);
                    }
                };
                initData();
            }, [key]);

            useEffect(() => {
                if(!isInitialized || !window.firebaseDB) return;
                
                const dbRef = window.firebaseRef(window.firebaseDB, key);
                const unsubscribe = window.firebaseOnValue(dbRef, (snapshot) => {
                    if (snapshot.exists()) {
                         setStoredValue(snapshot.val());
                    }
                });

                return () => unsubscribe();
            }, [key, isInitialized]);

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    if(window.firebaseDB) {
                         window.firebaseSet(window.firebaseRef(window.firebaseDB, key), valueToStore);
                    }
                } catch (error) {
                     console.error("Firebase save error", error);
                }
            };

            return [storedValue, setValue, isInitialized];
        }

        const ConfirmModal = ({ isOpen, title, message, onConfirm, onCancel }) => {
            const btnRef = useRef(null);
            useEffect(() => {
                if (isOpen && btnRef.current) setTimeout(() => { if (btnRef.current) btnRef.current.focus(); }, 10);
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); onConfirm(); } 
                    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); onCancel(); }
                };
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onConfirm, onCancel]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-[100] animate-fade-in-down px-4">
                    <div className="bg-slate-900 border border-slate-700 p-6 md:p-8 rounded-3xl w-full max-w-md shadow-2xl">
                        <div className="flex items-center gap-4 mb-6 text-red-400">
                            <div className="p-3 bg-red-500/10 rounded-2xl shrink-0"><AlertCircle size={28} /></div>
                            <h3 className="text-xl md:text-2xl font-bold">{title}</h3>
                        </div>
                        <p className="text-slate-300 mb-8 leading-relaxed text-sm md:text-base">{message}</p>
                        <div className="flex justify-end gap-3 md:gap-4 flex-wrap">
                            <button onClick={onCancel} className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 transition font-medium text-slate-300 text-sm md:text-base w-full sm:w-auto">取消</button>
                            <button ref={btnRef} onClick={onConfirm} className="px-4 py-2.5 rounded-xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 transition text-white font-bold shadow-lg shadow-red-900/50 text-sm md:text-base w-full sm:w-auto">確認執行</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AlertModal = ({ isOpen, message, onClose }) => {
            const btnRef = useRef(null);
            useEffect(() => {
                if (isOpen && btnRef.current) setTimeout(() => { if (btnRef.current) btnRef.current.focus(); }, 10);
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); onClose(); }
                };
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onClose]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center z-[100] animate-bounce-in px-4">
                    <div className="bg-slate-900 border border-slate-700 p-6 md:p-8 rounded-3xl w-full max-w-sm shadow-2xl text-center">
                        <div className="w-16 h-16 md:w-20 md:h-20 bg-green-500/10 rounded-full flex items-center justify-center mx-auto mb-6 shrink-0">
                            <CheckCircle size={36} className="text-green-500 md:w-10 md:h-10" />
                        </div>
                        <p className="text-slate-200 mb-8 text-base md:text-lg font-medium leading-relaxed">{message}</p>
                        <button ref={btnRef} onClick={onClose} className="px-6 py-3 rounded-xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 transition w-full text-white font-bold shadow-lg shadow-blue-900/50 text-sm md:text-base">了解</button>
                    </div>
                </div>
            );
        };

        const ForbiddenModal = ({ isOpen, stockName, onConfirm, onCancel }) => {
            const btnRef = useRef(null);
            useEffect(() => {
                if (isOpen && btnRef.current) setTimeout(() => { if (btnRef.current) btnRef.current.focus(); }, 10);
                if (!isOpen) return;
                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); onConfirm(); }
                    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); onCancel(); }
                };
                window.addEventListener('keydown', handleKeyDown, true);
                return () => window.removeEventListener('keydown', handleKeyDown, true);
            }, [isOpen, onConfirm, onCancel]);

            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-red-950/90 backdrop-blur-md flex items-center justify-center z-[9999] animate-bounce-in px-4 py-6 overflow-y-auto">
                    <div className="bg-[#1a0505] border border-red-500/50 p-8 md:p-12 rounded-[2rem] w-full max-w-lg shadow-[0_0_100px_rgba(239,68,68,0.4)] text-center relative overflow-hidden my-auto">
                        <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-red-600 via-rose-500 to-red-600"></div>
                        <div className="absolute -left-20 -top-20 w-64 h-64 bg-red-600/20 rounded-full blur-[80px]"></div>

                            <button ref={btnRef} onClick={onConfirm} className="px-4 py-3 md:py-4 rounded-2xl bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-black text-base md:text-lg transition w-full sm:w-2/3 shadow-lg shadow-red-900/50 focus:ring-4 focus:ring-red-500/30 outline-none">我明白了並加入 (Enter)</button>
                        </div>
                    </div>
                </div>
            );
        };

        const AiModal = ({ isOpen, onClose, content, loading, title }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[100] animate-fade-in-down px-4 py-6">

                            {loading ? (
                                <div className="flex flex-col items-center justify-center h-40 md:h-48 space-y-4 md:space-y-6 text-fuchsia-400/80">
                                    <Bot size={56} className="animate-bounce drop-shadow-[0_0_15px_rgba(217,70,239,0.5)] md:w-16 md:h-16" />

                                </div>
                            ) : (
                                <div className="prose prose-invert max-w-none prose-p:leading-loose">
                                    {content}
                                </div>
                            )}
                        </div>
                        
                        <div className="flex justify-end pt-2 relative z-10 shrink-0">
                            <button onClick={onClose} className="px-6 md:px-8 py-3 md:py-3.5 rounded-xl bg-gradient-to-r from-fuchsia-600 to-purple-600 hover:from-fuchsia-500 hover:to-purple-500 transition text-white outline-none focus:ring-2 focus:ring-fuchsia-400 font-bold w-full shadow-lg shadow-fuchsia-900/30 text-base md:text-lg tracking-wider">完成閱讀</button>
                        </div>
                    </div>
                </div>
            );
        };

        const SortIcon = ({ sortKey, currentSort }) => {
            if (currentSort.key !== sortKey) return <ArrowUpDown size={14} className="text-slate-600 opacity-50" />;
            return currentSort.direction === 'asc' ? <ArrowUp size={14} className="text-blue-400" /> : <ArrowDown size={14} className="text-blue-400" />;

            return (
                <span className="bg-gradient-to-br from-fuchsia-500 to-purple-600 text-white text-[10px] px-1.5 py-0.5 rounded shadow-sm mr-2 flex-shrink-0 font-bold tracking-wider" title="具備個股期貨">期</span>
            );

        const getTwStockColor = (valStr) => {
            if (valStr === undefined || valStr === null || valStr === '-' || valStr === '') return 'text-slate-400';
            const val = parseFloat(String(valStr).replace(/,/g, '').replace('%', ''));
            if (isNaN(val) || val === 0) return 'text-slate-400';
            return val > 0 ? 'text-rose-400' : 'text-emerald-400';
        };

        // ==========================================
        // 3. 模組一：選股日誌與 EPS (Stock Journal)
        // ==========================================

            { id: 'emerging', label: '興櫃專區', icon: AlertCircle, color: 'from-fuchsia-500 to-purple-500', emoji: '🚀' },
        ];

            '破繭而出': 'from-orange-400 to-amber-500',
            '披荊斬棘': 'from-amber-400 to-orange-500',
            '月來越好': 'from-amber-500 to-yellow-600',
            '季不可失': 'from-lime-500 to-green-600',
            '守株待兔': 'from-emerald-400 to-teal-500',
            'OBV突破': 'from-teal-400 to-cyan-500',
            '回後買上漲': 'from-cyan-400 to-sky-500',
            '高成交值多頭突破上關': 'from-sky-400 to-blue-500',
            '高成交值': 'from-rose-400 to-red-500',
            'KD金叉': 'from-blue-400 to-indigo-500',
            'MACD翻紅': 'from-indigo-400 to-violet-500',
            '收盤期貨續拉': 'from-violet-400 to-purple-500',
            '跌破月季線': 'from-fuchsia-400 to-pink-500',
            
            '法人加持': 'from-rose-400 to-pink-500',
            '外資買進': 'from-pink-400 to-fuchsia-500',
            '投信買進': 'from-fuchsia-400 to-purple-500',
            '權證大單追蹤': 'from-purple-400 to-violet-500',
            '四線上揚籌碼集中': 'from-violet-400 to-indigo-500',
            '多頭月營收創高': 'from-indigo-400 to-blue-500',
            '1日籌碼集中度>10%': 'from-blue-400 to-sky-500',
            '1日籌碼集中度>20%': 'from-sky-400 to-cyan-500',
            '5日籌碼集中度>10%': 'from-cyan-400 to-teal-500',
            '5日籌碼集中度>20%': 'from-teal-400 to-emerald-500',

            '當沖多方標的': 'from-red-500 to-orange-500',
            '當沖空方標的': 'from-emerald-500 to-teal-500',
            '當沖十字變盤': 'from-slate-500 to-slate-600',

            '興櫃-多頭突破上關價': 'from-amber-600 to-orange-600'
        };

        const StockJournal = ({ logs, setLogs, customStocks, setCustomStocks, epsData, setEpsData, stockMap, forbiddenStocks, onAiDiagnose }) => {
            const [date, setDate] = useState(getTodayLocal());
            const [copySubTags, setCopySubTags] = useState([]); 
            const [isCopyDropdownOpen, setIsCopyDropdownOpen] = useState(false);
            const copyDropdownRef = useRef(null);

            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState('');
            const [selectedStrategy, setSelectedStrategy] = useState('');
            const [selectedSubTags, setSelectedSubTags] = useState([]);
            const [alert, setAlert] = useState({ show: false, msg: '' });
            const [confirm, setConfirm] = useState({ show: false, action: null });
            const [forbiddenAlert, setForbiddenAlert] = useState({ show: false, stockName: '', action: null });
            const [copySuccess, setCopySuccess] = useState(null); 

            const [journalFilters, setJournalFilters] = useState({ date: getTodayLocal(), stock: '', futures: 'all', growth: 'all', tag: '', tagCount: 'all' });
            const [journalSort, setJournalSort] = useState({ key: 'id', direction: 'desc' });

            const handleJournalSort = (key) => {
                if (journalSort.key === key) {
                    setJournalSort({ key, direction: journalSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setJournalSort({ key, direction: 'desc' }); 
                }
            };

            const filteredJournalLogs = useMemo(() => {
                let result = logs.slice();
                
                if (journalFilters.date) result = result.filter(l => l.date === journalFilters.date);
                if (journalFilters.stock) {
                    const kw = journalFilters.stock.toLowerCase();
                    result = result.filter(l => l.stockId.toLowerCase().includes(kw) || l.name.toLowerCase().includes(kw));
                }
                if (journalFilters.futures !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        if (journalFilters.futures === 'yes') return eps.hasFutures;
                        return true; 
                    });
                }
                if (journalFilters.growth !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        const g = parseFloat(eps.epsGrowth);
                        if (journalFilters.growth === 'positive') return !isNaN(g) && g > 0;
                        if (journalFilters.growth === 'negative') return !isNaN(g) && g < 0;
                        return true;
                    });
                }
                if (journalFilters.tag) {
                    result = result.filter(l => {
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        const matchMain = strats.some(sId => {
                            const s = STRATEGIES.find(x => x.id === sId);
                            return s && s.label === journalFilters.tag;
                        });
                        const matchSub = l.subTags && l.subTags.includes(journalFilters.tag);
                        return matchMain || matchSub;
                    });
                }
                if (journalFilters.tagCount !== 'all') {
                    result = result.filter(l => {
                        let tCount = [];
                        if (l.subTags && l.subTags.length > 0) tCount.push(...l.subTags);
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        strats.forEach(sId => {
                            const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                            if (!hasSub) tCount.push(sId);
                        });
                        const c = tCount.length;
                        if (journalFilters.tagCount === '1') return c === 1;
                        if (journalFilters.tagCount === '2') return c === 2;
                        if (journalFilters.tagCount === '3') return c === 3;
                        if (journalFilters.tagCount === '4+') return c >= 4;
                        return true;
                    });
                }

                result.sort((a, b) => {
                    let valA, valB;
                    const epsA = epsData[a.stockId] || {};
                    const epsB = epsData[b.stockId] || {};

                    switch (journalSort.key) {
                        case 'date': valA = a.date; valB = b.date; if (valA === valB) { valA = parseInt(a.id); valB = parseInt(b.id); } break;
                        case 'stock': valA = a.stockId; valB = b.stockId; break;
                        case 'eps25': valA = parseFloat(epsA.eps25) || -999999; valB = parseFloat(epsB.eps25) || -999999; break;
                        case 'eps26': valA = parseFloat(epsA.eps26) || -999999; valB = parseFloat(epsB.eps26) || -999999; break;
                        case 'growth': valA = parseFloat(epsA.epsGrowth) || -999999; valB = parseFloat(epsB.epsGrowth) || -999999; break;
                        case 'tags': {
                            const getScore = (l) => {
                                let t = [];
                                if (l.subTags && l.subTags.length > 0) t.push(...l.subTags);
                                const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                                strats.forEach(sId => {
                                    const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                                    if (!hasSub) t.push(sId);
                                });
                                let finalScore = t.length;
                                const eps = epsData[l.stockId] || {};
                                const g = parseFloat(eps.epsGrowth);
                                if (!isNaN(g) && g > 0) finalScore += 1;
                                return finalScore;
                            };
                            valA = getScore(a); valB = getScore(b); break;
                        }
                        default: valA = parseInt(a.id); valB = parseInt(b.id); break;
                    }
                    if (valA < valB) return journalSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return journalSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return result;
            }, [logs, journalFilters, epsData, journalSort]);

            useEffect(() => {
                const handleClickOutside = (event) => {
                    if (copyDropdownRef.current && !copyDropdownRef.current.contains(event.target)) {
                        setIsCopyDropdownOpen(false);
                    }
                };
                document.addEventListener("mousedown", handleClickOutside);
                return () => document.removeEventListener("mousedown", handleClickOutside);
            }, []);

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') { setStockName(''); return; }
                if (stockMap[trimmedVal]) setStockName(stockMap[trimmedVal].name);
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setStockName(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') { setStockId(''); return; }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) setStockId(foundId);
            };

            const isUnknownStock = stockId.trim() && stockName.trim() && !stockMap[stockId.trim()];
            const isForbiddenStock = (stockId.trim() !== '' && forbiddenStocks.some(f => f.id === stockId.trim())) || 
                                     (stockName.trim() !== '' && forbiddenStocks.some(f => stockName.includes(f.name) || f.name === stockName.trim()));

            const stockIdsDatalist = useMemo(() => (
                <datalist id="stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const handleAddLog = () => {
                const sId = stockId.trim();
                const sName = stockName.trim();
                
                if (!sId || !sName) {
                    setAlert({ show: true, msg: '請填寫完整資訊 (股號、名稱)！' });
                    return;
                }

                const executeAdd = () => {
                    if (!stockMap[sId]) {
                        setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                    }

                    const existingLogIndex = logs.findIndex(l => l.date === date && l.stockId === sId);

                    if (existingLogIndex !== -1) {
                        const updatedLogs = [...logs];
                        const existingLog = { ...updatedLogs[existingLogIndex] };
                        
                        let currentStrategies = Array.isArray(existingLog.strategy) ? [...existingLog.strategy] : (existingLog.strategy ? [existingLog.strategy] : []);
                        if (selectedStrategy && !currentStrategies.includes(selectedStrategy)) {
                            currentStrategies.push(selectedStrategy);
                        }
                        existingLog.strategy = currentStrategies;

                        let currentSubTags = existingLog.subTags ? [...existingLog.subTags] : [];
                        selectedSubTags.forEach(tag => {
                            if (!currentSubTags.includes(tag)) {
                                currentSubTags.push(tag);
                            }
                        });
                        existingLog.subTags = currentSubTags;

                        updatedLogs[existingLogIndex] = existingLog;
                        setLogs(updatedLogs);
                    } else {
                        const newLog = {
                            id: Date.now().toString(),
                            date,
                            stockId: sId,
                            name: sName,
                            strategy: selectedStrategy ? [selectedStrategy] : [], 
                            subTags: selectedSubTags,
                            starred: false,
                            plan: { entry: '', stopLoss: '', trailing: '', exit: '', shares: '', warrantCode: '', warrantEntry: '', warrantShares: '', currentPrice: '' }
                        };
                        setLogs([...logs, newLog]);
                    }
                    
                    setStockId('');
                    setStockName('');
                };

                const isForbidden = forbiddenStocks.some(f => f.id === sId || sName.includes(f.name) || f.name === sName);
                if (isForbidden) {
                    setForbiddenAlert({ show: true, stockName: sName, action: executeAdd });
                    return; 
                }

                executeAdd();
            };

            const toggleSubTag = (tag) => {
                if (selectedSubTags.includes(tag)) setSelectedSubTags([]);
                else setSelectedSubTags([tag]);
            };
            
            const handleStrategySelect = (id) => {
                setSelectedStrategy(id);
                setSelectedSubTags([]); 
            };

            const toggleStar = (id) => {
                setLogs(logs.map(log => log.id === id ? { ...log, starred: !log.starred } : log));
            };

            const togglePlan = (id) => {
                const log = logs.find(l => l.id === id);
                if (!log) return;

                const executeToggle = () => {
                    setLogs(logs.map(l => l.id === id ? { ...l, inPlan: !l.inPlan } : l));
                };

                if (!log.inPlan) {
                    const isForbidden = forbiddenStocks.some(f => f.id === log.stockId || log.name.includes(f.name) || f.name === log.name);
                    if (isForbidden) {
                        setForbiddenAlert({ show: true, stockName: log.name, action: executeToggle });
                        return;
                    }
                }
                executeToggle();
            };

            const deleteLog = (id) => {
                setLogs(logs.filter(log => log.id !== id));
            };

            const removeTag = (logId, isSubTag, tagToRemove) => {
                setLogs(logs.map(log => {
                    if (log.id !== logId) return log;
                    
                    const newLog = { ...log };
                    if (isSubTag) {
                        newLog.subTags = (newLog.subTags || []).filter(t => t !== tagToRemove);
                    } else {
                        const strategiesArray = Array.isArray(newLog.strategy) ? newLog.strategy : (newLog.strategy ? [newLog.strategy] : []);
                        newLog.strategy = strategiesArray.filter(s => s !== tagToRemove);
                    }
                    return newLog;
                }));
            };

            const handleEpsImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const rawData = XLSX.utils.sheet_to_json(ws, { header: 1 });
                        
                        let newEps = { ...epsData };
                        let newCustom = { ...customStocks };
                        let addedCustomCount = 0;

                        let headerRowIndex = -1;
                        let colIdx = { code: -1, name: -1, eps25: -1, eps26: -1, growth: -1, futures: -1 };

                        for (let i = 0; i < Math.min(20, rawData.length); i++) {
                            const row = rawData[i];
                            if (!Array.isArray(row)) continue;
                            
                            const code = row.findIndex(c => typeof c === 'string' && (c.includes('代號') || c.includes('股號') || c.includes('代碼')));
                            if (code !== -1) {
                                headerRowIndex = i;
                                colIdx.code = code;
                                colIdx.name = row.findIndex(c => typeof c === 'string' && (c.includes('股名') || c.includes('名稱') || c.includes('公司')));
                                colIdx.eps25 = row.findIndex(c => typeof c === 'string' && (c.includes('2025EPS') || c === '2025' || c.includes('EPS25')));
                                colIdx.eps26 = row.findIndex(c => typeof c === 'string' && (c.includes('2026EPS') || c === '2026' || c.includes('EPS26')));
                                colIdx.growth = row.findIndex(c => typeof c === 'string' && c.includes('成長率'));
                                colIdx.futures = row.findIndex(c => typeof c === 'string' && (c.includes('股期') || c.includes('期貨')));
                                break;
                            }
                        }

                        if (headerRowIndex !== -1) {
                            for (let i = headerRowIndex + 1; i < rawData.length; i++) {
                                const row = rawData[i];
                                if (!row || row[colIdx.code] === undefined) continue;
                                
                                const code = row[colIdx.code];
                                const name = colIdx.name !== -1 ? row[colIdx.name] : '';
                                const eps25 = colIdx.eps25 !== -1 ? row[colIdx.eps25] : undefined;
                                const eps26 = colIdx.eps26 !== -1 ? row[colIdx.eps26] : undefined;
                                const epsGrowth = colIdx.growth !== -1 ? row[colIdx.growth] : undefined;
                                const futures = colIdx.futures !== -1 ? row[colIdx.futures] : undefined;

                                const strCode = String(code).trim();
                                if (strCode === '') continue;

                                let formattedGrowth = '-';
                                if (epsGrowth !== undefined && epsGrowth !== null && String(epsGrowth).trim().toUpperCase() !== 'NAN') {
                                    const numGrowth = parseFloat(epsGrowth);
                                    if (!isNaN(numGrowth)) {
                                        formattedGrowth = Number((numGrowth * 100).toFixed(2)) + '%';
                                    } else {
                                        formattedGrowth = epsGrowth; 
                                    }
                                }

                                const hasFutures = !!futures && String(futures).trim() !== '';

                                newEps[strCode] = { 
                                    eps25: eps25 !== undefined && eps25 !== null && String(eps25).trim() !== '' ? eps25 : '-', 
                                    eps26: eps26 !== undefined && eps26 !== null && String(eps26).trim() !== '' ? eps26 : '-',
                                    epsGrowth: formattedGrowth,
                                    hasFutures: hasFutures
                                };

                                if (!stockMap[strCode] && name) {
                                    newCustom[strCode] = { name: String(name).trim(), industry: "匯入補齊" };
                                    addedCustomCount++;
                                }
                            }
                            setEpsData(newEps);
                            setCustomStocks(newCustom);
                            setAlert({ show: true, msg: `EPS 與股期資料匯入成功！自動補齊了 ${addedCustomCount} 檔未知股票。` });
                        } else {
                            setAlert({ show: true, msg: `找不到「股票代號」欄位，請確認檔案格式！` });
                        }
                    } catch(e) {
                        console.error(e);
                        setAlert({ show: true, msg: `檔案解析失敗，請確認是否為有效的 Excel 檔案。` });
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null;
            };

            const getExportData = (formatType) => {
                let titleName = "多重篩選漏斗";
                if (formatType === 'score-futures') titleName = "個股期篩選漏斗";
                else if (formatType === 'growth') titleName = "EPS成長率排行";

                const sDate = getTodayLocal();
                const eDate = getTodayLocal();
                const dateRangeStr = sDate;

                let targetLogs = logs.filter(l => l.date >= sDate && l.date <= eDate);
                if (copySubTags.length > 0) {
                    targetLogs = targetLogs.filter(l => {
                        return l.subTags && l.subTags.some(t => copySubTags.includes(t));
                    });
                }

                if (targetLogs.length === 0) {
                    setAlert({ show: true, msg: `今日 ${dateRangeStr} ${copySubTags.length > 0 ? '符合所選標籤' : ''}無選股紀錄！` });
                    return null;
                }

                let processedLogs = targetLogs.map(l => {
                    let allTags = [];
                    if (l.subTags && l.subTags.length > 0) allTags.push(...l.subTags);
                    const strategiesArray = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                    strategiesArray.forEach(sId => {
                        const s = STRATEGIES.find(str => str.id === sId);
                        if (s) {
                            const hasSubTag = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                            if (!hasSubTag) allTags.push(s.label);
                        }
                    });

                    let baseScore = allTags.length;
                    let displayTags = allTags;
                    if (copySubTags.length > 0) {
                        displayTags = allTags.filter(t => copySubTags.includes(t));
                    }
                    
                    const eps = epsData[l.stockId] || {};
                    const rawGrowth = eps.epsGrowth;
                    const numGrowth = parseFloat(rawGrowth);
                    const validGrowth = !isNaN(numGrowth) ? numGrowth : -999999;
                    const displayGrowth = rawGrowth || '-';

                    if (validGrowth > 0) {
                        baseScore += 1;
                    }

                    return { ...l, allTags, displayTags, score: baseScore, validGrowth, displayGrowth };
                });

                let strategyGroups = [];
                let sortedLogs = [...processedLogs];

                if (formatType === 'time') {
                    sortedLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'score') {
                    sortedLogs.sort((a, b) => b.score - a.score || parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'score-futures') {
                    sortedLogs = sortedLogs.filter(l => epsData[l.stockId]?.hasFutures);
                    if (sortedLogs.length === 0) {
                        setAlert({ show: true, msg: `找不到今日 ${dateRangeStr} 符合條件且具備「股期」的選股紀錄！` });
                        return null;
                    }
                    sortedLogs.sort((a, b) => b.score - a.score || parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'growth') {
                    sortedLogs.sort((a, b) => b.validGrowth - a.validGrowth || parseInt(a.id) - parseInt(b.id));
                } else if (formatType === 'strategy') {
                    const strategyOrder = ['破繭而出', '披荊斬棘', '月來越好', '季不可失', '量價齊揚', 'OBV突破'];
                    
                    const groupMap = {};
                    processedLogs.forEach(l => {
                        let tagsToGroup = l.displayTags;
                        if (tagsToGroup.length === 0) tagsToGroup = ['未分類'];

                        tagsToGroup.forEach(tag => {
                            if (!groupMap[tag]) groupMap[tag] = [];
                            if (!groupMap[tag].includes(l)) groupMap[tag].push(l);
                        });
                    });

                    strategyOrder.forEach(label => {
                        if (groupMap[label] && groupMap[label].length > 0) {
                            let tagLogs = groupMap[label];
                            tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            strategyGroups.push({ label: label, logs: tagLogs });
                            delete groupMap[label];
                        }
                    });

                    STRATEGIES.forEach(strat => {
                        if (groupMap[strat.label] && groupMap[strat.label].length > 0) {
                            let tagLogs = groupMap[strat.label];
                            tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            strategyGroups.push({ label: strat.label, logs: tagLogs });
                            delete groupMap[strat.label];
                        }
                        const subTags = SUB_TAGS[strat.id] || [];
                        subTags.forEach(tag => {
                            if (groupMap[tag] && groupMap[tag].length > 0) {
                                let tagLogs = groupMap[tag];
                                tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                                strategyGroups.push({ label: tag, logs: tagLogs });
                                delete groupMap[tag];
                            }
                        });
                    });

                    Object.keys(groupMap).forEach(label => {
                         if (groupMap[label] && groupMap[label].length > 0) {
                            let tagLogs = groupMap[label];
                            tagLogs.sort((a, b) => parseInt(a.id) - parseInt(b.id));
                            strategyGroups.push({ label: label, logs: tagLogs });
                        }
                    });
                }

                return { titleName, dateRangeStr, sortedLogs, strategyGroups };
            };

            const copyLogs = (formatType) => {
                const data = getExportData(formatType);
                if (!data) return;

                let resultText = `| ${data.dateRangeStr} ${data.titleName} |\n`;
                const now = new Date();
                const timeString = now.toLocaleTimeString('zh-TW', { hour12: false });
                resultText += `產出時間：${data.dateRangeStr} ${timeString}\n`;
                
                if (copySubTags.length > 0) {
                    resultText += `🎯 指定篩選：${copySubTags.join(', ')}\n`;
                }
                resultText += `\n`;
                
                let detailText = ``;

                if (formatType === 'strategy') {
                    data.strategyGroups.forEach(grp => {
                        detailText += `🎯 [${grp.label}] (共 ${grp.logs.length} 檔)\n`;
                        grp.logs.forEach(l => {
                            detailText += `  - ${l.stockId} ${l.name}\n`;
                        });
                        detailText += `\n`;
                    });
                } else {
                    data.sortedLogs.forEach(l => {
                        const countStr = l.score > 0 ? ` (${l.score}分)` : '';
                        const tagStr = l.displayTags.length > 0 ? ` (${l.displayTags.join('、')})` : '';
                        if (formatType === 'growth') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}\n`;
                        } else if (formatType === 'score' || formatType === 'score-futures') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}${countStr}${tagStr}\n`;
                        } else {
                            detailText += `- ${l.stockId} ${l.name}${countStr}${tagStr}\n`;
                        }
                    });
                }

                resultText += detailText;
                resultText += `-------------------\n⚠️ 停損是紀律，停利是藝術。\n⚠️ 位階決定勝率，部位決定存活。`;
                
                fallbackCopyTextToClipboard(resultText);
                setCopySuccess(formatType);
                setTimeout(() => setCopySuccess(null), 2000); 
            };

            return (
                <div className="animate-fade-in-up space-y-6">
                    {/* 控制區塊 - 手機版表單排版修正 */}
                    <div className="glass-card p-4 md:p-6 rounded-3xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-64 h-64 bg-blue-500/5 rounded-full blur-[60px] -z-10 pointer-events-none"></div>
                        <h2 className="text-xl md:text-2xl font-title text-blue-400 mb-6 flex items-center gap-3 drop-shadow-md">
                            <div className="p-2 bg-blue-500/10 rounded-xl"><FileText size={22} /></div>
                            新增選股日誌
                        </h2>
                        
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5 mb-8 relative z-10">
                            <div className="col-span-1">
                                <label className="block text-[11px] md:text-sm font-medium text-slate-400 mb-1.5 ml-1">記錄日期</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full input-styled rounded-xl p-2 md:p-3 text-xs md:text-sm font-mono-num text-slate-200" />
                            </div>
                            <div className="col-span-1 relative">
                                <label className="block text-[11px] md:text-sm font-medium text-slate-400 mb-1.5 ml-1">股票代號</label>
                                <input 
                                    type="text" 
                                    list="stock-ids-list"
                                    value={stockId} 
                                    onChange={handleStockIdChange} 
                                    onKeyDown={e => { if (e.key === 'Enter') handleAddLog(); }}
                                    placeholder="例: 2330" 
                                    className={`w-full input-styled rounded-xl p-2 md:p-3 text-xs md:text-sm font-mono-num ${isForbiddenStock ? 'border-red-500 text-red-400 bg-red-900/10' : 'text-slate-200'}`} 
                                />
                            </div>
                            <div className="col-span-2 relative mt-1 md:mt-0">
                                <label className="block text-[11px] md:text-sm font-medium text-slate-400 mb-1.5 ml-1">對應股票名稱 (支援反查)</label>
                                <div className="relative w-full h-auto">
                                    <input 
                                        type="text" 
                                        list="stock-names-list"
                                        value={stockName} 
                                        onChange={handleStockNameChange}
                                        onKeyDown={e => { if (e.key === 'Enter') handleAddLog(); }}
                                        placeholder="輸入名稱自動帶入..." 
                                        className={`w-full input-styled rounded-xl p-2 md:p-3 text-xs md:text-sm ${isForbiddenStock ? 'border-red-500 text-red-400 bg-red-900/10' : (isUnknownStock ? 'border-amber-500/50 text-slate-200' : 'text-emerald-400 font-medium tracking-wide')}`} 
                                    />
                                    {isUnknownStock && !isForbiddenStock && stockName && (
                                        <span className="hidden sm:inline-block absolute right-2 top-1/2 -translate-y-1/2 text-[10px] md:text-xs text-amber-400 bg-amber-400/10 px-2 py-1 rounded-md font-medium">✨ 自動記憶</span>
                                    )}
                                    {isForbiddenStock && (
                                        <span className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] md:text-xs text-red-200 bg-red-600 px-2 py-1 md:px-3 rounded-md font-bold shadow-[0_0_10px_rgba(220,38,38,0.5)] animate-pulse whitespace-nowrap">嚴禁買入</span>
                                    )}
                                </div>
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                            </div>
                        </div>

                        {/* 策略按鈕區塊 - 視覺升級 */}
                        <div className="mb-8 relative z-10">
                            <label className="block text-sm font-medium text-slate-400 mb-3 ml-1 flex items-center gap-2">
                                <Filter size={16} className="text-slate-500" />
                                主力策略模組 (選填)
                            </label>
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 md:gap-3">
                                {STRATEGIES.map(s => (
                                    <button 
                                        key={s.id}
                                        onClick={() => handleStrategySelect(s.id)}
                                        className={`flex items-center justify-center gap-1 md:gap-2 p-2.5 md:p-3 rounded-xl border transition-all duration-300 ${selectedStrategy === s.id ? `bg-gradient-to-r ${s.color} border-transparent text-white shadow-lg transform scale-[1.02]` : 'bg-slate-800/40 border-slate-700/60 text-slate-400 hover:bg-slate-800 hover:border-slate-500 hover:text-slate-200'}`}
                                    >
                                        <s.icon size={16} className={selectedStrategy === s.id ? "opacity-100" : "opacity-70"} />
                                        <span className="font-bold tracking-wide text-sm">{s.label}</span>
                                    </button>
                                ))}
                            </div>
                            
                            {selectedStrategy && SUB_TAGS[selectedStrategy] && (
                                <div className="mt-4 p-4 md:p-5 bg-slate-900/60 rounded-2xl border border-slate-700/50 animate-fade-in-down shadow-inner">
                                    <div className="flex justify-between items-center mb-3">
                                        <label className="block text-[10px] md:text-xs font-bold tracking-widest text-slate-500 uppercase">進階技術/籌碼特徵 (單選)</label>
                                        {selectedSubTags.length > 0 && (
                                            <button onClick={() => setSelectedSubTags([])} className="text-[10px] md:text-[11px] font-bold text-slate-400 hover:text-white transition bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg flex items-center gap-1 shrink-0">
                                                <X size={12} /> 清空
                                            </button>
                                        )}
                                    </div>
                                    <div className="flex flex-wrap gap-2">
                                        {SUB_TAGS[selectedStrategy].map(tag => {
                                            const isSelected = selectedSubTags.includes(tag);
                                            const bgGradient = SUB_TAG_COLORS[tag] || 'from-blue-600 to-indigo-600';
                                            return (
                                                <button
                                                    key={tag}
                                                    onClick={() => toggleSubTag(tag)}
                                                    className={`px-3 py-1.5 rounded-xl text-xs font-bold tracking-wide transition-all duration-300 border ${
                                                        isSelected 
                                                            ? `bg-gradient-to-r ${bgGradient} text-white border-transparent shadow-[0_0_12px_rgba(255,255,255,0.15)] transform scale-105` 
                                                            : 'bg-slate-800/80 border-slate-700 text-slate-400 hover:border-slate-500 hover:text-slate-200'
                                                    }`}
                                                >
                                                    {tag}
                                                </button>
                                            )
                                        })}
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* 底部操作列 - 響應式優化 */}
                        <div className="flex flex-col xl:flex-row justify-between items-center border-t border-slate-800/80 pt-6 gap-4 relative z-10">
                            <div className="flex flex-col md:flex-row items-center gap-3 w-full xl:w-auto">
                                <label className="w-full md:w-auto cursor-pointer bg-slate-800 hover:bg-slate-700 text-sm font-medium text-slate-200 px-4 py-2.5 rounded-xl flex items-center justify-center gap-2 transition border border-slate-700/50 shadow-sm shrink-0">
                                    <Upload size={16} className="text-blue-400" />
                                    <span>更新 EPS / 股期</span>
                                    <input type="file" accept=".csv, .xlsx, .xls" onChange={handleEpsImport} className="hidden" />
                                </label>

                                <div className="flex flex-col xl:flex-row items-center gap-2 bg-slate-800/80 rounded-xl p-2 relative w-full xl:w-auto md:ml-2" ref={copyDropdownRef}>
                                    <button 
                                        onClick={() => setIsCopyDropdownOpen(!isCopyDropdownOpen)}
                                        className={`w-full xl:w-auto bg-slate-900 border ${copySubTags.length > 0 ? 'border-blue-500/50 text-blue-400' : 'border-slate-700 text-slate-300'} rounded-lg px-4 py-2 text-sm font-medium outline-none flex items-center justify-center gap-2 transition-colors shrink-0`}
                                    >
                                        <Filter size={14} />
                                        {copySubTags.length === 0 ? '全部標籤匯出' : `已篩選 ${copySubTags.length} 項`}
                                        <span className="text-[10px] opacity-70">▼</span>
                                    </button>

                                    {isCopyDropdownOpen && (
                                        <div className="absolute bottom-full left-0 mb-2 w-full xl:w-80 bg-slate-800 border border-slate-600 rounded-2xl shadow-[0_10px_40px_rgba(0,0,0,0.5)] p-5 z-50 flex flex-col gap-4 max-h-[400px] overflow-y-auto animate-fade-in-up custom-scrollbar">
                                            <div className="flex justify-between items-center border-b border-slate-700 pb-3">
                                                <span className="text-sm font-bold text-slate-200">自訂匯出標籤</span>
                                                <button onClick={() => setCopySubTags([])} className="text-xs font-bold text-blue-400 hover:text-blue-300 bg-blue-500/10 hover:bg-blue-500/20 px-3 py-1.5 rounded-lg transition">清除篩選</button>
                                            </div>
                                            {STRATEGIES.map(strat => {
                                                const tags = SUB_TAGS[strat.id] || [];
                                                if(tags.length === 0) return null;
                                                return (
                                                    <div key={strat.id} className="mb-2">
                                                        <div className="text-xs font-bold tracking-widest text-slate-500 mb-2.5 flex items-center gap-1.5 uppercase">
                                                            <strat.icon size={12} className="opacity-70" /> {strat.label}
                                                        </div>
                                                        <div className="flex flex-wrap gap-1.5">
                                                            {tags.map(tag => {
                                                                const isSelected = copySubTags.includes(tag);
                                                                const bgGradient = SUB_TAG_COLORS[tag] || 'from-blue-600 to-indigo-600';
                                                                return (
                                                                    <button
                                                                        key={tag}
                                                                        onClick={() => {
                                                                            if (isSelected) setCopySubTags(copySubTags.filter(t => t !== tag));
                                                                            else setCopySubTags([...copySubTags, tag]);
                                                                        }}
                                                                        className={`px-2.5 py-1 rounded-lg text-[11px] font-bold transition-all border ${
                                                                            isSelected 
                                                                                ? `bg-gradient-to-r ${bgGradient} text-white border-transparent shadow-sm` 
                                                                                : 'bg-slate-900 border-slate-700/80 text-slate-400 hover:border-slate-500 hover:text-slate-200'
                                                                        }`}
                                                                    >
                                                                        {tag}
                                                                    </button>
                                                                )
                                                            })}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}

                                    <div className="flex flex-wrap justify-center items-center gap-2 xl:border-l border-slate-700/50 xl:pl-4 w-full xl:w-auto mt-2 xl:mt-0 shrink-0">
                                        <button onClick={() => copyLogs('time')} className={`text-xs md:text-sm text-white flex items-center justify-center w-full sm:w-auto gap-1.5 transition px-3 py-2 rounded-lg font-medium shadow-sm ${copySuccess === 'time' ? 'bg-green-600 shadow-[0_0_10px_rgba(22,163,74,0.3)]' : 'hover:bg-slate-700'}`} title="今日純文字：依輸入時間順序">
                                            {copySuccess === 'time' ? <CheckCircle size={14} /> : <ClipboardCopy size={14} className="text-blue-400" />} <span>依時間</span>
                                        </button>
                                        <button onClick={() => copyLogs('strategy')} className={`text-xs md:text-sm text-white flex items-center justify-center w-full sm:w-auto gap-1.5 transition px-3 py-2 rounded-lg font-medium shadow-sm ${copySuccess === 'strategy' ? 'bg-green-600 shadow-[0_0_10px_rgba(22,163,74,0.3)]' : 'hover:bg-slate-700'}`} title="今日純文字：依策略群組排序">
                                            {copySuccess === 'strategy' ? <CheckCircle size={14} /> : <ClipboardCopy size={14} className="text-indigo-400" />} <span>依策略</span>
                                        </button>
                                        <button onClick={() => copyLogs('score')} className={`text-xs md:text-sm text-white flex items-center justify-center w-full sm:w-auto gap-1.5 transition px-3 py-2 rounded-lg font-medium shadow-sm ${copySuccess === 'score' ? 'bg-green-600 shadow-[0_0_10px_rgba(22,163,74,0.3)]' : 'hover:bg-slate-700'}`} title="今日純文字：依標籤分數高低">
                                            {copySuccess === 'score' ? <CheckCircle size={14} /> : <Star size={14} className="text-rose-400" />} <span>依分數</span>
                                        </button>
                                        <button onClick={() => copyLogs('score-futures')} className={`text-xs md:text-sm text-white flex items-center justify-center w-full sm:w-auto gap-1.5 transition px-3 py-2 rounded-lg font-medium shadow-sm ${copySuccess === 'score-futures' ? 'bg-green-600 shadow-[0_0_10px_rgba(22,163,74,0.3)]' : 'hover:bg-slate-700'}`} title="今日純文字：僅有股期且依分數排序">
                                            {copySuccess === 'score-futures' ? <CheckCircle size={14} /> : <Star size={14} className="text-fuchsia-400" />} <span>股期+分數</span>
                                        </button>
                                        <button onClick={() => copyLogs('growth')} className={`text-xs md:text-sm text-white flex items-center justify-center w-full sm:w-auto gap-1.5 transition px-3 py-2 rounded-lg font-medium shadow-sm ${copySuccess === 'growth' ? 'bg-green-600 shadow-[0_0_10px_rgba(22,163,74,0.3)]' : 'hover:bg-slate-700'}`} title="今日純文字：依 EPS 成長率高低">
                                            {copySuccess === 'growth' ? <CheckCircle size={14} /> : <TrendingUp size={14} className="text-teal-400" />} <span>依成長率</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <button onClick={handleAddLog} className="w-full xl:w-auto bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white px-8 py-3.5 rounded-xl font-bold tracking-wider flex items-center justify-center gap-2 shadow-[0_4px_15px_rgba(59,130,246,0.3)] transition-all transform hover:-translate-y-0.5 focus:ring-4 focus:ring-blue-500/30 outline-none shrink-0 mt-4 xl:mt-0">
                                <PlusCircle size={20} /> 正式寫入日誌
                            </button>
                        </div>
                    </div>

                    {/* 資料表格 - 優化視覺層次 */}
                    <div className="glass-card rounded-3xl overflow-hidden shadow-lg">
                        <div className="overflow-x-auto custom-scrollbar pb-2">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                                <thead>
                                    <tr className="bg-slate-900/80 text-slate-400 text-sm tracking-wider border-b border-slate-700">
                                        <th className="p-4 font-bold align-top min-w-[120px] whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handleJournalSort('date')}>日期 <SortIcon sortKey="date" currentSort={journalSort} /></div>
                                            <input type="date" value={journalFilters.date} onChange={e => setJournalFilters({...journalFilters, date: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs font-mono-num outline-none focus:border-blue-500 transition" />
                                        </th>
                                        <th className="p-4 font-bold align-top min-w-[150px]">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handleJournalSort('stock')}>代號 / 名稱 <SortIcon sortKey="stock" currentSort={journalSort} /></div>
                                            <div className="flex flex-col gap-2">
                                                <div className="relative">
                                                    <Search size={12} className="absolute left-2 top-2 text-slate-500" />
                                                    <input type="text" placeholder="搜尋標的..." value={journalFilters.stock} onChange={e => setJournalFilters({...journalFilters, stock: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg pl-7 pr-2 py-1.5 text-xs outline-none focus:border-blue-500 transition" />
                                                </div>
                                                <select value={journalFilters.futures} onChange={e => setJournalFilters({...journalFilters, futures: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-blue-500 transition text-slate-300">
                                                    <option value="all">不限屬性</option>
                                                    <option value="yes">📌 僅顯示有股期</option>
                                                </select>
                                            </div>
                                        </th>
                                        <th className="p-4 font-bold font-mono-num align-top min-w-[90px] whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handleJournalSort('eps25')}>25' EPS <SortIcon sortKey="eps25" currentSort={journalSort} /></div>
                                        </th>
                                        <th className="p-4 font-bold font-mono-num align-top min-w-[90px] whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handleJournalSort('eps26')}>26' EPS(預) <SortIcon sortKey="eps26" currentSort={journalSort} /></div>
                                        </th>
                                        <th className="p-4 font-bold font-mono-num align-top whitespace-nowrap min-w-[120px]">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handleJournalSort('growth')}>EPS 成長率 <SortIcon sortKey="growth" currentSort={journalSort} /></div>
                                            <select value={journalFilters.growth} onChange={e => setJournalFilters({...journalFilters, growth: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-blue-500 transition text-slate-300">
                                                <option value="all">不限</option>
                                                <option value="positive">📈 &gt; 0% (正成長)</option>
                                                <option value="negative">📉 &lt; 0% (衰退)</option>
                                            </select>
                                        </th>
                                        <th className="p-4 font-bold align-top min-w-[180px]">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handleJournalSort('tags')}>策略特徵標籤 <SortIcon sortKey="tags" currentSort={journalSort} /></div>
                                            <div className="flex flex-col gap-2">
                                                <select value={journalFilters.tag} onChange={e => setJournalFilters({...journalFilters, tag: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-blue-500 transition text-slate-300">
                                                    <option value="">全部標籤</option>
                                                    {STRATEGIES.map(s => (
                                                        <optgroup key={s.id} label={s.label}>
                                                            <option value={s.label}>{s.label} (主策略)</option>
                                                            {(SUB_TAGS[s.id] || []).map(t => (
                                                                <option key={t} value={t}>{t}</option>
                                                            ))}
                                                        </optgroup>
                                                    ))}
                                                </select>
                                                <select value={journalFilters.tagCount} onChange={e => setJournalFilters({...journalFilters, tagCount: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-blue-500 transition text-slate-300">
                                                    <option value="all">不限條件數</option>
                                                    <option value="1">至少 1 項條件</option>
                                                    <option value="2">至少 2 項條件</option>
                                                    <option value="3">至少 3 項條件</option>
                                                    <option value="4+">4 項(含)以上</option>
                                                </select>
                                            </div>
                                        </th>
                                        <th className="p-4 font-bold text-center align-top min-w-[150px]">
                                            <div className="mb-3">操作</div>
                                            <button onClick={() => { setJournalFilters({date: getTodayLocal(), stock: '', futures: 'all', growth: 'all', tag: '', tagCount: 'all'}); setJournalSort({key: 'id', direction: 'desc'}); }} className="text-xs font-bold text-slate-500 hover:text-blue-400 bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg transition border border-slate-700/50 w-full">清除所有篩選</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60">
                                    {filteredJournalLogs.map(log => {
                                        const eps = epsData[log.stockId] || { eps25: '-', eps26: '-', epsGrowth: '-', hasFutures: false };
                                        const hasFutures = eps.hasFutures;

                                        return (
                                            <tr key={log.id} className={`table-row-hover group ${hasFutures ? 'bg-fuchsia-900/5 hover:bg-fuchsia-900/10' : ''}`}>
                                                <td className="p-4 font-mono-num text-slate-300 text-sm whitespace-nowrap">{log.date}</td>
                                                <td className="p-4">
                                                    <div className="flex items-center flex-wrap gap-y-1">
                                                        <FuturesBadge hasFutures={hasFutures} />
                                                        <span className="font-mono-num font-black text-lg text-slate-200 mr-2 tracking-wide">{log.stockId}</span>
                                                        <span className="text-blue-300 font-bold text-base whitespace-nowrap">{log.name}</span>
                                                    </div>
                                                </td>
                                                <td className={`p-4 font-mono-num font-bold text-base ${getTwStockColor(eps.eps25)}`}>{eps.eps25}</td>
                                                <td className={`p-4 font-mono-num font-bold text-base ${getTwStockColor(eps.eps26)}`}>{eps.eps26}</td>
                                                <td className="p-4">
                                                    <span className={`font-mono-num font-black text-lg px-2 py-0.5 rounded-md ${eps.epsGrowth && parseFloat(eps.epsGrowth) > 0 ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : (eps.epsGrowth && parseFloat(eps.epsGrowth) < 0 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400')}`}>
                                                        {eps.epsGrowth || '-'}
                                                    </span>
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap gap-1.5 items-center">
                                                        {log.subTags && log.subTags.length > 0 && (
                                                            log.subTags.map(t => {
                                                                const stratForTag = STRATEGIES.find(s => SUB_TAGS[s.id]?.includes(t));
                                                                return (
                                                                    <span 
                                                                        key={t} 
                                                                        onClick={() => removeTag(log.id, true, t)}
                                                                        className={`group/tag cursor-pointer inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold tracking-wide bg-gradient-to-r ${SUB_TAG_COLORS[t] || stratForTag?.color || 'from-slate-600 to-slate-700'} text-white shadow-sm hover:shadow-md transition-all relative overflow-hidden`}
                                                                        title="點擊移除標籤"
                                                                    >
                                                                        <span className="relative z-10 group-hover/tag:mr-4 transition-all whitespace-nowrap">{t}</span>
                                                                        <X size={12} className="absolute right-2 opacity-0 group-hover/tag:opacity-100 transition-opacity z-10 font-black" />
                                                                        <div className="absolute inset-0 bg-black/20 opacity-0 group-hover/tag:opacity-100 transition-opacity"></div>
                                                                    </span>
                                                                );
                                                            })
                                                        )}
                                                        {(() => {
                                                            const strategiesArray = Array.isArray(log.strategy) ? log.strategy : (log.strategy ? [log.strategy] : []);
                                                            return strategiesArray.map(stratId => {
                                                                const s = STRATEGIES.find(str => str.id === stratId);
                                                                if (!s) return null;
                                                                const hasSubTag = log.subTags?.some(tag => SUB_TAGS[stratId]?.includes(tag));
                                                                if (log.subTags && log.subTags.length > 0 && hasSubTag) return null;
                                                                return (
                                                                    <span 
                                                                        key={s.id} 
                                                                        onClick={() => removeTag(log.id, false, s.id)}
                                                                        className={`group/tag cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-bold tracking-wide bg-gradient-to-r ${s.color} text-white shadow-sm hover:shadow-md transition-all relative overflow-hidden opacity-90`}
                                                                        title="點擊移除主策略"
                                                                    >
                                                                        <span className="relative z-10 flex items-center gap-1 group-hover/tag:mr-4 transition-all whitespace-nowrap">{s.emoji} {s.label}</span>
                                                                        <X size={12} className="absolute right-2 opacity-0 group-hover/tag:opacity-100 transition-opacity z-10 font-black" />
                                                                        <div className="absolute inset-0 bg-black/20 opacity-0 group-hover/tag:opacity-100 transition-opacity"></div>
                                                                    </span>
                                                                );
                                                            });
                                                        })()}
                                                        {(!log.subTags || log.subTags.length === 0) && (!log.strategy || log.strategy.length === 0) && (
                                                            <span className="text-xs text-slate-600 italic">無標籤</span>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex justify-center items-center gap-1.5 flex-wrap">
                                                        <button onClick={() => onAiDiagnose(log)} className="p-2 rounded-xl bg-purple-500/10 text-purple-400 hover:bg-purple-500 hover:text-white transition-all group/btn shadow-[0_0_10px_rgba(168,85,247,0)] hover:shadow-[0_0_15px_rgba(168,85,247,0.5)]" title="✨ AI 個股診斷">
                                                            <Sparkles size={18} className="group-hover/btn:animate-pulse" />
                                                        </button>
                                                        <div className="w-[1px] h-6 bg-slate-700/50 mx-1 hidden sm:block"></div>
