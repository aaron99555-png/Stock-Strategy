                                                        <button onClick={() => togglePlan(log.id)} className={`p-2 rounded-xl transition-all ${log.inPlan ? 'bg-blue-500/20 text-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.3)] border border-blue-500/30' : 'bg-slate-800 text-slate-400 hover:bg-blue-500/10 hover:text-blue-400 border border-transparent'}`} title={log.inPlan ? '移出規劃清單' : '加入規劃清單'}>
                                                            <Target size={18} />
                                                        </button>
                                                        <button onClick={() => toggleStar(log.id)} className={`p-2 rounded-xl transition-all ${log.starred ? 'bg-amber-500/20 text-amber-400 shadow-[0_0_10px_rgba(245,158,11,0.3)] border border-amber-500/30' : 'bg-slate-800 text-slate-400 hover:bg-amber-500/10 hover:text-amber-400 border border-transparent'}`} title={log.starred ? '取消追蹤' : '加入追蹤'}>
                                                            <Star fill={log.starred ? "currentColor" : "none"} size={18} />
                                                        </button>
                                                        <button onClick={() => setConfirm({ show: true, action: () => deleteLog(log.id) })} className="p-2 rounded-xl bg-slate-800 text-slate-500 hover:bg-red-500/10 hover:text-red-400 transition-colors" title="刪除紀錄">
                                                            <Trash2 size={18} />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {logs.length === 0 && (
                                        <tr><td colSpan="7" className="p-16 text-center">
                                            <div className="inline-flex flex-col items-center justify-center text-slate-500">
                                                <FileText size={48} className="mb-4 opacity-50" />
                                                <p className="text-lg font-medium">目前尚無選股紀錄</p>
                                                <p className="text-sm mt-1 opacity-70">請從上方控制區塊新增您的第一筆觀察標的</p>
                                            </div>
                                        </td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <AlertModal isOpen={alert.show} message={alert.msg} onClose={() => setAlert({ show: false, msg: '' })} />
                    <ConfirmModal isOpen={confirm.show} title="確認刪除" message="您確定要徹底刪除這筆選股紀錄嗎？此動作無法復原。" 
                        onConfirm={() => { confirm.action(); setConfirm({ show: false, action: null }); }} 
                        onCancel={() => setConfirm({ show: false, action: null })} />
                    
                    {/* 防呆大視窗 */}
                    <ForbiddenModal 
                        isOpen={forbiddenAlert.show} 
                        stockName={forbiddenAlert.stockName}
                        onConfirm={() => {
                            if (forbiddenAlert.action) forbiddenAlert.action();
                            setForbiddenAlert({ show: false, stockName: '', action: null });
                        }}
                        onCancel={() => setForbiddenAlert({ show: false, stockName: '', action: null })}
                    />
                </div>
            );
        };

        // ==========================================
        // 4. 模組二：大盤支撐壓力計算機 (Calculator)
        // ==========================================
        const CalculatorModule = ({ calcHistory, setCalcHistory, stockMap, setCustomStocks, epsData }) => {
            const [session, setSession] = useState('日盤');
            const [h, setH] = useState('');
            const [l, setL] = useState('');
            const [c, setC] = useState('');
            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState(''); 
            const [results, setResults] = useState(null);
            const [expandedRowId, setExpandedRowId] = useState(null);

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockName('');
                    return;
                }
                if (stockMap[trimmedVal]) {
                    setStockName(stockMap[trimmedVal].name);
                }
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setStockName(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setStockId('');
                    return;
                }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) {
                    setStockId(foundId);
                }
            };

            const stockIdsDatalist = useMemo(() => (
                <datalist id="calc-stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="calc-stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const calculate = () => {
                const H = parseFloat(h);
                const L = parseFloat(l);
                const C = parseFloat(c);
                if (isNaN(H) || isNaN(L) || isNaN(C)) return;

                const sId = stockId.trim();
                const sName = stockName.trim();
                if (sId && sName && !stockMap[sId] && setCustomStocks) {
                    setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                }

                const Range = H - L;
                
                const cdpVal = (H + L + 2 * C) / 4;
                const cdp = {
                    AH: (cdpVal + Range).toFixed(2),
                    NH: (2 * cdpVal - L).toFixed(2),
                    CDP: cdpVal.toFixed(2),
                    NL: (2 * cdpVal - H).toFixed(2),
                    AL: (cdpVal - Range).toFixed(2)
                };

                const pVal = (H + L + C) / 3;
                const pivot = {
                    R2: (pVal + Range).toFixed(2),
                    R1: (2 * pVal - L).toFixed(2),
                    P: pVal.toFixed(2),
                    S1: (2 * pVal - H).toFixed(2),
                    S2: (pVal - Range).toFixed(2)
                };

                const fibo = {
                    R3: (pVal + Range * 1.0).toFixed(2),
                    R2: (pVal + Range * 0.618).toFixed(2),
                    R1: (pVal + Range * 0.382).toFixed(2),
                    P: pVal.toFixed(2),
                    S1: (pVal - Range * 0.382).toFixed(2),
                    S2: (pVal - Range * 0.618).toFixed(2),
                    S3: (pVal - Range * 1.0).toFixed(2)
                };

                setResults({ cdp, pivot, fibo });
            };

            const saveHistory = () => {
                if (!results) return;
                const sId = stockId.trim();
                const sName = stockName.trim();
                const finalName = sName || stockMap[sId]?.name || '';
                
                const newRecord = {
                    id: Date.now().toString(),
                    date: getTodayLocal(),
                    session,
                    stockId: sId,
                    name: finalName,
                    inputs: { h, l, c },
                    results
                };
                if (formatType === 'strategy') {
                    data.strategyGroups.forEach(grp => {
                        detailText += `🎯 [${grp.label}] (共 ${grp.logs.length} 檔)\n`;
                        grp.logs.forEach(l => {
                            detailText += `  - ${l.stockId} ${l.name}\n`;
                        });
                        detailText += `\n`;
                    });
                } else {
                    data.sortedLogs.forEach(l => {
                        const countStr = l.score > 0 ? ` (${l.score}分)` : '';
                        const tagStr = l.displayTags.length > 0 ? ` (${l.displayTags.join('、')})` : '';
                        if (formatType === 'growth') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}\n`;
                        } else if (formatType === 'score' || formatType === 'score-futures') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}${countStr}${tagStr}\n`;
                        } else {
                            detailText += `- ${l.stockId} ${l.name}${countStr}${tagStr}\n`;
                        }
                    });
                }

                resultText += detailText;
                resultText += `-------------------\n⚠️ 停損是紀律，停利是藝術。\n⚠️ 位階決定勝率，部位決定存活。`;
                
                fallbackCopyTextToClipboard(resultText);
                setCopySuccess(formatType);
                setTimeout(() => setCopySuccess(null), 2000); 
            };

            return (
                <div className="animate-fade-in-up space-y-8">
                    {/* Dashboard 頂部區塊 */}
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-2 gap-4">
                        <h2 className="text-2xl md:text-3xl font-title text-emerald-400 flex items-center gap-3 drop-shadow-md">
                            <div className="p-2 bg-emerald-500/10 rounded-xl"><LayoutDashboard size={24} className="md:w-7 md:h-7" /></div>
                            交易績效儀表板
                        </h2>
                        <div className="bg-slate-900/80 border border-slate-700/80 p-1.5 rounded-xl flex items-center shadow-inner w-full md:w-auto">
                            <select value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="w-full bg-transparent border-none rounded-lg px-3 py-1.5 text-sm font-bold outline-none text-slate-300 focus:ring-0 cursor-pointer">
                                <option value="all">📊 檢視全部歷史紀錄</option>
                                <option value="month">📅 僅檢視近一個月</option>
                            </select>
                        </div>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5">
                        <StatCard title="總發動交易" value={stats.totalTrades} unit="筆" color="blue" />
                        <StatCard title="已平倉結算" value={stats.closedTrades} unit="筆" color="indigo" />
                        <StatCard title="整體勝率" value={stats.winRate} unit="%" color="emerald" />
                        <StatCard title="累積總淨利" value={stats.totalProfit.toLocaleString()} unit="TWD" color="amber" />
                    </div>

                    {/* 新增規劃標的區塊 */}
                    <div className="glass-card p-4 md:p-6 rounded-3xl relative overflow-hidden mt-8">
                        <div className="absolute top-0 left-0 w-64 h-64 bg-emerald-500/5 rounded-full blur-[60px] -z-10 pointer-events-none"></div>
                        <h3 className="text-lg md:text-xl font-bold text-slate-200 mb-5 md:mb-6 flex items-center gap-2">
                            <Target size={20} className="text-emerald-400 md:w-6 md:h-6" /> 快速建立交易計畫
                        </h3>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5 relative z-10">
                            <div className="col-span-1">
                                <label className="block text-[11px] md:text-sm font-medium text-slate-400 mb-1.5 ml-1">規劃日期</label>
                                <input type="date" value={planDate} onChange={e => setPlanDate(e.target.value)} className="w-full input-styled rounded-xl p-2 md:p-3 text-xs md:text-sm font-mono-num text-slate-200" />
                            </div>
                            <div className="col-span-1 relative">
                                <label className="block text-[11px] md:text-sm font-medium text-slate-400 mb-1.5 ml-1">股票代號</label>
                                <input type="text" list="plan-stock-ids-list" value={planStockId} onChange={handleStockIdChange} onKeyDown={e => { if (e.key === 'Enter') handleAddIndependentPlan(); }} placeholder="例: 2330" className={`w-full input-styled rounded-xl p-2 md:p-3 text-xs md:text-sm font-mono-num ${isForbiddenStock ? 'border-red-500 text-red-400 bg-red-900/10' : 'text-white'}`} />
                            </div>
                            <div className="col-span-2 relative mt-1 md:mt-0">
                                <label className="block text-[11px] md:text-sm font-medium text-slate-400 mb-1.5 ml-1">名稱 (可反查代號)</label>
                                <div className="relative w-full h-auto">
                                    <input type="text" list="plan-stock-names-list" value={planStockName} onChange={handleStockNameChange} onKeyDown={e => { if (e.key === 'Enter') handleAddIndependentPlan(); }} placeholder="輸入名稱自動帶入..." className={`w-full input-styled rounded-xl p-2 md:p-3 text-xs md:text-sm ${isForbiddenStock ? 'border-red-500 text-red-400 bg-red-900/10' : (isUnknownStock ? 'border-amber-500/50 text-slate-200' : 'text-emerald-400 font-medium')}`} />
                                    {isForbiddenStock && (
                                        <span className="absolute right-2 top-1/2 -translate-y-1/2 text-[10px] md:text-xs text-red-200 bg-red-600 px-2 md:px-3 py-1 rounded font-bold uppercase tracking-wider animate-pulse whitespace-nowrap">嚴禁買入</span>
                                    )}
                                </div>
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                            </div>
                            <div className="col-span-2 md:col-span-4 flex items-end mt-2 md:mt-0">
                                <button onClick={handleAddIndependentPlan} className="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl p-3 md:p-3.5 font-bold tracking-wider flex items-center justify-center gap-2 shadow-[0_4px_15px_rgba(16,185,129,0.3)] transition-all transform hover:-translate-y-0.5 outline-none focus:ring-4 focus:ring-emerald-500/30">
                                    <PlusCircle size={18} /> 加入規劃白板
                                </button>
                            </div>
                        </div>
                    </div>

                    {/* 規劃清單表格 */}
                    <div className="glass-card rounded-3xl overflow-hidden mt-8">
                        <div className="overflow-x-auto custom-scrollbar pb-2">
                            <table className="w-full text-left border-collapse min-w-[1000px]">
                                <thead>
                                    <tr className="bg-slate-900/80 text-slate-400 text-sm tracking-wider border-b border-slate-700">
                                        <th className="p-4 align-top min-w-[200px]">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-emerald-400 font-bold transition select-none" onClick={() => handlePlanSort('stock')}>標的 / 持倉狀態 <SortIcon sortKey="stock" currentSort={planSort} /></div>
                                            <div className="flex flex-col gap-2">
                                                <div className="relative">
                                                    <Search size={12} className="absolute left-2 top-2 text-slate-500" />
                                                    <input type="text" placeholder="搜尋代號/名稱..." value={planFilters.stock} onChange={e => setPlanFilters({...planFilters, stock: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg pl-7 pr-2 py-1.5 text-xs outline-none focus:border-emerald-500 transition" />
                                                </div>
                                                <div className="flex gap-2">
                                                    <select value={planFilters.status} onChange={e => setPlanFilters({...planFilters, status: e.target.value})} className="w-1/2 bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-emerald-500 transition text-slate-300">
                                                        <option value="all">全狀態</option>
                                                        <option value="open">持倉中</option>
                                                        <option value="closed">已平倉</option>
                                                        <option value="planning">規劃中</option>
                                                    </select>
                                                    <select value={planFilters.futures} onChange={e => setPlanFilters({...planFilters, futures: e.target.value})} className="w-1/2 bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-emerald-500 transition text-slate-300">
                                                        <option value="all">全屬性</option>
                                                        <option value="yes">📌 有股期</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </th>
                                        <th className="p-4 align-top whitespace-nowrap"><div className="mb-2 flex items-center gap-1.5 font-bold cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handlePlanSort('entry')}>進場點 <SortIcon sortKey="entry" currentSort={planSort} /></div></th>
                                        <th className="p-4 align-top whitespace-nowrap"><div className="mb-2 flex items-center gap-1.5 font-bold cursor-pointer hover:text-red-400 transition select-none" onClick={() => handlePlanSort('sl')}>防守停損 <SortIcon sortKey="sl" currentSort={planSort} /></div></th>
                                        <th className="p-4 align-top whitespace-nowrap"><div className="mb-2 flex items-center gap-1.5 font-bold cursor-pointer hover:text-emerald-400 transition select-none" onClick={() => handlePlanSort('exit')}>市場現價 / 出場 <SortIcon sortKey="exit" currentSort={planSort} /></div></th>
                                        <th className="p-4 align-top whitespace-nowrap"><div className="mb-2 flex items-center gap-1.5 font-bold cursor-pointer hover:text-blue-400 transition select-none" onClick={() => handlePlanSort('shares')}>佈局張數 <SortIcon sortKey="shares" currentSort={planSort} /></div></th>
                                        <th className="p-4 align-top whitespace-nowrap"><div className="mb-2 flex items-center gap-1.5 font-bold cursor-pointer hover:text-purple-400 transition select-none" onClick={() => handlePlanSort('rr')}>風報比 <SortIcon sortKey="rr" currentSort={planSort} /></div></th>
                                        <th className="p-4 align-top whitespace-nowrap"><div className="mb-2 flex items-center gap-1.5 font-bold cursor-pointer hover:text-yellow-400 transition select-none" onClick={() => handlePlanSort('pnl')}>損益評估 (TWD) <SortIcon sortKey="pnl" currentSort={planSort} /></div></th>
                                        <th className="p-4 text-center align-top min-w-[150px]">
                                            <div className="mb-3 font-bold text-slate-300">策略操作</div>
                                            <button onClick={() => { setPlanFilters({stock: '', status: 'all', futures: 'all'}); setPlanSort({key: 'id', direction: 'desc'}); }} className="text-xs font-bold text-slate-500 hover:text-emerald-400 bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg transition border border-slate-700/50 w-full">清除篩選</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60">
                                    {filteredPlanLogs.map(log => {
                                        const p = log.plan || {};
                                        const isEditing = editingId === log.id;
                                        const isOpen = p.entry && !p.exit;
                                        
                                        let pnlValue = null;
                                        if (p.entry && p.shares) {
                                            if (isOpen && p.currentPrice) {
                                                pnlValue = (parseFloat(p.currentPrice) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                            } else if (!isOpen && p.exit) {
                                                pnlValue = (parseFloat(p.exit) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                            }
                                        }

                                        const hasFutures = epsData && epsData[log.stockId]?.hasFutures;

                                        return (
                                            <React.Fragment key={log.id}>
                                                <tr className={`table-row-hover ${hasFutures ? 'bg-fuchsia-900/5 hover:bg-fuchsia-900/10' : ''} ${isOpen ? 'bg-blue-900/5 shadow-[inset_3px_0_0_0_#3b82f6]' : (p.entry && p.exit ? 'opacity-70' : '')}`}>
                                                    <td className="p-4">
                                                        <div className="font-bold text-white flex items-center mb-1.5 flex-wrap gap-1">
                                                            <FuturesBadge hasFutures={hasFutures} />
                                                            <span className="font-mono-num text-lg mr-1">{log.stockId}</span>
                                                            <span className="text-emerald-300 font-medium whitespace-nowrap">{log.name}</span>
                                                        </div>
                                                        <div className="flex">
                                                            {isOpen ? (
                                                                <span className="bg-blue-500/20 text-blue-400 px-2.5 py-1 rounded-lg text-xs font-bold tracking-widest flex items-center gap-1.5 border border-blue-500/30 whitespace-nowrap">
                                                                    <span className="w-2 h-2 bg-blue-400 rounded-full animate-pulse shadow-[0_0_8px_#60a5fa]"></span> 實戰持倉中
                                                                </span>
                                                            ) : p.entry ? (
                                                                <span className="bg-slate-800 text-slate-400 px-2.5 py-1 rounded-lg text-xs font-bold tracking-widest border border-slate-700/50 whitespace-nowrap">已結算平倉</span>
                                                            ) : (
                                                                <span className="bg-slate-800/80 text-slate-500 px-2.5 py-1 rounded-lg text-xs font-bold tracking-widest border border-slate-700/50 border-dashed whitespace-nowrap">沙盤推演規劃中</span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="p-4 font-mono-num font-black text-lg text-slate-200">{p.entry || '-'}</td>
                                                    <td className="p-4 font-mono-num font-black text-lg text-red-400/80">{p.stopLoss || (p.entry ? (parseFloat(p.entry) * 0.95).toFixed(2) : '-')}</td>
                                                    <td className="p-4 font-mono-num">
                                                        {isOpen ? (
                                                            <div className="relative w-28">
                                                                <input type="number" step="any" placeholder="盤中價" value={p.currentPrice || ''} onChange={(e) => updatePlan(log.id, 'currentPrice', e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded-xl px-2 py-2 text-sm font-black text-emerald-400 outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition shadow-inner" />
                                                            </div>
                                                        ) : (
                                                            <span className="font-black text-lg text-slate-300">{p.exit || '-'}</span>
                                                        )}
                                                    </td>
                                                    <td className="p-4 font-mono-num font-black text-lg text-slate-300">{p.shares || '-'}</td>
                                                    <td className="p-4 font-mono-num font-black text-lg text-purple-400">{calculateRR(p)}</td>
                                                    <td className="p-4 font-mono-num">
                                                        {pnlValue !== null ? (
                                                            <div className={`text-lg md:text-xl font-black px-2 md:px-3 py-1 rounded-xl inline-block ${pnlValue > 0 ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : pnlValue < 0 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400 bg-slate-800 border border-slate-700'}`}>
                                                                {pnlValue > 0 ? '+' : ''}{Math.round(pnlValue).toLocaleString()}
                                                            </div>
                                                        ) : <span className="text-slate-500 text-lg">-</span>}
                                                    </td>
                                                    <td className="p-4 text-center">
                                                        <div className="flex justify-center items-center gap-1.5 md:gap-2 flex-wrap">
                                                            <button onClick={() => onAiReview(log, pnlValue, calculateRR(p))} className="p-2 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400 hover:bg-purple-500 hover:text-white transition-all group/btn shadow-[0_0_10px_rgba(168,85,247,0)] hover:shadow-[0_0_15px_rgba(168,85,247,0.5)]" title={isOpen ? "✨ AI 持倉盤中健診" : "✨ AI 盤後深度檢討"}>
                                                                <Sparkles size={16} className="md:w-[18px] md:h-[18px] group-hover/btn:animate-pulse" />
                                                            </button>
                                                            <button onClick={() => setEditingId(isEditing ? null : log.id)} className={`px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-bold tracking-wider transition-all shadow-sm ${isEditing ? 'bg-gradient-to-r from-blue-600 to-indigo-600 text-white shadow-blue-900/50' : 'bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700/80'}`}>
                                                                {isEditing ? '儲存' : '編輯'}
                                                            </button>
                                                            <button onClick={() => setConfirm({ 
                                                                show: true, 
                                                                action: () => {
                                                                    setLogs(logs.map(l => l.id === log.id ? { ...l, inPlan: false, plan: { ...l.plan, entry: '', stopLoss: '', exit: '' } } : l));
                                                                }
                                                            })} className="p-2 text-slate-500 hover:text-red-400 hover:bg-red-500/20 rounded-xl transition" title="從儀表板中移除">
                                                                <X size={18} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                                
                                                {/* 展開編輯區塊優化 - 解決重疊問題 */}
                                                {isEditing && (
                                                    <tr className="bg-slate-900/90 border-l-4 border-blue-500 shadow-[inset_0_4px_10px_rgba(0,0,0,0.2)]">
                                                        <td colSpan="8" className="p-4 md:p-8">
                                                            <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-4 md:gap-6">
                                                                <div>
                                                                    <label className="block text-xs font-bold tracking-widest text-slate-500 mb-2 uppercase">規劃進場價</label>
                                                                    <input type="number" step="any" value={p.entry || ''} onChange={e => updatePlan(log.id, 'entry', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm md:text-base font-mono-num font-bold text-white" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-[10px] md:text-xs font-bold tracking-widest text-slate-500 mb-2 uppercase flex justify-between items-center">
                                                                        防守停損價 <span className="text-[9px] bg-red-900/30 text-red-400 px-1.5 py-0.5 rounded">自動95折</span>
                                                                    </label>
                                                                    <input type="number" step="any" value={p.stopLoss || ''} onChange={e => updatePlan(log.id, 'stopLoss', e.target.value)} placeholder={p.entry ? (parseFloat(p.entry) * 0.95).toFixed(2) : ''} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm md:text-base font-mono-num font-bold text-red-400 focus:border-red-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs font-bold tracking-widest text-slate-500 mb-2 uppercase">移動停利線</label>
                                                                    <input type="number" step="any" value={p.trailing || ''} onChange={e => updatePlan(log.id, 'trailing', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm md:text-base font-mono-num font-bold text-yellow-400 focus:border-yellow-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs font-bold tracking-widest text-slate-500 mb-2 uppercase">目標出場價</label>
                                                                    <input type="number" step="any" value={p.exit || ''} onChange={e => updatePlan(log.id, 'exit', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm md:text-base font-mono-num font-bold text-emerald-400 focus:border-emerald-500" />
                                                                </div>
                                                                <div className="sm:col-span-2 md:col-span-1">
                                                                    <label className="block text-xs font-bold tracking-widest text-slate-500 mb-2 uppercase">預計佈局張數</label>
                                                                    <input type="number" value={p.shares || ''} onChange={e => updatePlan(log.id, 'shares', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm md:text-base font-mono-num font-bold text-white" />
                                                                </div>
                                                                
                                                                <div className="col-span-1 sm:col-span-2 md:col-span-5 mt-2 md:mt-4 pt-4 border-t border-slate-800/80">
                                                                    <span className="text-xs font-bold tracking-widest text-slate-500 mb-4 flex items-center gap-2 uppercase"><Zap size={14} className="text-purple-400" /> 權證/槓桿擴充設定</span>
                                                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 md:gap-5">
                                                                        <input type="text" placeholder="權證代號" value={p.warrantCode || ''} onChange={e => updatePlan(log.id, 'warrantCode', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm font-mono-num" />
                                                                        <input type="number" step="any" placeholder="買進成本" value={p.warrantEntry || ''} onChange={e => updatePlan(log.id, 'warrantEntry', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm font-mono-num text-purple-300 focus:border-purple-500" />
                                                                        <input type="number" step="any" placeholder="賣出結算" value={p.warrantExit || ''} onChange={e => updatePlan(log.id, 'warrantExit', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm font-mono-num text-emerald-300 focus:border-emerald-500" />
                                                                        <input type="number" placeholder="持有張數" value={p.warrantShares || ''} onChange={e => updatePlan(log.id, 'warrantShares', e.target.value)} className="w-full input-styled rounded-xl p-2.5 md:p-3 text-sm font-mono-num" />
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        )
                                    })}
                                    {plannedLogs.length === 0 && (
                                        <tr><td colSpan="8" className="p-16 text-center text-slate-500">
                                            <LayoutDashboard size={48} className="mx-auto mb-4 opacity-30" />
                                            <p className="text-lg font-medium mb-1">儀表板目前為空</p>
                                            <p className="text-sm opacity-70">請從上方新增獨立計畫，或在「選股日誌」中點擊靶心圖示 🎯 載入資料</p>
                                        </td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <AlertModal isOpen={alert.show} message={alert.msg} onClose={() => setAlert({ show: false, msg: '' })} />
                    <ConfirmModal isOpen={confirm.show} title="確認移出" message="確定要將此標的從規劃儀表板移除嗎？（選股日誌中的原始紀錄不會被刪除，您隨時可以重新加入）" 
                        onConfirm={() => { confirm.action(); setConfirm({ show: false, action: null }); }} 
                        onCancel={() => setConfirm({ show: false, action: null })} />
                    
                    <ForbiddenModal 
                        isOpen={forbiddenAlert.show} 
                        stockName={forbiddenAlert.stockName}
                        onConfirm={() => {
                            if (forbiddenAlert.action) forbiddenAlert.action();
                            setForbiddenAlert({ show: false, stockName: '', action: null });
                        }}
                        onCancel={() => setForbiddenAlert({ show: false, stockName: '', action: null })}
                    />
                </div>
            );
        };

        // ==========================================
        // 6. 模組四：追蹤清單 (Watchlist)
        // ==========================================
        const WatchlistModule = ({ logs, setLogs, epsData, forbiddenStocks, onAiDiagnose }) => {
            const [confirm, setConfirm] = useState({ show: false, action: null });
            const [watchlistFilters, setWatchlistFilters] = useState({ date: '', stock: '', futures: 'all', growth: 'all', tag: '', tagCount: 'all' });
            const [watchlistSort, setWatchlistSort] = useState({ key: 'id', direction: 'desc' });
            const [showForbidden, setShowForbidden] = useState(false);
            const [forbiddenAlert, setForbiddenAlert] = useState({ show: false, stockName: '', action: null });

            const handleWatchlistSort = (key) => {
                if (watchlistSort.key === key) {
                    setWatchlistSort({ key, direction: watchlistSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setWatchlistSort({ key, direction: 'desc' }); 
                }
            };

            const toggleStar = (id) => {
                setLogs(logs.map(log => log.id === id ? { ...log, starred: !log.starred } : log));
            };

            const togglePlan = (id) => {
                const log = logs.find(l => l.id === id);
                if (log && !log.inPlan) {
                    const isForbidden = forbiddenStocks.some(f => f.id === log.stockId || log.name.includes(f.name) || f.name === log.name);
                    if (isForbidden) {
                        setForbiddenAlert({ show: true, stockName: log.name, action: () => setLogs(logs.map(l => l.id === id ? { ...l, inPlan: !l.inPlan } : l)) });
                        return;
                    }
                }
                setLogs(logs.map(log => log.id === id ? { ...log, inPlan: !log.inPlan } : log));
            };

            const deleteLog = (id) => {
                setLogs(logs.filter(log => log.id !== id));
            };

            const removeTag = (logId, isSubTag, tagToRemove) => {
                setLogs(logs.map(log => {
                    if (log.id !== logId) return log;
                    const newLog = { ...log };
                    if (isSubTag) {
                        newLog.subTags = (newLog.subTags || []).filter(t => t !== tagToRemove);
                    } else {
                        const strategiesArray = Array.isArray(newLog.strategy) ? newLog.strategy : (newLog.strategy ? [newLog.strategy] : []);
                        newLog.strategy = strategiesArray.filter(s => s !== tagToRemove);
                    }
                    return newLog;
                }));
            };

            const filteredWatchlistLogs = useMemo(() => {
                let result = logs.filter(l => l.starred);
                if (watchlistFilters.date) result = result.filter(l => l.date === watchlistFilters.date);
                if (watchlistFilters.stock) {
                    const kw = watchlistFilters.stock.toLowerCase();
                    result = result.filter(l => l.stockId.toLowerCase().includes(kw) || l.name.toLowerCase().includes(kw));
                }
                if (watchlistFilters.futures !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        if (watchlistFilters.futures === 'yes') return eps.hasFutures;
                        return true;
                    });
                }
                if (watchlistFilters.growth !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        const g = parseFloat(eps.epsGrowth);
                        if (watchlistFilters.growth === 'positive') return !isNaN(g) && g > 0;
                        if (watchlistFilters.growth === 'negative') return !isNaN(g) && g < 0;
                        return true;
                    });
                }
                if (watchlistFilters.tag) {
                    result = result.filter(l => {
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        const matchMain = strats.some(sId => {
                            const s = STRATEGIES.find(x => x.id === sId);
                            return s && s.label === watchlistFilters.tag;
                        });
                        const matchSub = l.subTags && l.subTags.includes(watchlistFilters.tag);
                        return matchMain || matchSub;
                    });
                }
                if (watchlistFilters.tagCount !== 'all') {
                    result = result.filter(l => {
                        let tCount = [];
                        if (l.subTags && l.subTags.length > 0) tCount.push(...l.subTags);
                        const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                        strats.forEach(sId => {
                            const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                            if (!hasSub) tCount.push(sId);
                        });
                        const c = tCount.length;
                        if (watchlistFilters.tagCount === '1') return c === 1;
                        if (watchlistFilters.tagCount === '2') return c === 2;
                        if (watchlistFilters.tagCount === '3') return c === 3;
                        if (watchlistFilters.tagCount === '4+') return c >= 4;
                        return true;
                    });
                }

                result.sort((a, b) => {
                    let valA, valB;
                    const epsA = epsData[a.stockId] || {};
                    const epsB = epsData[b.stockId] || {};

                    switch (watchlistSort.key) {
                        case 'date': valA = a.date; valB = b.date; if (valA === valB) { valA = parseInt(a.id); valB = parseInt(b.id); } break;
                        case 'stock': valA = a.stockId; valB = b.stockId; break;
                        case 'eps25': valA = parseFloat(epsA.eps25) || -999999; valB = parseFloat(epsB.eps25) || -999999; break;
                        case 'eps26': valA = parseFloat(epsA.eps26) || -999999; valB = parseFloat(epsB.eps26) || -999999; break;
                        case 'growth': valA = parseFloat(epsA.epsGrowth) || -999999; valB = parseFloat(epsB.epsGrowth) || -999999; break;
                        case 'tags': {
                            const getScore = (l) => {
                                let t = [];
                                if (l.subTags && l.subTags.length > 0) t.push(...l.subTags);
                                const strats = Array.isArray(l.strategy) ? l.strategy : (l.strategy ? [l.strategy] : []);
                                strats.forEach(sId => {
                                    const hasSub = l.subTags?.some(tag => SUB_TAGS[sId]?.includes(tag));
                                    if (!hasSub) t.push(sId);
                                });
                                let finalScore = t.length;
                                const eps = epsData[l.stockId] || {};
                                const g = parseFloat(eps.epsGrowth);
                                if (!isNaN(g) && g > 0) finalScore += 1;
                                return finalScore;
                            };
                            valA = getScore(a); valB = getScore(b); break;
                        }
                        default: valA = parseInt(a.id); valB = parseInt(b.id); break;
                    }
                    if (valA < valB) return watchlistSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return watchlistSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });
                return result;
            }, [logs, watchlistFilters, epsData, watchlistSort]);

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="flex justify-between items-end mb-4">
                        <h2 className="text-2xl md:text-3xl font-title text-amber-400 flex items-center gap-3 drop-shadow-md">
                            <div className="p-2 bg-amber-500/10 rounded-xl"><Star fill="currentColor" size={24} className="md:w-7 md:h-7" /></div> 
                            專屬自選追蹤池
                        </h2>
                        <span className="text-xs md:text-sm font-bold bg-slate-800 border border-slate-700 px-3 md:px-4 py-2 rounded-xl text-slate-300 shadow-inner">
                            目前強勢關注 <span className="text-amber-400 text-base md:text-lg mx-1">{filteredWatchlistLogs.length}</span> 檔標的
                        </span>
                    </div>

                    <div className="glass-card rounded-3xl overflow-hidden shadow-lg mt-8">
                        <div className="overflow-x-auto custom-scrollbar pb-2">
                            <table className="w-full text-left border-collapse min-w-[800px]">
                                <thead>
                                    <tr className="bg-slate-900/80 text-slate-400 text-sm tracking-wider border-b border-slate-700">
                                        <th className="p-4 font-bold align-top min-w-[120px] whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-amber-400 transition select-none" onClick={() => handleWatchlistSort('date')}>建檔日 <SortIcon sortKey="date" currentSort={watchlistSort} /></div>
                                            <input type="date" value={watchlistFilters.date} onChange={e => setWatchlistFilters({...watchlistFilters, date: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2.5 py-1.5 text-xs font-mono-num outline-none focus:border-amber-500 transition" />
                                        </th>
                                        <th className="p-4 font-bold align-top min-w-[150px]">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-amber-400 transition select-none" onClick={() => handleWatchlistSort('stock')}>代號 / 名稱 <SortIcon sortKey="stock" currentSort={watchlistSort} /></div>
                                            <div className="flex flex-col gap-2">
                                                <div className="relative">
                                                    <Search size={12} className="absolute left-2 top-2 text-slate-500" />
                                                    <input type="text" placeholder="快搜標的..." value={watchlistFilters.stock} onChange={e => setWatchlistFilters({...watchlistFilters, stock: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg pl-7 pr-2 py-1.5 text-xs outline-none focus:border-amber-500 transition" />
                                                </div>
                                                <select value={watchlistFilters.futures} onChange={e => setWatchlistFilters({...watchlistFilters, futures: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-amber-500 transition text-slate-300">
                                                    <option value="all">不限屬性</option>
                                                    <option value="yes">📌 僅顯示有股期</option>
                                                </select>
                                            </div>
                                        </th>
                                        <th className="p-4 font-bold font-mono-num align-top min-w-[90px] whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-amber-400 transition select-none" onClick={() => handleWatchlistSort('eps25')}>25' EPS <SortIcon sortKey="eps25" currentSort={watchlistSort} /></div>
                                        </th>
                                        <th className="p-4 font-bold font-mono-num align-top min-w-[90px] whitespace-nowrap">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-amber-400 transition select-none" onClick={() => handleWatchlistSort('eps26')}>26' EPS(預) <SortIcon sortKey="eps26" currentSort={watchlistSort} /></div>
                                        </th>
                                        <th className="p-4 font-bold font-mono-num align-top whitespace-nowrap min-w-[120px]">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-amber-400 transition select-none" onClick={() => handleWatchlistSort('growth')}>EPS 成長率 <SortIcon sortKey="growth" currentSort={watchlistSort} /></div>
                                            <select value={watchlistFilters.growth} onChange={e => setWatchlistFilters({...watchlistFilters, growth: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-amber-500 transition text-slate-300">
                                                <option value="all">不限</option>
                                                <option value="positive">📈 &gt; 0% (正成長)</option>
                                                <option value="negative">📉 &lt; 0% (衰退)</option>
                                            </select>
                                        </th>
                                        <th className="p-4 font-bold align-top min-w-[180px]">
                                            <div className="mb-2 flex items-center gap-1.5 cursor-pointer hover:text-amber-400 transition select-none" onClick={() => handleWatchlistSort('tags')}>策略特徵標籤 <SortIcon sortKey="tags" currentSort={watchlistSort} /></div>
                                            <div className="flex flex-col gap-2">
                                                <select value={watchlistFilters.tag} onChange={e => setWatchlistFilters({...watchlistFilters, tag: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-amber-500 transition text-slate-300">
                                                    <option value="">全部標籤</option>
                                                    {STRATEGIES.map(s => (
                                                        <optgroup key={s.id} label={s.label}>
                                                            <option value={s.label}>{s.label} (主策略)</option>
                                                            {(SUB_TAGS[s.id] || []).map(t => (
                                                                <option key={t} value={t}>{t}</option>
                                                            ))}
                                                        </optgroup>
                                                    ))}
                                                </select>
                                                <select value={watchlistFilters.tagCount} onChange={e => setWatchlistFilters({...watchlistFilters, tagCount: e.target.value})} className="w-full bg-slate-950 border border-slate-700/80 rounded-lg px-2 py-1.5 text-xs outline-none focus:border-amber-500 transition text-slate-300">
                                                    <option value="all">不限條件數</option>
                                                    <option value="1">至少 1 項條件</option>
                                                    <option value="2">至少 2 項條件</option>
                                                    <option value="3">至少 3 項條件</option>
                                                    <option value="4+">4 項(含)以上</option>
                                                </select>
                                            </div>
                                        </th>
                                        <th className="p-4 font-bold text-center align-top min-w-[160px]">
                                            <div className="mb-3">操作</div>
                                            <button onClick={() => { setWatchlistFilters({date: '', stock: '', futures: 'all', growth: 'all', tag: '', tagCount: 'all'}); setWatchlistSort({key: 'id', direction: 'desc'}); }} className="text-xs font-bold text-slate-500 hover:text-amber-400 bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg transition border border-slate-700/50 w-full">清除所有篩選</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/60">
                                    {filteredWatchlistLogs.map(log => {
                                        const eps = epsData[log.stockId] || { eps25: '-', eps26: '-', epsGrowth: '-', hasFutures: false };
                                        const hasFutures = eps.hasFutures;

                                        return (
                                            <tr key={log.id} className={`table-row-hover group ${hasFutures ? 'bg-fuchsia-900/5 hover:bg-fuchsia-900/10' : ''}`}>
                                                <td className="p-4 font-mono-num text-slate-300 text-sm whitespace-nowrap">{log.date}</td>
                                                <td className="p-4">
                                                    <div className="flex items-center flex-wrap gap-y-1">
                                                        <FuturesBadge hasFutures={hasFutures} />
                                                        <span className="font-mono-num font-black text-lg text-slate-200 mr-2 tracking-wide">{log.stockId}</span>
                                                        <span className="text-amber-300 font-bold text-base whitespace-nowrap">{log.name}</span>
                                                    </div>
                                                </td>
                                                <td className={`p-4 font-mono-num font-bold text-base ${getTwStockColor(eps.eps25)}`}>{eps.eps25}</td>
                                                <td className={`p-4 font-mono-num font-bold text-base ${getTwStockColor(eps.eps26)}`}>{eps.eps26}</td>
                                                <td className="p-4">
                                                    <span className={`font-mono-num font-black text-lg px-2 py-0.5 rounded-md ${eps.epsGrowth && parseFloat(eps.epsGrowth) > 0 ? 'bg-rose-500/10 text-rose-400 border border-rose-500/20' : (eps.epsGrowth && parseFloat(eps.epsGrowth) < 0 ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'text-slate-400')}`}>
                                                        {eps.epsGrowth || '-'}
                                                    </span>
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex flex-wrap gap-1.5 items-center">
                                                        {log.subTags && log.subTags.length > 0 && (
                                                            log.subTags.map(t => {
                                                                const stratForTag = STRATEGIES.find(s => SUB_TAGS[s.id]?.includes(t));
                                                                return (
                                                                    <span 
                                                                        key={t} 
                                                                        onClick={() => removeTag(log.id, true, t)}
                                                                        className={`group/tag cursor-pointer inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold tracking-wide bg-gradient-to-r ${SUB_TAG_COLORS[t] || stratForTag?.color || 'from-slate-600 to-slate-700'} text-white shadow-sm hover:shadow-md transition-all relative overflow-hidden`}
                                                                        title="點擊移除標籤"
                                                                    >
                                                                        <span className="relative z-10 group-hover/tag:mr-4 transition-all whitespace-nowrap">{t}</span>
                                                                        <X size={12} className="absolute right-2 opacity-0 group-hover/tag:opacity-100 transition-opacity z-10 font-black" />
                                                                        <div className="absolute inset-0 bg-black/20 opacity-0 group-hover/tag:opacity-100 transition-opacity"></div>
                                                                    </span>
                                                                );
                                                            })
                                                        )}
                                                        {(() => {
                                                            const strategiesArray = Array.isArray(log.strategy) ? log.strategy : (log.strategy ? [log.strategy] : []);
                                                            return strategiesArray.map(stratId => {
                                                                const s = STRATEGIES.find(str => str.id === stratId);
                                                                if (!s) return null;
                                                                const hasSubTag = log.subTags?.some(tag => SUB_TAGS[stratId]?.includes(tag));
                                                                if (log.subTags && log.subTags.length > 0 && hasSubTag) return null;
                                                                return (
                                                                    <span 
                                                                        key={s.id} 
                                                                        onClick={() => removeTag(log.id, false, s.id)}
                                                                        className={`group/tag cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg text-xs font-bold tracking-wide bg-gradient-to-r ${s.color} text-white shadow-sm hover:shadow-md transition-all relative overflow-hidden opacity-90`}
                                                                        title="點擊移除主策略"
                                                                    >
                                                                        <span className="relative z-10 flex items-center gap-1 group-hover/tag:mr-4 transition-all whitespace-nowrap">{s.emoji} {s.label}</span>
                                                                        <X size={12} className="absolute right-2 opacity-0 group-hover/tag:opacity-100 transition-opacity z-10 font-black" />
                                                                        <div className="absolute inset-0 bg-black/20 opacity-0 group-hover/tag:opacity-100 transition-opacity"></div>
                                                                    </span>
                                                                );
                                                            });
                                                        })()}
                                                        {(!log.subTags || log.subTags.length === 0) && (!log.strategy || log.strategy.length === 0) && (
                                                            <span className="text-xs text-slate-600 italic">無標籤</span>
                                                        )}
                                                    </div>
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex justify-center items-center gap-1.5 flex-wrap">
                                                        <button onClick={() => onAiDiagnose(log)} className="p-2 rounded-xl bg-purple-500/10 text-purple-400 hover:bg-purple-500 hover:text-white transition-all group/btn shadow-[0_0_10px_rgba(168,85,247,0)] hover:shadow-[0_0_15px_rgba(168,85,247,0.5)]" title="✨ AI 個股診斷">
                                                            <Sparkles size={18} className="group-hover/btn:animate-pulse" />
                                                        </button>
                                                        <div className="w-[1px] h-6 bg-slate-700/50 mx-1 hidden sm:block"></div>
                                                        <button onClick={() => togglePlan(log.id)} className={`p-2 rounded-xl transition-all ${log.inPlan ? 'bg-blue-500/20 text-blue-400 shadow-[0_0_10px_rgba(59,130,246,0.3)] border border-blue-500/30' : 'bg-slate-800 text-slate-400 hover:bg-blue-500/10 hover:text-blue-400 border border-transparent'}`} title={log.inPlan ? '移出規劃清單' : '加入規劃清單'}>
                                                            <Target size={18} />
                                                        </button>
                                                        <button onClick={() => toggleStar(log.id)} className={`p-2 rounded-xl transition-all ${log.starred ? 'bg-amber-500/20 text-amber-400 shadow-[0_0_10px_rgba(245,158,11,0.3)] border border-amber-500/30' : 'bg-slate-800 text-slate-400 hover:bg-amber-500/10 hover:text-amber-400 border border-transparent'}`} title={log.starred ? '取消追蹤' : '加入追蹤'}>
                                                            <Star fill={log.starred ? "currentColor" : "none"} size={18} />
                                                        </button>
                                                        <button onClick={() => setConfirm({ show: true, action: () => deleteLog(log.id) })} className="p-2 rounded-xl bg-slate-800 text-slate-500 hover:bg-red-500/10 hover:text-red-400 transition-colors" title="刪除紀錄">
                                                            <Trash2 size={18} />
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {filteredWatchlistLogs.length === 0 && (
                                        <tr><td colSpan="7" className="p-16 text-center">
                                            <div className="inline-flex flex-col items-center justify-center text-slate-500">
                                                <Star size={48} className="mb-4 opacity-50" />
                                                <p className="text-lg font-medium mb-1">自選追蹤池目前淨空</p>
                                                <p className="text-sm opacity-70">在選股日誌點亮星星 ⭐ 即可加入專屬關注清單</p>
                                            </div>
                                        </td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <ConfirmModal isOpen={confirm.show} title="確認刪除" message="您確定要徹底刪除這筆關注紀錄嗎？此動作無法復原。" 
                        onConfirm={() => { confirm.action(); setConfirm({ show: false, action: null }); }} 
                        onCancel={() => setConfirm({ show: false, action: null })} />
                    
                    <ForbiddenModal 
                        isOpen={forbiddenAlert.show} 
                        stockName={forbiddenAlert.stockName}
                        onConfirm={() => {
                            if (forbiddenAlert.action) forbiddenAlert.action();
                            setForbiddenAlert({ show: false, stockName: '', action: null });
                        }}
                        onCancel={() => setForbiddenAlert({ show: false, stockName: '', action: null })}
                    />
                </div>
            );
        };

        // ==========================================
        // 7. 模組五：佳佳持股專區 (Forbidden Module)
        // ==========================================
        const ForbiddenModule = ({ forbiddenStocks, setForbiddenStocks, stockMap, setCustomStocks }) => {
            const [stockId, setStockId] = useState('');
            const [stockName, setStockName] = useState('');
            const [alert, setAlert] = useState({ show: false, msg: '' });

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setStockId(val);
                const trimmedVal = val.trim();
                if (trimmedVal === '') { setStockName(''); return; }
                if (stockMap[trimmedVal]) setStockName(stockMap[trimmedVal].name);
            };

            const handleStockNameChange = (e) => {
                if (formatType === 'strategy') {
                    data.strategyGroups.forEach(grp => {
                        detailText += `🎯 [${grp.label}] (共 ${grp.logs.length} 檔)\n`;
                        grp.logs.forEach(l => {
                            detailText += `  - ${l.stockId} ${l.name}\n`;
                        });
                        detailText += `\n`;
                    });
                } else {
                    data.sortedLogs.forEach(l => {
                        const countStr = l.score > 0 ? ` (${l.score}分)` : '';
                        const tagStr = l.displayTags.length > 0 ? ` (${l.displayTags.join('、')})` : '';
                        if (formatType === 'growth') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}\n`;
                        } else if (formatType === 'score' || formatType === 'score-futures') {
                            const growthStr = l.displayGrowth !== '-' ? ` [成長率: ${l.displayGrowth}]` : '';
                            detailText += `- ${l.stockId} ${l.name}${growthStr}${countStr}${tagStr}\n`;
                        } else {
                            detailText += `- ${l.stockId} ${l.name}${countStr}${tagStr}\n`;
                        }
                    });
                }

                resultText += detailText;
                resultText += `-------------------\n⚠️ 停損是紀律，停利是藝術。\n⚠️ 位階決定勝率，部位決定存活。`;
                
                fallbackCopyTextToClipboard(resultText);
                setCopySuccess(formatType);
                setTimeout(() => setCopySuccess(null), 2000); 
            };

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="flex justify-between items-end mb-4">
                        <div className="absolute -right-10 -top-10 text-red-500/5 -z-10 pointer-events-none">
                            <Ban size={300} />
                        </div>
                        <h2 className="text-2xl md:text-3xl font-title text-red-500 mb-3 flex items-center gap-3 relative z-10 drop-shadow-md">
                            <div className="p-2 bg-red-500/10 rounded-xl"><Ban size={24} className="md:w-7 md:h-7" /></div> 
                            佳佳持股 ‧ 絕對隔離區
                        </h2>
                        <p className="text-slate-400 text-xs md:text-sm mb-6 md:mb-8 relative z-10 font-medium tracking-wide">將高風險或特定股票加入此清單後，系統將在全域操作中進行強制攔截，以最高規格保護您的資金安全。</p>
                        
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-5 mb-2 relative z-10">
                            <div className="col-span-1 relative">
                                <label className="block text-xs md:text-sm font-bold text-red-400/80 mb-1.5 ml-1">輸入鎖定股號</label>
                                <input 
                                    type="text" 
                                    value={stockId} 
                                    onChange={handleStockIdChange} 
                                    onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
                                    placeholder="e.g. 2317" 
                                    className="w-full input-styled border-red-900/50 focus:border-red-500 rounded-xl p-2.5 md:p-3 font-mono-num transition text-white focus:shadow-[0_0_0_2px_rgba(239,68,68,0.2)]" 
                                />
                            </div>
                            <div className="col-span-1 md:col-span-2 relative">
                                <label className="block text-xs md:text-sm font-bold text-red-400/80 mb-1.5 ml-1">對應股票名稱 (可反查)</label>
                                <input 
                                    type="text" 
                                    value={stockName} 
                                    onChange={handleStockNameChange}
                                    onKeyDown={e => { if (e.key === 'Enter') handleAdd(); }}
                                    placeholder="輸入股名自動鎖定代號..." 
                                    className="w-full input-styled border-red-900/50 focus:border-red-500 rounded-xl p-2.5 md:p-3 transition text-white focus:shadow-[0_0_0_2px_rgba(239,68,68,0.2)]" 
                                />
                            </div>
                            <div className="col-span-2 md:col-span-1 flex items-end mt-2 md:mt-0">
                                <button onClick={handleAdd} className="w-full bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white p-3 md:p-3.5 rounded-xl font-black tracking-widest flex items-center justify-center gap-2 transition shadow-[0_4px_15px_rgba(220,38,38,0.3)] transform hover:-translate-y-0.5 outline-none focus:ring-4 focus:ring-red-500/30">
                                    <Ban size={18} /> 執行封鎖
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="glass-card rounded-3xl overflow-hidden mt-8">
                        <div className="p-4 md:p-5 border-b border-red-900/50 bg-red-950/20 flex justify-between items-center">
                            <h3 className="font-bold text-red-400 text-base md:text-lg flex items-center gap-2">
                                <ShieldAlert size={20} /> 目前防護名單 (總計 {forbiddenStocks.length} 檔)
                            </h3>
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-0">
                            {forbiddenStocks.map(f => (
                                <div key={f.id} className="p-4 md:p-5 border-r border-b border-slate-800/50 hover:bg-red-950/30 flex justify-between items-center group transition-colors">
                                    <div className="flex flex-col gap-1">
                                        <div className="font-bold text-slate-400 font-mono-num text-[10px] md:text-xs tracking-wider">{f.id}</div>
                                        <div className="font-black text-red-400 text-lg md:text-xl tracking-wide">{f.name}</div>
                                    </div>
                                    <button onClick={() => handleDelete(f.id)} className="text-slate-600 hover:text-red-400 md:opacity-0 group-hover:opacity-100 transition p-2 bg-red-500/5 hover:bg-red-500/20 rounded-xl" title="解除封鎖">
                                        <Trash2 size={16} className="md:w-[18px] md:h-[18px]" />
                                    </button>
                                </div>
                            ))}
                            {forbiddenStocks.length === 0 && (
                                <div className="col-span-full p-16 text-center">
                                    <div className="inline-flex flex-col items-center justify-center text-slate-500">
                                        <ShieldCheck size={48} className="mb-4 opacity-50 text-emerald-500" />
                                        <p className="text-lg font-medium text-emerald-400/80 mb-1">防護網目前淨空</p>
                                        <p className="text-sm opacity-70">您的交易沒有任何黑名單限制</p>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    <AlertModal isOpen={alert.show} message={alert.msg} onClose={() => setAlert({ show: false, msg: '' })} />
                </div>
            );
        };

        // ==========================================
        // 0. 主應用程式 (App)
        // ==========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('journal');
            const [appAlert, setAppAlert] = useState({ show: false, msg: '' });
            
            // 使用 Firebase Hook 替換原本的 LocalStorage Hook
            const [logs, setLogs, logsLoaded] = useFirebaseState('ryan_stock_logs', []);
            const [calcHistory, setCalcHistory, calcLoaded] = useFirebaseState('ryan_calc_history', []);
            const [epsData, setEpsData, epsLoaded] = useFirebaseState('ryan_eps_data', {});
            const [customStocks, setCustomStocks, customLoaded] = useFirebaseState('ryan_custom_stocks', {});
            const [forbiddenStocks, setForbiddenStocks, forbiddenLoaded] = useFirebaseState('ryan_forbidden_stocks', DEFAULT_FORBIDDEN);

            // 檢查是否所有資料都已從 Firebase 載入完成
            const isAppReady = logsLoaded && calcLoaded && epsLoaded && customLoaded && forbiddenLoaded;

            // AI 相關狀態
            const { generateText } = useGeminiAPI();
            const [aiModal, setAiModal] = useState({ isOpen: false, loading: false, content: '', title: '' });

            const stockMap = useMemo(() => {
                return { ...STATIC_STOCK_DB, ...customStocks };
            }, [customStocks]);

            const handleAiDiagnose = async (log) => {
                setAiModal({ isOpen: true, loading: true, content: '', title: `✨ AI 智能診斷分析：${log.name} (${log.stockId})` });
                const epsInfo = epsData[log.stockId] || {};
                const strategyLabels = Array.isArray(log.strategy) ? log.strategy.map(sId => STRATEGIES.find(s => s.id === sId)?.label).filter(Boolean) : [];
                const allTags = [...strategyLabels, ...(log.subTags || [])].join('、');
                
                const prompt = `請針對台股「${log.name} (${log.stockId})」進行簡要的技術面或籌碼面診斷。
                【使用者觀察數據】
                - 策略特徵：${allTags || '無特殊標籤'}
                - EPS 成長動能：${epsInfo.epsGrowth || '尚無資料'}
                
                請用大約 150 字的繁體中文，給出客觀的分析與後續觀察重點，並提醒潛在風險。語氣請專業且具建設性，直接回覆重點即可，不需問候。`;
                
                const result = await generateText(prompt, "你是一位專業的台股分析師，擅長技術與籌碼面分析。");
                setAiModal(prev => ({ ...prev, loading: false, content: result }));
            };

            const handleAiReview = async (log, pnl, rr) => {
                const p = log.plan || {};
                const isOpen = p.entry && !p.exit;
                setAiModal({ isOpen: true, loading: true, content: '', title: isOpen ? `✨ AI 盤中持倉教練：${log.name}` : `✨ AI 盤後深度檢討：${log.name}` });
                
                const strategyLabels = Array.isArray(log.strategy) ? log.strategy.map(sId => STRATEGIES.find(s => s.id === sId)?.label).filter(Boolean) : [];
                const allTags = [...strategyLabels, ...(log.subTags || [])].join('、');

                let prompt = "";
                if (isOpen) {
                    prompt = `我目前持倉台股「${log.name} (${log.stockId})」。
                    【交易計畫參數】
                    - 進場成本：${p.entry}
                    - 防守停損：${p.stopLoss}
                    - 目前現價：${p.currentPrice || '未知'}
                    - 佈局理由：${allTags || '無特殊標籤'}
                    - 帳面損益：${pnl ? Math.round(pnl) + '元' : '未知'}
                    
                    請以專業交易心理教練的身份，用大約 150 字給我持倉中的心理建議、風險控管與停利紀律提醒。請使用繁體中文。`;
                } else {
                    prompt = `我剛完成了一筆台股「${log.name} (${log.stockId})」的交易結算。
                    【交易結果覆盤】
                    - 進場成本：${p.entry}
