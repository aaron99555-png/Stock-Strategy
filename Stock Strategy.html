                                <h3 className="text-lg font-bold text-purple-400 mb-4 border-b border-slate-700 pb-2 relative z-10">Pivot 系統</h3>
                                <div className="space-y-1 relative z-10">
                                    <ColorRow label="R2" value={results.pivot.R2} type="R" />
                                    <ColorRow label="R1" value={results.pivot.R1} type="R" />
                                    <ColorRow label="P" value={results.pivot.P} type="P" />
                                    <ColorRow label="S1" value={results.pivot.S1} type="S" />
                                    <ColorRow label="S2" value={results.pivot.S2} type="S" />
                                </div>
                                <button onClick={() => copySystem('Pivot系統', results.pivot)} className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg flex justify-center items-center gap-2 transition text-slate-300">
                                    <ClipboardCopy size={16} /> 複製 (Pivot)
                                </button>
                            </div>

                            <div className="bg-slate-900 rounded-2xl border border-slate-700 p-5 shadow-xl relative overflow-hidden group">
                                <div className="absolute top-0 right-0 w-16 h-16 bg-amber-500/10 rounded-bl-full -z-0"></div>
                                <h3 className="text-lg font-bold text-amber-400 mb-4 border-b border-slate-700 pb-2 relative z-10">Fibonacci</h3>
                                <div className="space-y-1 relative z-10">
                                    <ColorRow label="R3" value={results.fibo.R3} type="R" />
                                    <ColorRow label="R2" value={results.fibo.R2} type="R" />
                                    <ColorRow label="R1" value={results.fibo.R1} type="R" />
                                    <ColorRow label="P" value={results.fibo.P} type="P" />
                                    <ColorRow label="S1" value={results.fibo.S1} type="S" />
                                    <ColorRow label="S2" value={results.fibo.S2} type="S" />
                                    <ColorRow label="S3" value={results.fibo.S3} type="S" />
                                </div>
                                <button onClick={() => copySystem('Fibonacci', results.fibo)} className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-700 text-sm rounded-lg flex justify-center items-center gap-2 transition text-slate-300">
                                    <ClipboardCopy size={16} /> 複製 (Fibo)
                                </button>
                            </div>
                        </div>
                    )}

                    <div className="bg-[#111827] rounded-2xl border border-slate-800 overflow-hidden mt-8 shadow-lg">
                        <div className="p-4 border-b border-slate-800 bg-slate-800/30 flex justify-between items-center">
                            <h3 className="font-bold text-slate-300">歷史計算紀錄</h3>
                        </div>
                        <table className="w-full text-left border-collapse">
                            <thead>
                                <tr className="bg-slate-800/50 text-slate-400 text-sm">
                                    <th className="p-3">日期</th>
                                    <th className="p-3">盤別</th>
                                    <th className="p-3">標的</th>
                                    <th className="p-3 font-mono-num">H / L / C</th>
                                    <th className="p-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-800/50">
                                {calcHistory.map(rec => {
                                    const hasFutures = epsData && epsData[rec.stockId]?.hasFutures;
                                    return (
                                    <React.Fragment key={rec.id}>
                                        <tr className="hover:bg-slate-800/20 transition">
                                            <td className="p-3 font-mono-num text-sm text-slate-400">{rec.date}</td>
                                            <td className="p-3 text-sm"><span className="bg-slate-800 px-2 py-1 rounded text-slate-300">{rec.session}</span></td>
                                            <td className="p-3 text-sm font-bold text-blue-400">
                                                <div className="flex items-center">
                                                    <FuturesBadge hasFutures={hasFutures} />
                                                    {rec.stockId} <span className="text-slate-400 font-normal ml-1">{rec.name}</span>
                                                </div>
                                            </td>
                                            <td className="p-3 text-sm font-mono-num text-slate-300">{rec.inputs.h} / {rec.inputs.l} / {rec.inputs.c}</td>
                                            <td className="p-3 text-center">
                                                <div className="flex justify-center gap-2">
                                                    <button onClick={() => setExpandedRowId(expandedRowId === rec.id ? null : rec.id)} className="p-1.5 bg-blue-600/20 text-blue-400 hover:bg-blue-600/40 rounded transition" title="查看數據"><Eye size={16} /></button>
                                                    <button onClick={() => { setH(rec.inputs.h); setL(rec.inputs.l); setC(rec.inputs.c); setSession(rec.session); setStockId(rec.stockId); setStockName(rec.name); }} className="p-1.5 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/40 rounded transition" title="載入參數"><Upload size={16} /></button>
                                                    <button onClick={() => setCalcHistory(calcHistory.filter(h => h.id !== rec.id))} className="p-1.5 bg-red-600/20 text-red-400 hover:bg-red-600/40 rounded transition" title="刪除"><Trash2 size={16} /></button>
                                                </div>
                                            </td>
                                        </tr>
                                        {expandedRowId === rec.id && (
                                            <tr className="bg-slate-900/50 border-l-4 border-blue-500 animate-fade-in-down">
                                                <td colSpan="5" className="p-4">
                                                    <div className="flex gap-4">
                                                        <div className="flex-1 bg-slate-900 p-3 rounded border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-2">
                                                                <span className="text-xs font-bold text-blue-400">CDP</span>
                                                                <button onClick={()=>copySystem('CDP', rec.results.cdp, rec)} className="text-slate-500 hover:text-white"><ClipboardCopy size={14}/></button>
                                                            </div>
                                                            <div className="grid grid-cols-5 text-xs text-center font-mono-num">
                                                                <div><div className="text-slate-500">AH</div><div className="text-red-400">{rec.results.cdp.AH}</div></div>
                                                                <div><div className="text-slate-500">NH</div><div className="text-red-400">{rec.results.cdp.NH}</div></div>
                                                                <div><div className="text-slate-500">CDP</div><div className="text-yellow-400">{rec.results.cdp.CDP}</div></div>
                                                                <div><div className="text-slate-500">NL</div><div className="text-emerald-400">{rec.results.cdp.NL}</div></div>
                                                                <div><div className="text-slate-500">AL</div><div className="text-emerald-400">{rec.results.cdp.AL}</div></div>
                                                            </div>
                                                        </div>
                                                        <div className="flex-1 bg-slate-900 p-3 rounded border border-slate-700/50">
                                                            <div className="flex justify-between items-center mb-2">
                                                                <span className="text-xs font-bold text-purple-400">Pivot</span>
                                                                <button onClick={()=>copySystem('Pivot', rec.results.pivot, rec)} className="text-slate-500 hover:text-white"><ClipboardCopy size={14}/></button>
                                                            </div>
                                                            <div className="grid grid-cols-5 text-xs text-center font-mono-num">
                                                                <div><div className="text-slate-500">R2</div><div className="text-red-400">{rec.results.pivot.R2}</div></div>
                                                                <div><div className="text-slate-500">R1</div><div className="text-red-400">{rec.results.pivot.R1}</div></div>
                                                                <div><div className="text-slate-500">P</div><div className="text-yellow-400">{rec.results.pivot.P}</div></div>
                                                                <div><div className="text-slate-500">S1</div><div className="text-emerald-400">{rec.results.pivot.S1}</div></div>
                                                                <div><div className="text-slate-500">S2</div><div className="text-emerald-400">{rec.results.pivot.S2}</div></div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </React.Fragment>
                                )})}
                                {calcHistory.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-500">無歷史紀錄</td></tr>}
                            </tbody>
                        </table>
                    </div>
                </div>
            );
        };

        // ==========================================
        // 5. 模組三：交易規劃與績效統計 (Plan & Dashboard)
        // ==========================================
        const PlanDashboard = ({ logs, setLogs, stockMap, setCustomStocks, epsData }) => {
            const [filterDate, setFilterDate] = useState('all');
            const [editingId, setEditingId] = useState(null);
            const [confirm, setConfirm] = useState({ show: false, action: null });
            
            const [planDate, setPlanDate] = useState(new Date().toISOString().split('T')[0]);
            const [planStockId, setPlanStockId] = useState('');
            const [planStockName, setPlanStockName] = useState('');
            const [alert, setAlert] = useState({ show: false, msg: '' });
            
            const [planFilters, setPlanFilters] = useState({ stock: '', status: 'all', futures: 'all' });
            const [planSort, setPlanSort] = useState({ key: 'id', direction: 'desc' });

            const handlePlanSort = (key) => {
                if (planSort.key === key) {
                    setPlanSort({ key, direction: planSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setPlanSort({ key, direction: 'desc' });
                }
            };

            const handleStockIdChange = (e) => {
                const val = e.target.value;
                setPlanStockId(val);
                
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setPlanStockName('');
                    return;
                }
                if (stockMap[trimmedVal]) {
                    setPlanStockName(stockMap[trimmedVal].name);
                }
            };

            const handleStockNameChange = (e) => {
                const val = e.target.value;
                setPlanStockName(val);
                
                const trimmedVal = val.trim();
                if (trimmedVal === '') {
                    setPlanStockId('');
                    return;
                }
                const foundId = Object.keys(stockMap).find(key => stockMap[key].name === trimmedVal);
                if (foundId) {
                    setPlanStockId(foundId);
                }
            };

            const isUnknownStock = planStockId.trim() && planStockName.trim() && !stockMap[planStockId.trim()];

            const stockIdsDatalist = useMemo(() => (
                <datalist id="plan-stock-ids-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={id}>{stockMap[id].name}</option>)}
                </datalist>
            ), [stockMap]);

            const stockNamesDatalist = useMemo(() => (
                <datalist id="plan-stock-names-list">
                    {Object.keys(stockMap).map(id => <option key={id} value={stockMap[id].name} />)}
                </datalist>
            ), [stockMap]);

            const handleAddIndependentPlan = () => {
                const sId = planStockId.trim();
                const sName = planStockName.trim();

                if (!sId || !sName) {
                    setAlert({ show: true, msg: '請填寫股號與名稱！' });
                    return;
                }
                if (!stockMap[sId]) {
                    setCustomStocks(prev => ({ ...prev, [sId]: { name: sName, industry: "自訂/手動新增" } }));
                }
                const newLog = {
                    id: Date.now().toString(),
                    date: planDate,
                    stockId: sId,
                    name: sName,
                    strategy: ['獨立規劃'],
                    subTags: [],
                    starred: false,
                    inPlan: true,
                    plan: { entry: '', stopLoss: '', trailing: '', exit: '', shares: '', warrantCode: '', warrantEntry: '', warrantShares: '', currentPrice: '' }
                };
                setLogs([...logs, newLog]);
                setPlanStockId('');
                setPlanStockName('');
            };

            const plannedLogs = useMemo(() => {
                return logs.filter(log => log.inPlan || (log.plan && log.plan.entry));
            }, [logs]);

            const filteredPlanLogs = useMemo(() => {
                let result = plannedLogs.slice(); 
                
                if (planFilters.stock) {
                    const kw = planFilters.stock.toLowerCase();
                    result = result.filter(l => l.stockId.toLowerCase().includes(kw) || l.name.toLowerCase().includes(kw));
                }
                if (planFilters.futures !== 'all') {
                    result = result.filter(l => {
                        const eps = epsData[l.stockId] || {};
                        if (planFilters.futures === 'yes') return eps.hasFutures;
                        return true;
                    });
                }
                if (planFilters.status !== 'all') {
                    result = result.filter(l => {
                        const p = l.plan || {};
                        const isOpen = p.entry && !p.exit;
                        const isClosed = p.entry && p.exit;
                        const isPlanning = !p.entry;
                        
                        if (planFilters.status === 'open') return isOpen;
                        if (planFilters.status === 'closed') return isClosed;
                        if (planFilters.status === 'planning') return isPlanning;
                        return true;
                    });
                }

                result.sort((a, b) => {
                    let valA, valB;
                    const pA = a.plan || {};
                    const pB = b.plan || {};

                    switch (planSort.key) {
                        case 'stock':
                            valA = a.stockId; valB = b.stockId; break;
                        case 'entry':
                            valA = parseFloat(pA.entry) || -999999; valB = parseFloat(pB.entry) || -999999; break;
                        case 'sl':
                            valA = parseFloat(pA.stopLoss) || (parseFloat(pA.entry)*0.95 || -999999);
                            valB = parseFloat(pB.stopLoss) || (parseFloat(pB.entry)*0.95 || -999999); break;
                        case 'exit':
                            valA = parseFloat(pA.currentPrice || pA.exit) || -999999;
                            valB = parseFloat(pB.currentPrice || pB.exit) || -999999; break;
                        case 'shares':
                            valA = parseFloat(pA.shares) || 0; valB = parseFloat(pB.shares) || 0; break;
                        case 'rr':
                            const getRR = (p) => {
                                if (!p.entry || !p.stopLoss || !p.exit) return -999999;
                                const risk = parseFloat(p.entry) - parseFloat(p.stopLoss);
                                const reward = parseFloat(p.exit) - parseFloat(p.entry);
                                if (risk <= 0) return -999999;
                                return reward / risk;
                            };
                            valA = getRR(pA); valB = getRR(pB); break;
                        case 'pnl':
                            const getPnl = (p) => {
                                const isOpen = p.entry && !p.exit;
                                if (p.entry && p.shares) {
                                    if (isOpen && p.currentPrice) return (parseFloat(p.currentPrice) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                    else if (!isOpen && p.exit) return (parseFloat(p.exit) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                }
                                return -9999999; 
                            };
                            valA = getPnl(pA); valB = getPnl(pB); break;
                        default: // 'id'
                            valA = parseInt(a.id); valB = parseInt(b.id); break;
                    }

                    if (valA < valB) return planSort.direction === 'asc' ? -1 : 1;
                    if (valA > valB) return planSort.direction === 'asc' ? 1 : -1;
                    return 0;
                });

                return result;
            }, [plannedLogs, planFilters, planSort]);

            const stats = useMemo(() => {
                let filtered = plannedLogs;
                if (filterDate === 'month') {
                    const monthAgo = new Date();
                    monthAgo.setMonth(monthAgo.getMonth() - 1);
                    filtered = plannedLogs.filter(l => new Date(l.date) >= monthAgo);
                }

                let totalTrades = 0;
                let closedTrades = 0;
                let winCount = 0;
                let totalProfit = 0;

                filtered.forEach(log => {
                    const p = log.plan || {};
                    const hasPlan = p.entry && p.shares;
                    if (hasPlan) totalTrades++;
                    
                    if (hasPlan && p.exit) {
                        closedTrades++;
                        const entry = parseFloat(p.entry);
                        const exit = parseFloat(p.exit);
                        const shares = parseFloat(p.shares) * 1000;
                        const pnl = (exit - entry) * shares;
                        totalProfit += pnl;
                        if (pnl > 0) winCount++;
                    }

                    if (p.warrantEntry && p.warrantExit && p.warrantShares) {
                        const wEntry = parseFloat(p.warrantEntry);
                        const wExit = parseFloat(p.warrantExit);
                        const wShares = parseFloat(p.warrantShares) * 1000;
                        const wPnl = (wExit - wEntry) * wShares;
                        totalProfit += wPnl;
                    }
                });

                return {
                    totalTrades,
                    closedTrades,
                    winRate: closedTrades > 0 ? ((winCount / closedTrades) * 100).toFixed(1) : 0,
                    totalProfit: Math.round(totalProfit)
                };
            }, [plannedLogs, filterDate]);

            const updatePlan = (id, field, value) => {
                setLogs(logs.map(log => {
                    if (log.id === id) {
                        let newPlan = { ...log.plan, [field]: value };
                        if (field === 'entry' && value) {
                            newPlan.stopLoss = (parseFloat(value) * 0.95).toFixed(2);
                        }
                        return { ...log, plan: newPlan };
                    }
                    return log;
                }));
            };

            const calculateRR = (p) => {
                if (!p.entry || !p.stopLoss || !p.exit) return '-';
                const risk = parseFloat(p.entry) - parseFloat(p.stopLoss);
                const reward = parseFloat(p.exit) - parseFloat(p.entry);
                if (risk <= 0) return '-';
                return (reward / risk).toFixed(2);
            };

            const StatCard = ({ title, value, unit, color }) => (
                <div className="bg-slate-900 border border-slate-700 p-5 rounded-2xl flex flex-col justify-center shadow-lg relative overflow-hidden">
                    <div className={`absolute -right-4 -bottom-4 w-20 h-20 bg-${color}-500/10 rounded-full blur-xl`}></div>
                    <div className="text-slate-400 text-sm mb-1">{title}</div>
                    <div className={`text-3xl font-bold font-mono-num text-${color}-400`}>
                        {value} <span className="text-base text-slate-500 ml-1">{unit}</span>
                    </div>
                </div>
            );

            return (
                <div className="animate-fade-in-up space-y-6">
                    <div className="flex justify-between items-end mb-4">
                        <h2 className="text-2xl font-title text-emerald-400 flex items-center gap-2"><LayoutDashboard /> 績效儀表板</h2>
                        <select value={filterDate} onChange={e=>setFilterDate(e.target.value)} className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm outline-none text-slate-300">
                            <option value="all">全部紀錄</option>
                            <option value="month">近一個月</option>
                        </select>
                    </div>
                    
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <StatCard title="總交易次數" value={stats.totalTrades} unit="筆" color="blue" />
                        <StatCard title="已平倉次數" value={stats.closedTrades} unit="筆" color="indigo" />
                        <StatCard title="勝率" value={stats.winRate} unit="%" color="emerald" />
                        <StatCard title="總累積獲利" value={stats.totalProfit.toLocaleString()} unit="TWD" color="yellow" />
                    </div>

                    <div className="bg-[#111827] p-5 rounded-2xl border border-slate-800 shadow-lg mb-6">
                        <h3 className="text-lg font-bold text-slate-300 mb-4 flex items-center gap-2"><Target size={18} className="text-blue-400" /> 新增交易標的</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <input type="date" value={planDate} onChange={e => setPlanDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm font-mono-num focus:border-blue-500 outline-none" />
                            </div>
                            <div className="relative">
                                <input type="text" list="plan-stock-ids-list" value={planStockId} onChange={handleStockIdChange} onKeyDown={e => { if (e.key === 'Enter') handleAddIndependentPlan(); }} placeholder="股號 (可搜尋)" className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm font-mono-num focus:border-blue-500 outline-none" />
                            </div>
                            <div className="relative">
                                <input type="text" list="plan-stock-names-list" value={planStockName} onChange={handleStockNameChange} onKeyDown={e => { if (e.key === 'Enter') handleAddIndependentPlan(); }} placeholder="名稱 (可反查)" className={`w-full bg-slate-900 border ${isUnknownStock ? 'border-yellow-500/50' : 'border-slate-700'} rounded-lg p-2 text-sm focus:border-blue-500 outline-none ${stockMap[planStockId] ? 'text-green-400' : 'text-slate-200'}`} />
                                {stockIdsDatalist}
                                {stockNamesDatalist}
                            </div>
                            <button onClick={handleAddIndependentPlan} className="bg-blue-600 hover:bg-blue-500 text-white rounded-lg p-2 text-sm font-bold flex items-center justify-center gap-2 transition">
                                <PlusCircle size={16} /> 加入規劃清單
                            </button>
                        </div>
                    </div>

                    <div className="bg-[#111827] rounded-2xl border border-slate-800 overflow-hidden shadow-lg">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left border-collapse min-w-[1000px]">
                                <thead>
                                    <tr className="bg-slate-800/50 text-slate-400 text-sm tracking-wider">
                                        <th className="p-3 align-top min-w-[180px]">
                                            <div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('stock')}>標的 / 狀態 <SortIcon sortKey="stock" currentSort={planSort} /></div>
                                            <div className="flex flex-col gap-1.5">
                                                <input type="text" placeholder="搜尋代號/名稱" value={planFilters.stock} onChange={e => setPlanFilters({...planFilters, stock: e.target.value})} className="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs outline-none focus:border-blue-500" />
                                                <div className="flex gap-1.5">
                                                    <select value={planFilters.status} onChange={e => setPlanFilters({...planFilters, status: e.target.value})} className="w-1/2 bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                        <option value="all">全部狀態</option>
                                                        <option value="open">持倉中</option>
                                                        <option value="closed">已平倉</option>
                                                        <option value="planning">規劃中</option>
                                                    </select>
                                                    <select value={planFilters.futures} onChange={e => setPlanFilters({...planFilters, futures: e.target.value})} className="w-1/2 bg-slate-900 border border-slate-700 rounded px-1 py-1 text-xs outline-none focus:border-blue-500">
                                                        <option value="all">全部標的</option>
                                                        <option value="yes">僅有股期</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('entry')}>進場價 <SortIcon sortKey="entry" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('sl')}>停損價 <SortIcon sortKey="sl" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('exit')}>現價 / 出場 <SortIcon sortKey="exit" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('shares')}>張數 <SortIcon sortKey="shares" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('rr')}>風報比 <SortIcon sortKey="rr" currentSort={planSort} /></div></th>
                                        <th className="p-3 align-top"><div className="mb-2 flex items-center gap-1 cursor-pointer hover:text-blue-400 select-none" onClick={() => handlePlanSort('pnl')}>預估/實現損益 <SortIcon sortKey="pnl" currentSort={planSort} /></div></th>
                                        <th className="p-3 text-center align-top">
                                            <div className="mb-2">操作</div>
                                            <button onClick={() => { setPlanFilters({stock: '', status: 'all', futures: 'all'}); setPlanSort({key: 'id', direction: 'desc'}); }} className="text-xs text-slate-500 hover:text-slate-300 underline transition">還原預設</button>
                                        </th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                    {filteredPlanLogs.map(log => {
                                        const p = log.plan || {};
                                        const isEditing = editingId === log.id;
                                        const isOpen = p.entry && !p.exit;
                                        
                                        let pnlValue = null;
                                        if (p.entry && p.shares) {
                                            if (isOpen && p.currentPrice) {
                                                pnlValue = (parseFloat(p.currentPrice) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                            } else if (!isOpen && p.exit) {
                                                pnlValue = (parseFloat(p.exit) - parseFloat(p.entry)) * parseFloat(p.shares) * 1000;
                                            }
                                        }

                                        const hasFutures = epsData && epsData[log.stockId]?.hasFutures;

                                        return (
                                            <React.Fragment key={log.id}>
                                                <tr className={`hover:bg-slate-800/20 transition ${isOpen ? 'bg-blue-900/5' : ''}`}>
                                                    <td className="p-3">
                                                        <div className="font-bold text-slate-200 flex items-center">
                                                            <FuturesBadge hasFutures={hasFutures} />
                                                            {log.stockId} {log.name}
                                                        </div>
                                                        <div className="text-xs mt-1">
                                                            {isOpen ? (
                                                                <span className="bg-blue-500/20 text-blue-400 px-2 py-0.5 rounded flex w-max items-center gap-1">
                                                                    <span className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-pulse"></span> 持倉中
                                                                </span>
                                                            ) : p.entry ? (
                                                                <span className="bg-slate-700 text-slate-400 px-2 py-0.5 rounded">已平倉</span>
                                                            ) : (
                                                                <span className="bg-slate-800 text-slate-500 px-2 py-0.5 rounded">規劃中</span>
                                                            )}
                                                        </div>
                                                    </td>
                                                    <td className="p-3 font-mono-num text-slate-300">{p.entry || '-'}</td>
                                                    <td className="p-3 font-mono-num text-red-400/80">{p.stopLoss || (p.entry ? (parseFloat(p.entry) * 0.95).toFixed(2) : '-')}</td>
                                                    <td className="p-3 font-mono-num">
                                                        {isOpen ? (
                                                            <div className="relative w-24">
                                                                <input type="number" step="any" placeholder="輸入現價" value={p.currentPrice || ''} onChange={(e) => updatePlan(log.id, 'currentPrice', e.target.value)} className="w-full bg-slate-900 border border-slate-600 rounded px-2 py-1 text-sm text-yellow-400 italic outline-none focus:border-yellow-500" />
                                                            </div>
                                                        ) : (
                                                            <span className="text-emerald-400">{p.exit || '-'}</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3 font-mono-num text-slate-300">{p.shares || '-'}</td>
                                                    <td className="p-3 font-mono-num text-purple-400">{calculateRR(p)}</td>
                                                    <td className="p-3 font-mono-num">
                                                        {pnlValue !== null ? (
                                                            <span className={pnlValue >= 0 ? 'text-emerald-400' : 'text-red-400'}>
                                                                {pnlValue > 0 ? '+' : ''}{Math.round(pnlValue).toLocaleString()}
                                                            </span>
                                                        ) : '-'}
                                                    </td>
                                                    <td className="p-3 text-center">
                                                        <div className="flex justify-center items-center gap-2">
                                                            <button onClick={() => setEditingId(isEditing ? null : log.id)} className={`px-3 py-1 rounded text-sm transition ${isEditing ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400 hover:bg-slate-700'}`}>
                                                                {isEditing ? '完成' : '規劃'}
                                                            </button>
                                                            <button onClick={() => setConfirm({ 
                                                                show: true, 
                                                                action: () => setLogs(logs.map(l => l.id === log.id ? { ...l, inPlan: false, plan: { ...l.plan, entry: '', stopLoss: '', exit: '' } } : l)) 
                                                            })} className="p-1.5 text-slate-500 hover:text-red-400 hover:bg-red-500/20 rounded transition" title="移出規劃清單">
                                                                <X size={18} />
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                                
                                                {isEditing && (
                                                    <tr className="bg-slate-900/80 border-l-4 border-blue-500 animate-fade-in-down shadow-inner">
                                                        <td colSpan="8" className="p-6">
                                                            <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">進場價 (Entry)</label>
                                                                    <input type="number" step="any" value={p.entry || ''} onChange={e => updatePlan(log.id, 'entry', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num outline-none focus:border-blue-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">停損價 (SL) <span className="text-[10px] text-slate-600">自動95折</span></label>
                                                                    <input type="number" step="any" value={p.stopLoss || ''} onChange={e => updatePlan(log.id, 'stopLoss', e.target.value)} placeholder={p.entry ? (parseFloat(p.entry) * 0.95).toFixed(2) : ''} className="w-full bg-slate-950 border border-red-900/50 rounded p-2 text-sm font-mono-num text-red-400 outline-none focus:border-red-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">移動停利 (Trailing)</label>
                                                                    <input type="number" step="any" value={p.trailing || ''} onChange={e => updatePlan(log.id, 'trailing', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num text-yellow-400 outline-none focus:border-yellow-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">出場價 (Exit)</label>
                                                                    <input type="number" step="any" value={p.exit || ''} onChange={e => updatePlan(log.id, 'exit', e.target.value)} className="w-full bg-slate-950 border border-emerald-900/50 rounded p-2 text-sm font-mono-num text-emerald-400 outline-none focus:border-emerald-500" />
                                                                </div>
                                                                <div>
                                                                    <label className="block text-xs text-slate-500 mb-1">張數</label>
                                                                    <input type="number" value={p.shares || ''} onChange={e => updatePlan(log.id, 'shares', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num outline-none focus:border-blue-500" />
                                                                </div>
                                                                
                                                                <div className="col-span-2 md:col-span-5 pt-3 mt-1 border-t border-slate-800/50">
                                                                    <span className="text-xs font-bold text-slate-500 mb-2 block">權證擴充設定</span>
                                                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                                                        <input type="text" placeholder="權證代號" value={p.warrantCode || ''} onChange={e => updatePlan(log.id, 'warrantCode', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                        <input type="number" step="any" placeholder="買進價" value={p.warrantEntry || ''} onChange={e => updatePlan(log.id, 'warrantEntry', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                        <input type="number" step="any" placeholder="賣出價" value={p.warrantExit || ''} onChange={e => updatePlan(log.id, 'warrantExit', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                        <input type="number" placeholder="張數" value={p.warrantShares || ''} onChange={e => updatePlan(log.id, 'warrantShares', e.target.value)} className="w-full bg-slate-950 border border-slate-700 rounded p-2 text-sm font-mono-num" />
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                )}
                                            </React.Fragment>
                                        )
                                    })}
                                    {plannedLogs.length === 0 && <tr><td colSpan="8" className="p-8 text-center text-slate-500">尚無規劃紀錄（請從上方新增，或至選股日誌中點擊「🎯加入規劃」）</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <AlertModal isOpen={alert.show} message={alert.msg} onClose={() => setAlert({ show: false, msg: '' })} />
                    <ConfirmModal isOpen={confirm.show} title="確認移出" message="確定要將此標的移出規劃清單嗎？（選股日誌中的原紀錄不會被刪除）" 
                        onConfirm={() => { confirm.action(); setConfirm({ show: false, action: null }); }} 
                        onCancel={() => setConfirm({ show: false, action: null })} />
                </div>
            );
        };

        // ==========================================
        // 0. 主應用程式 (App)
        // ==========================================
        const App = () => {
            const [activeTab, setActiveTab] = useState('journal');
            const [appAlert, setAppAlert] = useState({ show: false, msg: '' });
            
            const [logs, setLogs] = useLocalStorage('ryan_stock_logs', []);
            const [calcHistory, setCalcHistory] = useLocalStorage('ryan_calc_history', []);
            const [epsData, setEpsData] = useLocalStorage('ryan_eps_data', {});
            const [customStocks, setCustomStocks] = useLocalStorage('ryan_custom_stocks', {});

            const stockMap = useMemo(() => {
                return { ...STATIC_STOCK_DB, ...customStocks };
            }, [customStocks]);

            // 匯出全部資料 (改為 Excel 格式)
            const handleExportData = () => {
                const wb = XLSX.utils.book_new();

                // 1. 選股與規劃紀錄
                const logsSheetData = logs.map(l => ({
                    '系統ID(勿改)': l.id,
                    '日期': l.date,
                    '股號': l.stockId,
                    '名稱': l.name,
                    '主策略': Array.isArray(l.strategy) ? l.strategy.join(',') : (l.strategy || ''),
                    '進階標籤': Array.isArray(l.subTags) ? l.subTags.join(',') : '',
                    '追蹤標記': l.starred ? 'Y' : 'N',
                    '加入規劃': l.inPlan ? 'Y' : 'N',
                    '進場價': l.plan?.entry || '',
                    '停損價': l.plan?.stopLoss || '',
                    '移動停利': l.plan?.trailing || '',
                    '出場價': l.plan?.exit || '',
                    '張數': l.plan?.shares || '',
                    '現價': l.plan?.currentPrice || '',
                    '權證代號': l.plan?.warrantCode || '',
                    '權證買進': l.plan?.warrantEntry || '',
                    '權證賣出': l.plan?.warrantExit || '',
                    '權證張數': l.plan?.warrantShares || ''
                }));
                const wsLogs = XLSX.utils.json_to_sheet(logsSheetData);
                XLSX.utils.book_append_sheet(wb, wsLogs, "選股與規劃");

                // 2. 支撐壓力紀錄
                const calcSheetData = calcHistory.map(c => ({
                    '系統ID(勿改)': c.id,
                    '日期': c.date,
                    '盤別': c.session,
                    '股號': c.stockId,
                    '名稱': c.name,
                    'H': c.inputs.h,
                    'L': c.inputs.l,
                    'C': c.inputs.c,
                    '結果快取(勿改)': JSON.stringify(c.results)
                }));
                const wsCalc = XLSX.utils.json_to_sheet(calcSheetData);
                XLSX.utils.book_append_sheet(wb, wsCalc, "支撐壓力紀錄");

                // 3. EPS與股期快取
                const epsSheetData = Object.keys(epsData).map(id => ({
                    '股號': id,
                    '25EPS': epsData[id].eps25,
                    '26EPS': epsData[id].eps26,
                    '成長率': epsData[id].epsGrowth,
                    '有股期': epsData[id].hasFutures ? 'Y' : 'N'
                }));
                const wsEps = XLSX.utils.json_to_sheet(epsSheetData);
                XLSX.utils.book_append_sheet(wb, wsEps, "EPS與股期快取");

                // 4. 自訂股票快取
                const customStocksData = Object.keys(customStocks).map(id => ({
                    '股號': id,
                    '名稱': customStocks[id].name,
                    '產業': customStocks[id].industry
                }));
                const wsCustom = XLSX.utils.json_to_sheet(customStocksData);
                XLSX.utils.book_append_sheet(wb, wsCustom, "自訂股票快取");

                XLSX.writeFile(wb, `萊恩手札備份_${new Date().toISOString().split('T')[0]}.xlsx`);
            };

            // 匯入全部資料 (讀取 Excel 格式)
            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });

                        // 1. Logs
                        if (wb.Sheets["選股與規劃"]) {
                            const logsData = XLSX.utils.sheet_to_json(wb.Sheets["選股與規劃"]);
                            const newLogs = logsData.map(row => ({
                                id: row['系統ID(勿改)']?.toString() || Date.now().toString() + Math.random(),
                                date: row['日期'] || '',
                                stockId: row['股號']?.toString() || '',
                                name: row['名稱'] || '',
                                strategy: row['主策略'] ? row['主策略'].toString().split(',') : [],
                                subTags: row['進階標籤'] ? row['進階標籤'].toString().split(',') : [],
                                starred: row['追蹤標記'] === 'Y',
                                inPlan: row['加入規劃'] === 'Y',
                                plan: {
                                    entry: row['進場價']?.toString() || '',
                                    stopLoss: row['停損價']?.toString() || '',
                                    trailing: row['移動停利']?.toString() || '',
                                    exit: row['出場價']?.toString() || '',
                                    shares: row['張數']?.toString() || '',
                                    currentPrice: row['現價']?.toString() || '',
                                    warrantCode: row['權證代號']?.toString() || '',
                                    warrantEntry: row['權證買進']?.toString() || '',
                                    warrantExit: row['權證賣出']?.toString() || '',
                                    warrantShares: row['權證張數']?.toString() || ''
                                }
                            }));
                            setLogs(newLogs);
                        }

                        // 2. Calc History
                        if (wb.Sheets["支撐壓力紀錄"]) {
                            const calcData = XLSX.utils.sheet_to_json(wb.Sheets["支撐壓力紀錄"]);
                            const newCalcHistory = calcData.map(row => ({
                                id: row['系統ID(勿改)']?.toString() || Date.now().toString() + Math.random(),
                                date: row['日期'] || '',
                                session: row['盤別'] || '日盤',
                                stockId: row['股號']?.toString() || '',
                                name: row['名稱'] || '',
                                inputs: {
                                    h: row['H']?.toString() || '',
                                    l: row['L']?.toString() || '',
                                    c: row['C']?.toString() || ''
                                },
                                results: row['結果快取(勿改)'] ? JSON.parse(row['結果快取(勿改)']) : null
                            }));
                            setCalcHistory(newCalcHistory);
                        }

                        // 3. EPS快取
                        if (wb.Sheets["EPS與股期快取"]) {
                            const epsDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["EPS與股期快取"]);
                            let newEpsData = {};
                            epsDataRaw.forEach(row => {
                                if (row['股號']) {
                                    newEpsData[row['股號'].toString()] = {
                                        eps25: row['25EPS'] || '-',
                                        eps26: row['26EPS'] || '-',
                                        epsGrowth: row['成長率'] || '-',
                                        hasFutures: row['有股期'] === 'Y'
                                    };
                                }
                            });
                            setEpsData(newEpsData);
                        }

                        // 4. Custom Stocks快取
                        if (wb.Sheets["自訂股票快取"]) {
                            const customDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["自訂股票快取"]);
                            let newCustomStocks = {};
                            customDataRaw.forEach(row => {
                                if (row['股號']) {
                                    newCustomStocks[row['股號'].toString()] = {
                                        name: row['名稱'] || '',
                                        industry: row['產業'] || '匯入備份'
                                    };
                                }
                            });
                            setCustomStocks(newCustomStocks);
                        }

                        setAppAlert({ show: true, msg: 'Excel 備份資料已成功匯入還原！' });
                    } catch (err) {
                        console.error(err);
                        setAppAlert({ show: true, msg: '匯入失敗：檔案格式錯誤或損毀。請確保使用系統匯出的 Excel 檔案。' });
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null; // 清空選擇，允許重複匯入同檔名
            };

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <header className="bg-[#111827] border-b border-slate-800 sticky top-0 z-40 shadow-md">
                        <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/30">
                                    <TrendingUp size={20} className="text-white" />
                                </div>
                                <h1 className="text-2xl font-title tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                                    萊恩交易手札
                                </h1>
                            </div>
                            
                            {/* 新增：資料匯入/匯出按鈕區塊 (更新 accept 為 .xlsx, .xls) */}
                            <div className="flex items-center gap-3">
                                <label className="cursor-pointer flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-slate-200 transition bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                    <Upload size={14} /> 匯入備份
                                    <input type="file" accept=".xlsx, .xls" onChange={handleImportData} className="hidden" />
                                </label>
                                <button onClick={handleExportData} className="flex items-center gap-1.5 text-xs font-bold text-slate-400 hover:text-slate-200 transition bg-slate-800/50 hover:bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
                                    <Download size={14} /> 匯出備份
                                </button>
                            </div>
                        </div>
                        {/* Tabs */}
                        <div className="max-w-7xl mx-auto px-4 flex gap-6 text-sm font-medium">
                            <button onClick={() => setActiveTab('journal')} className={`py-3 border-b-2 transition ${activeTab === 'journal' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                模組一：選股日誌
                            </button>
                            <button onClick={() => setActiveTab('calculator')} className={`py-3 border-b-2 transition ${activeTab === 'calculator' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                模組二：支撐壓力
                            </button>
                            <button onClick={() => setActiveTab('plan')} className={`py-3 border-b-2 transition ${activeTab === 'plan' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>
                                模組三：交易規劃
                            </button>
                        </div>
                    </header>

                    {/* Main Content */}
                    <main className="max-w-7xl mx-auto px-4 mt-8">
                        {activeTab === 'journal' && (
                            <StockJournal logs={logs} setLogs={setLogs} epsData={epsData} setEpsData={setEpsData} customStocks={customStocks} setCustomStocks={setCustomStocks} stockMap={stockMap} />
                        )}
                        {activeTab === 'calculator' && (
                            <CalculatorModule calcHistory={calcHistory} setCalcHistory={setCalcHistory} stockMap={stockMap} setCustomStocks={setCustomStocks} epsData={epsData} />
                        )}
                        {activeTab === 'plan' && (
                            <PlanDashboard logs={logs} setLogs={setLogs} stockMap={stockMap} setCustomStocks={setCustomStocks} epsData={epsData} />
                        )}
                    </main>

                    <AlertModal isOpen={appAlert.show} message={appAlert.msg} onClose={() => setAppAlert({ show: false, msg: '' })} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
