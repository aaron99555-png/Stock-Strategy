                    - 最終出場：${p.exit}
                    - 原設停損：${p.stopLoss}
                    - 佈局理由：${allTags || '無特殊標籤'}
                    - 最終損益：${pnl > 0 ? '實現獲利' : '認列虧損'} ${pnl ? Math.abs(Math.round(pnl)) + '元' : '未知'}
                    - 實際風報比 (RR)：${rr}
                    
                    請以專業交易心理教練的身份，用大約 150 字幫我做盤後檢討，針對我的執行紀律給予客觀回饋、改進建議或鼓勵。請使用繁體中文。`;
                }

                const result = await generateText(prompt, "你是一位經驗豐富的金融交易心理教練，專門幫助主觀交易者建立紀律與穩定的心態。");
                setAiModal(prev => ({ ...prev, loading: false, content: result }));
            };

            const handleExportData = () => {
                const wb = XLSX.utils.book_new();

                const logsSheetData = logs.map(l => ({
                    '系統ID(勿改)': l.id,
                    '日期': l.date,
                    '股號': l.stockId,
                    '名稱': l.name,
                    '主策略': Array.isArray(l.strategy) ? l.strategy.join(',') : (l.strategy || ''),
                    '進階標籤': Array.isArray(l.subTags) ? l.subTags.join(',') : '',
                    '追蹤標記': l.starred ? 'Y' : 'N',
                    '加入規劃': l.inPlan ? 'Y' : 'N',
                    '進場價': l.plan?.entry || '',
                    '停損價': l.plan?.stopLoss || '',
                    '移動停利': l.plan?.trailing || '',
                    '出場價': l.plan?.exit || '',
                    '張數': l.plan?.shares || '',
                    '現價': l.plan?.currentPrice || '',
                    '權證代號': l.plan?.warrantCode || '',
                    '權證買進': l.plan?.warrantEntry || '',
                    '權證賣出': l.plan?.warrantExit || '',
                    '權證張數': l.plan?.warrantShares || ''
                }));
                const wsLogs = XLSX.utils.json_to_sheet(logsSheetData);
                XLSX.utils.book_append_sheet(wb, wsLogs, "選股與規劃");

                const calcSheetData = calcHistory.map(c => ({
                    '系統ID(勿改)': c.id,
                    '日期': c.date,
                    '盤別': c.session,
                    '股號': c.stockId,
                    '名稱': c.name,
                    'H': c.inputs.h,
                    'L': c.inputs.l,
                    'C': c.inputs.c,
                    '結果快取(勿改)': JSON.stringify(c.results)
                }));
                const wsCalc = XLSX.utils.json_to_sheet(calcSheetData);
                XLSX.utils.book_append_sheet(wb, wsCalc, "支撐壓力紀錄");

                const epsSheetData = Object.keys(epsData).map(id => ({
                    '股號': id,
                    '25EPS': epsData[id].eps25,
                    '26EPS': epsData[id].eps26,
                    '成長率': epsData[id].epsGrowth,
                    '有股期': epsData[id].hasFutures ? 'Y' : 'N'
                }));
                const wsEps = XLSX.utils.json_to_sheet(epsSheetData);
                XLSX.utils.book_append_sheet(wb, wsEps, "EPS與股期快取");

                const customStocksData = Object.keys(customStocks).map(id => ({
                    '股號': id,
                    '名稱': customStocks[id].name,
                    '產業': customStocks[id].industry
                }));
                const wsCustom = XLSX.utils.json_to_sheet(customStocksData);
                XLSX.utils.book_append_sheet(wb, wsCustom, "自訂股票快取");

                const forbiddenSheetData = forbiddenStocks.map(f => ({
                    '股號': f.id,
                    '名稱': f.name
                }));
                const wsForbidden = XLSX.utils.json_to_sheet(forbiddenSheetData);
                XLSX.utils.book_append_sheet(wb, wsForbidden, "佳佳持股黑名單");

                XLSX.writeFile(wb, `萊恩手札備份_${getTodayLocal()}.xlsx`);
            };

            const handleImportData = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const bstr = evt.target.result;
                        const wb = XLSX.read(bstr, { type: 'binary' });

                        if (wb.Sheets["選股與規劃"]) {
                            const logsData = XLSX.utils.sheet_to_json(wb.Sheets["選股與規劃"]);
                            const newLogs = logsData.map(row => ({
                                id: row['系統ID(勿改)']?.toString() || Date.now().toString() + Math.random(),
                                date: row['日期'] || '',
                                stockId: row['股號']?.toString() || '',
                                name: row['名稱'] || '',
                                strategy: row['主策略'] ? row['主策略'].toString().split(',') : [],
                                subTags: row['進階標籤'] ? row['進階標籤'].toString().split(',') : [],
                                starred: row['追蹤標記'] === 'Y',
                                inPlan: row['加入規劃'] === 'Y',
                                plan: {
                                    entry: row['進場價']?.toString() || '',
                                    stopLoss: row['停損價']?.toString() || '',
                                    trailing: row['移動停利']?.toString() || '',
                                    exit: row['出場價']?.toString() || '',
                                    shares: row['張數']?.toString() || '',
                                    currentPrice: row['現價']?.toString() || '',
                                    warrantCode: row['權證代號']?.toString() || '',
                                    warrantEntry: row['權證買進']?.toString() || '',
                                    warrantExit: row['權證賣出']?.toString() || '',
                                    warrantShares: row['權證張數']?.toString() || ''
                                }
                            }));
                            setLogs(newLogs);
                        }

                        if (wb.Sheets["支撐壓力紀錄"]) {
                            const calcData = XLSX.utils.sheet_to_json(wb.Sheets["支撐壓力紀錄"]);
                            const newCalcHistory = calcData.map(row => ({
                                id: row['系統ID(勿改)']?.toString() || Date.now().toString() + Math.random(),
                                date: row['日期'] || '',
                                session: row['盤別'] || '日盤',
                                stockId: row['股號']?.toString() || '',
                                name: row['名稱'] || '',
                                inputs: {
                                    h: row['H']?.toString() || '',
                                    l: row['L']?.toString() || '',
                                    c: row['C']?.toString() || ''
                                },
                                results: row['結果快取(勿改)'] ? JSON.parse(row['結果快取(勿改)']) : null
                            }));
                            setCalcHistory(newCalcHistory);
                        }

                        if (wb.Sheets["EPS與股期快取"]) {
                            const epsDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["EPS與股期快取"]);
                            let newEpsData = {};
                            epsDataRaw.forEach(row => {
                                if (row['股號']) {
                                    newEpsData[row['股號'].toString()] = {
                                        eps25: row['25EPS'] || '-',
                                        eps26: row['26EPS'] || '-',
                                        epsGrowth: row['成長率'] || '-',
                                        hasFutures: row['有股期'] === 'Y'
                                    };
                                }
                            });
                            setEpsData(newEpsData);
                        }

                        if (wb.Sheets["自訂股票快取"]) {
                            const customDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["自訂股票快取"]);
                            let newCustomStocks = {};
                            customDataRaw.forEach(row => {
                                if (row['股號']) {
                                    newCustomStocks[row['股號'].toString()] = {
                                        name: row['名稱'] || '',
                                        industry: row['產業'] || '匯入備份'
                                    };
                                }
                            });
                            setCustomStocks(newCustomStocks);
                        }

                        if (wb.Sheets["佳佳持股黑名單"]) {
                            const forbiddenDataRaw = XLSX.utils.sheet_to_json(wb.Sheets["佳佳持股黑名單"]);
                            let newForbiddenStocks = [];
                            forbiddenDataRaw.forEach(row => {
                                if (row['股號'] && row['名稱']) {
                                    newForbiddenStocks.push({ id: row['股號'].toString(), name: row['名稱'] });
                                }
                            });
                            setForbiddenStocks(newForbiddenStocks.length > 0 ? newForbiddenStocks : DEFAULT_FORBIDDEN);
                        }

                        setAppAlert({ show: true, msg: '✅ Excel 備份資料已成功無痛還原！' });
                    } catch (err) {
                        console.error(err);
                        setAppAlert({ show: true, msg: '❌ 匯入失敗：檔案格式錯誤或損毀，請確保使用系統匯出的備份檔。' });
                    }
                };
                reader.readAsBinaryString(file);
                e.target.value = null; 
            };

            if (!isAppReady) {
                 return (
                     <div className="min-h-screen flex flex-col items-center justify-center bg-[#050A15] text-blue-400">
                          <CloudCog size={64} className="animate-spin mb-6" />
                          <h2 className="text-xl md:text-2xl font-bold tracking-widest animate-pulse px-4 text-center">系統初始化中，正在與雲端同步連線...</h2>
                     </div>
                 )
            }

            return (
                <div className="min-h-screen pb-20 selection:bg-blue-500/30">
                    {/* Header - 響應式佈局調整 */}
                    <header className="bg-[#050A15]/80 backdrop-blur-xl border-b border-slate-800/80 sticky top-0 z-40 shadow-[0_4px_30px_rgba(0,0,0,0.5)]">
                        <div className="max-w-7xl mx-auto px-4 min-h-[5rem] py-3 flex flex-col md:flex-row items-center justify-between gap-3 md:gap-4">
                            <div className="flex items-center gap-3 md:gap-4 group w-full md:w-auto justify-center md:justify-start">
                                <div className="w-8 h-8 md:w-10 md:h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-[0_0_20px_rgba(59,130,246,0.4)] group-hover:shadow-[0_0_25px_rgba(59,130,246,0.6)] transition-all transform group-hover:scale-105 shrink-0">
                                    <TrendingUp className="w-5 h-5 md:w-6 md:h-6 text-white" />
                                </div>
                                <h1 className="text-xl md:text-3xl font-title tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-indigo-400 to-emerald-400 drop-shadow-sm flex items-center gap-2">
                                    萊恩交易手札 <span className="flex items-center gap-1 text-[9px] md:text-[10px] bg-emerald-500/20 text-emerald-400 px-2 py-0.5 md:py-1 rounded-full border border-emerald-500/30 shrink-0"><CloudLightning size={12} /> <span className="hidden sm:inline">雲端連線中</span></span>
                                </h1>
                            </div>
                            
                            <div className="flex flex-wrap items-center justify-center gap-2 w-full md:w-auto">
                                <label className="cursor-pointer flex items-center gap-1.5 md:gap-2 text-xs md:text-sm font-bold text-slate-300 hover:text-white transition-all bg-slate-800/50 hover:bg-slate-700/80 px-3 md:px-4 py-2 rounded-xl border border-slate-700/80 shadow-inner hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] shrink-0">
                                    <Upload size={14} className="md:w-4 md:h-4 text-blue-400" /> 匯入
                                    <input type="file" accept=".xlsx, .xls" onChange={handleImportData} className="hidden" />
                                </label>
                                <button onClick={handleExportData} className="flex items-center gap-1.5 md:gap-2 text-xs md:text-sm font-bold text-slate-300 hover:text-white transition-all bg-slate-800/50 hover:bg-slate-700/80 px-3 md:px-4 py-2 rounded-xl border border-slate-700/80 shadow-inner hover:shadow-[0_0_15px_rgba(255,255,255,0.1)] shrink-0">
                                    <Download size={14} className="md:w-4 md:h-4 text-emerald-400" /> 匯出
                                </button>
                                <div className="w-[1px] h-5 md:h-6 bg-slate-700/80 mx-0.5 md:mx-1 hidden sm:block"></div>
                                <button onClick={() => {
                                    const currentKey = window.localStorage.getItem('ryan_gemini_api_key') || '';
                                    const key = window.prompt('【獨立網頁版專屬】\n請輸入您的 Google Gemini API Key 以啟用 AI 教練功能：\n(金鑰將安全地儲存於您的瀏覽器本地端，不會外洩)', currentKey);
                                    if (key !== null) {
                                        window.localStorage.setItem('ryan_gemini_api_key', key.trim());
                                        alert('🔑 API 金鑰已成功儲存！AI 功能已為您準備就緒。');
                                        window.location.reload(); // 重新載入以套用金鑰
                                    }
                                }} className="flex items-center gap-1.5 md:gap-2 text-xs md:text-sm font-bold text-slate-300 hover:text-white transition-all bg-purple-900/20 hover:bg-purple-900/40 px-3 md:px-4 py-2 rounded-xl border border-purple-700/50 shadow-inner hover:shadow-[0_0_15px_rgba(168,85,247,0.2)] shrink-0">
                                    <Key size={14} className="md:w-4 md:h-4 text-purple-400" /> 金鑰
                                </button>
                            </div>
                        </div>
                        
                        {/* Tabs - 響應式優化 */}
                        <div className="max-w-7xl mx-auto px-2 md:px-4 flex flex-nowrap md:flex-wrap gap-x-1 md:gap-x-2 gap-y-1.5 text-xs md:text-sm font-bold pb-3 mt-1 md:mt-0 overflow-x-auto custom-scrollbar">
                            <button onClick={() => setActiveTab('journal')} className={`shrink-0 py-1.5 md:py-2 px-3 md:px-4 rounded-lg transition-all duration-300 flex items-center gap-1.5 md:gap-2 ${activeTab === 'journal' ? 'bg-blue-600/20 text-blue-400 shadow-[inset_0_-2px_0_0_#3b82f6]' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}>
                                <FileText size={14} className="md:w-4 md:h-4" /> <span className="tracking-widest">選股日誌</span>
                            </button>
                            <button onClick={() => setActiveTab('calculator')} className={`shrink-0 py-1.5 md:py-2 px-3 md:px-4 rounded-lg transition-all duration-300 flex items-center gap-1.5 md:gap-2 ${activeTab === 'calculator' ? 'bg-indigo-600/20 text-indigo-400 shadow-[inset_0_-2px_0_0_#6366f1]' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}>
                                <Calculator size={14} className="md:w-4 md:h-4" /> <span className="tracking-widest">支撐壓力</span>
                            </button>
                            <button onClick={() => setActiveTab('plan')} className={`shrink-0 py-1.5 md:py-2 px-3 md:px-4 rounded-lg transition-all duration-300 flex items-center gap-1.5 md:gap-2 ${activeTab === 'plan' ? 'bg-emerald-600/20 text-emerald-400 shadow-[inset_0_-2px_0_0_#10b981]' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}>
                                <LayoutDashboard size={14} className="md:w-4 md:h-4" /> <span className="tracking-widest">交易規劃</span>
                            </button>
                            <button onClick={() => setActiveTab('watchlist')} className={`shrink-0 py-1.5 md:py-2 px-3 md:px-4 rounded-lg transition-all duration-300 flex items-center gap-1.5 md:gap-2 ${activeTab === 'watchlist' ? 'bg-amber-600/20 text-amber-400 shadow-[inset_0_-2px_0_0_#f59e0b]' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'}`}>
                                <Star size={14} className="md:w-4 md:h-4" /> <span className="tracking-widest">自選追蹤</span>
                            </button>
                            <div className="flex-1 hidden md:block"></div> 
                            <button onClick={() => setActiveTab('forbidden')} className={`shrink-0 py-1.5 md:py-2 px-3 md:px-4 rounded-lg transition-all duration-300 flex items-center gap-1.5 md:gap-2 ${activeTab === 'forbidden' ? 'bg-red-600/20 text-red-400 shadow-[inset_0_-2px_0_0_#ef4444]' : 'text-slate-400 hover:text-red-400/80 hover:bg-red-900/10'}`}>
                                <Ban size={14} className="md:w-4 md:h-4" /> <span className="tracking-widest">防護網</span>
                            </button>
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 mt-6 md:mt-8">
                        {activeTab === 'journal' && (
                            <StockJournal logs={logs} setLogs={setLogs} epsData={epsData} setEpsData={setEpsData} customStocks={customStocks} setCustomStocks={setCustomStocks} stockMap={stockMap} forbiddenStocks={forbiddenStocks} onAiDiagnose={handleAiDiagnose} />
                        )}
                        {activeTab === 'calculator' && (
                            <CalculatorModule calcHistory={calcHistory} setCalcHistory={setCalcHistory} stockMap={stockMap} setCustomStocks={setCustomStocks} epsData={epsData} />
                        )}
                        {activeTab === 'plan' && (
                            <PlanDashboard logs={logs} setLogs={setLogs} stockMap={stockMap} setCustomStocks={setCustomStocks} epsData={epsData} forbiddenStocks={forbiddenStocks} onAiReview={handleAiReview} />
                        )}
                        {activeTab === 'watchlist' && (
                            <WatchlistModule logs={logs} setLogs={setLogs} epsData={epsData} stockMap={stockMap} forbiddenStocks={forbiddenStocks} onAiDiagnose={handleAiDiagnose} />
                        )}
                        {activeTab === 'forbidden' && (
                            <ForbiddenModule forbiddenStocks={forbiddenStocks} setForbiddenStocks={setForbiddenStocks} stockMap={stockMap} setCustomStocks={setCustomStocks} />
                        )}
                    </main>

                    {/* AI 教練彈出視窗 */}
                    <AiModal 
                        isOpen={aiModal.isOpen} 
                        onClose={() => setAiModal({ ...aiModal, isOpen: false })} 
                        content={aiModal.content} 
                        loading={aiModal.loading} 
                        title={aiModal.title} 
                    />
                    
                    {/* 全局提示彈窗 */}
                    <AlertModal isOpen={appAlert.show} message={appAlert.msg} onClose={() => setAppAlert({ show: false, msg: '' })} />
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
