<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>萊恩飆股起漲手札 - 跨裝置交易決策系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <style type="text/tailwindcss">
        @layer components {
            .card-panel { @apply bg-white dark:bg-gray-800 rounded-xl shadow-lg border border-gray-200 dark:border-gray-700 transition-colors duration-300; }
            
            /* 優化：鎖定高度，徹底解決 iOS Safari 日期框與文字框大小不一的問題 */
            .input-base { 
                @apply w-full h-[42px] bg-gray-50 dark:bg-gray-700/80 border border-gray-300 dark:border-gray-600 rounded-lg px-2 sm:px-3 text-gray-900 dark:text-white text-[13px] sm:text-base focus:outline-none focus:ring-2 focus:ring-blue-500 transition shadow-inner; 
                -webkit-appearance: none !important;
                -moz-appearance: none !important;
                appearance: none !important;
                box-sizing: border-box;
                margin: 0;
            }
            
            /* 修正手機板複製列跑版問題 */
            .btn-copy-base { @apply text-xs font-medium px-2.5 py-1.5 rounded-lg transition border shadow-sm whitespace-nowrap; }
            
            .nav-btn { @apply px-3 sm:px-4 py-2 rounded-lg font-bold transition-all duration-200 text-xs sm:text-sm flex items-center text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800/60 hover:bg-gray-200 dark:hover:bg-gray-700 border-b-2 border-transparent; }
            .nav-btn.active-blue { @apply text-blue-700 dark:text-blue-300 bg-blue-100 dark:bg-blue-900/60 border-blue-500 shadow-sm; }
            .nav-btn.active-purple { @apply text-purple-700 dark:text-purple-300 bg-purple-100 dark:bg-purple-900/60 border-purple-500 shadow-sm; }
            .nav-btn.active-pink { @apply text-pink-700 dark:text-pink-300 bg-pink-100 dark:bg-pink-900/60 border-pink-500 shadow-sm; }
            .nav-btn.active-green { @apply text-green-700 dark:text-green-300 bg-green-100 dark:bg-green-900/60 border-green-500 shadow-sm; }
            .nav-btn.active-yellow { @apply text-yellow-700 dark:text-yellow-300 bg-yellow-100 dark:bg-yellow-900/60 border-yellow-500 shadow-sm; }
            .nav-btn.active-indigo { @apply text-indigo-700 dark:text-indigo-300 bg-indigo-100 dark:bg-indigo-900/60 border-indigo-500 shadow-sm; }

            .nav-btn-mobile { @apply flex-shrink-0 px-4 py-2 text-sm font-medium rounded-lg transition-all duration-200 text-gray-500 dark:text-gray-400 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 border border-transparent; }
            .nav-btn-mobile.active-blue { @apply bg-blue-100 dark:bg-blue-900/60 text-blue-700 dark:text-blue-300 border-blue-300 dark:border-blue-700 shadow-sm; }
            .nav-btn-mobile.active-purple { @apply bg-purple-100 dark:bg-purple-900/60 text-purple-700 dark:text-purple-300 border-purple-300 dark:border-purple-700 shadow-sm; }
            .nav-btn-mobile.active-pink { @apply bg-pink-100 dark:bg-pink-900/60 text-pink-700 dark:text-pink-300 border-pink-300 dark:border-pink-700 shadow-sm; }
            .nav-btn-mobile.active-green { @apply bg-green-100 dark:bg-green-900/60 text-green-700 dark:text-green-300 border-green-300 dark:border-green-700 shadow-sm; }
            .nav-btn-mobile.active-yellow { @apply bg-yellow-100 dark:bg-yellow-900/60 text-yellow-700 dark:text-yellow-300 border-yellow-300 dark:border-yellow-700 shadow-sm; }
            .nav-btn-mobile.active-indigo { @apply bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 border-indigo-300 dark:border-indigo-700 shadow-sm; }
        }
    </style>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #4b5563; }
        
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }

        body { transition: background-color 0.3s, color 0.3s; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .tw-red { color: #ef4444; } .tw-green { color: #22c55e; }
        .sortable, .plan-sortable, .revenue-sortable, .report-sortable { cursor: pointer; user-select: none; transition: color 0.2s; }
        .sortable:hover, .plan-sortable:hover, .revenue-sortable:hover, .report-sortable:hover { @apply text-blue-500 dark:text-white; }
        th, td { vertical-align: middle; }

        .cool-title {
            font-family: 'ZCOOL XiaoWei', serif;
            background: linear-gradient(135deg, #3b82f6, #a855f7, #ec4899);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(168, 85, 247, 0.2);
            letter-spacing: 1px;
        }
        .dark .cool-title { 
            background: linear-gradient(135deg, #60a5fa, #c084fc, #f472b6); 
            text-shadow: 0 0 12px rgba(192, 132, 252, 0.5); 
            -webkit-background-clip: text; 
        }

        /* 
         * 強制去除手機原生中文年月日顯示 (無痕過濾技術)
         * 徹底將原生文字設為透明，避免字體重疊，並用 ::after 填上乾淨的 XXXX/XX/XX 格式
         */
        input[type="date"], input[type="month"] { 
            position: relative; 
            color: transparent !important; 
            text-shadow: none !important; 
            -webkit-text-fill-color: transparent !important; 
        }
        input[type="date"]::-webkit-datetime-edit, input[type="month"]::-webkit-datetime-edit {
            color: transparent !important; 
            background: transparent !important;
            -webkit-text-fill-color: transparent !important;
            opacity: 0 !important;
        }
        input[type="date"]::after, input[type="month"]::after {
            content: attr(data-date);
            position: absolute; left: 0; top: 0; right: 0; bottom: 0;
            display: flex; align-items: center; justify-content: center;
            color: #1f2937 !important; 
            -webkit-text-fill-color: #1f2937 !important; 
            pointer-events: none; 
        }
        .dark input[type="date"]::after, .dark input[type="month"]::after {
            color: #f9fafb !important; 
            -webkit-text-fill-color: #f9fafb !important;
        }
        input.text-left[type="date"]::after, input.text-left[type="month"]::after {
            justify-content: flex-start;
            padding-left: 0.25rem;
        }
        @media (min-width: 640px) {
            input.sm\:text-left[type="date"]::after, input.sm\:text-left[type="month"]::after {
                justify-content: flex-start;
                padding-left: 0.75rem; 
            }
        }
        input[type="date"]::-webkit-calendar-picker-indicator, input[type="month"]::-webkit-calendar-picker-indicator {
            position: absolute; top: 0; right: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; background: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans min-h-screen flex flex-col antialiased">
